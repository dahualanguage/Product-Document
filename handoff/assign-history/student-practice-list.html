<script>
/* ---------- 網址參數 ---------- */
const qs = new URLSearchParams(location.search);
const S = { tab: qs.get('tab') === 'optional' ? 'optional' : 'mandatory', type: qs.get('type') || 'all', empty: qs.get('empty') === '1', visible: 5,
  chip: qs.get('chip') || 'first', ladder: qs.get('ladder') || 'overdue', style: qs.get('style') || 'text' };   // 預設不用膠囊：規則是右側一塊字（&style=chip 看膠囊版）   // 探索：&chip=first|seq · &ladder=overdue|all（還沒到期的三段怎麼寫）

/* ---------- 日期（照 game-ui/utils.js formatDueChip ＋ assignment/classify getDayDifference）---------- */
const dayDiff = (iso) => { const d = new Date(iso.slice(0, 10) + 'T12:00'), n = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate(), 12); return Math.round((d - n) / 864e5); };
const dueChip = (iso) => {
  if (!iso) return null;
  const diff = dayDiff(iso);
  if (diff < 0) return { label: `Overdue · ${Math.abs(diff)}d`, tone: 'overdue' };
  if (diff === 0) { const h = Math.max(0, Math.floor((new Date(iso) - NOW) / 36e5)); return { label: h < 1 ? 'Today · <1h' : `Today · ${h}h`, tone: 'today' }; }
  if (diff === 1) return { label: 'Tomorrow', tone: 'soon' };
  const d = new Date(iso.slice(0, 10) + 'T12:00');
  return { label: d.toLocaleDateString('en-NZ', diff <= 6 ? { weekday: 'short' } : { month: 'short', day: 'numeric' }), tone: 'ok' };
};
const typeOf = (a) => TYPE_ENTRIES.find(t => t.id === a.typeId);
const colorsOf = (a) => COLUMN_COLORS[typeOf(a).col];
/* 第四十輪：規則→階段（跟老師端 renderTiers 同一個算法：第 n 天＝Due 後第 n 天） */
const addDays = (iso, n) => { const d = new Date(iso.slice(0, 10) + 'T12:00'); d.setDate(d.getDate() + n); return d; };
const dShort = (d) => d.toLocaleDateString('en-NZ', { month: 'short', day: 'numeric' });
const stagesOf = (a) => { if (!a.late || a.isOptional) return null;
  const st = a.late.tiers.map((t, k, arr) => ({ start: addDays(a.expiredDate, t.days), end: k < arr.length - 1 ? addDays(a.expiredDate, arr[k + 1].days - 1) : null, credit: 100 - t.off }));
  const today = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate(), 12);
  const cur = new Date(a.expiredDate) < NOW ? st.filter(x => x.start <= today).length - 1 : -1;
  return { st, cur }; };
const lateChip = (a) => { const L = stagesOf(a); if (!L || S.style === 'text') return '';
  if (L.cur < 0) return `<span class="chip late">Late work ${S.chip === 'seq' && L.st.length > 1 ? L.st.map(x => `${x.credit}%`).join(' → ') : `${L.st[0].credit}%`}</span>`;
  const c = L.st[Math.max(L.cur, 0)].credit; return `<span class="chip late now">${c ? `Counts ${c}% now` : 'No credit now'}</span>`; };
/* 探索 &style=text：不用膠囊——規則是標題下一行 12px 字。到期前「Late work counts 90%」；過期後「Now counts 90%」＋ 後面幾段，現在這段珊瑚色 */
/* 右側一塊字（使用者：字放大擺在右側）：第一行 14px 是現在的規則，第二行 12px 是後面幾段 */
const lateText = (a) => { const L = stagesOf(a); if (!L) return '';
  /* 第二行一律「數字 from 日期」的語序（使用者 2026-09-30 定）：80% from 20 Sept · 0% from 24 Sept；到期前前面加 then */
  const rest = (list) => list.map(x => `${x.credit}% from ${dShort(x.start)}`).join(' · ');
  if (L.cur < 0) return `<div class="late-r"><b><span class="mi">info</span>Late work counts ${L.st[0].credit}%</b>${L.st.length > 1 ? `<small>then ${rest(L.st.slice(1))}</small>` : ''}</div>`;
  const c = L.st[L.cur].credit, after = L.st.slice(L.cur + 1);
  return `<div class="late-r now"><b><span class="mi">warning</span>${c ? `Now counts ${c}%` : 'No credit now'}</b>${after.length ? `<small>${rest(after)}</small>` : ''}</div>`; };
const ladder = (a) => { if (S.style === 'text') return ''; const L = stagesOf(a); if (!L || (L.cur < 0 && !(S.ladder === 'all' && L.st.length > 1))) return '';
  const span = (x) => !x.end ? `from ${dShort(x.start)}` : x.start.getMonth() === x.end.getMonth() ? `${x.start.getDate()}–${dShort(x.end)}` : `${dShort(x.start)}–${dShort(x.end)}`;   // 同月：18–19 Sept
  return `<div class="ladder">${L.st.map((x, k) => { const t = `${span(x)} ${x.credit}%`; return k === L.cur ? `<b>${t}</b>` : t; }).join('<span class="dot">·</span>')}</div>`; };
const ctaOf = (a) => { const s = a.isComplete && !a.isSubmitted ? 'Submit' : a.progress > 0 ? 'Continue' : 'Start'; return a.isOptional ? (s === 'Start' ? 'Pick up' : s) : `${s} ▸`; };

/* ---------- 分段（list/utils.js selectMandatorySections）---------- */
const items = S.empty ? ASSIGNMENTS.filter(a => a.isOptional) : ASSIGNMENTS;
const mandatory = items.filter(a => !a.isOptional && !(a.isComplete && a.isSubmitted));
const today = mandatory.filter(a => dayDiff(a.expiredDate) <= 0).sort((x, y) => { const xo = new Date(x.expiredDate) < NOW, yo = new Date(y.expiredDate) < NOW; return xo === yo ? (xo ? new Date(y.expiredDate) - new Date(x.expiredDate) : new Date(x.expiredDate) - new Date(y.expiredDate)) : (xo ? 1 : -1); });
const later = mandatory.filter(a => dayDiff(a.expiredDate) > 0).sort((x, y) => new Date(x.expiredDate) - new Date(y.expiredDate));
const optional = items.filter(a => a.isOptional && !(a.isComplete && a.isSubmitted) && (a.isComplete || dayDiff(a.expiredDate) >= 0));
const counts = { mandatory: today.length + later.length, optional: optional.length };
const byType = (list) => list.filter(a => S.type === 'all' || a.typeId === S.type);

/* ---------- render ---------- */
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rowHTML(a, i){
  const t = typeOf(a), c = colorsOf(a), d = dueChip(a.expiredDate);
  return `<div class="row" style="animation-delay:${Math.min(i, 8) * 45}ms">
    <span class="tile" style="background:${c.bg}; color:${c.text}"><span class="mi">${t.icon}</span></span>
    <div class="meta"><div class="top"><span class="chip type" style="background:${c.bg}; color:${c.text}">${t.label}</span>${d ? `<span class="chip due-${d.tone}">${d.label}</span>` : ''}${lateChip(a)}</div>
      <h5 title="${esc(a.name)}">${esc(a.name)}</h5>${ladder(a)}</div>
    ${S.style === 'text' ? lateText(a) : ''}
    <button class="cta ${a.isOptional ? 'purple' : 'green'}" aria-label="${ctaOf(a)}: ${esc(a.name)}">${ctaOf(a)}</button></div>`;
}
const section = (title, badge, hint, list) => `<div class="sec-title"><b>${title}</b><span class="badge ${badge}">${list.length}</span><small>${hint}</small></div><div class="list">${list.map(rowHTML).join('')}</div>`;
const more = (shown, total) => total - shown > 0 ? `<div class="more"><button>Load ${Math.min(5, total - shown)} more</button></div>` : '';
const typeLabel = S.type === 'all' ? null : TYPE_ENTRIES.find(t => t.id === S.type).label;
const emptyTitle = typeLabel ? `No ${typeLabel} practice here` : 'No practice here';

function render(){
  let body = '';
  if (S.tab === 'mandatory'){
    const ft = byType(today), fl = byType(later);
    const vt = ft.slice(0, S.visible), vl = fl.slice(0, Math.max(S.visible - vt.length, 0));
    const secs = [vt.length ? section('Today', 'today', 'Required practice due today', vt) : '', vl.length ? section('Later', 'later', 'Save these for another time', vl) : ''].join('');
    if (secs) body = secs + more(vt.length + vl.length, ft.length + fl.length);
    else if (typeLabel && mandatory.length) body = `<div class="empty none"><div class="ico">∅</div><h4>${emptyTitle}</h4><p>Try another type filter.</p></div>`;
    else body = `<div class="empty clear"><div class="ico">✓</div><h4>You have all caught up!</h4><p>You can relax or try a bonus practice. 🌱</p></div>`;
  } else {
    const fo = byType(optional), vo = fo.slice(0, S.visible);
    body = vo.length ? section('Bonus practice', 'bonus', 'Extra credit — try if you like!', vo) + more(vo.length, fo.length)
      : `<div class="sec-title"><b>Bonus practice</b><span class="badge bonus">0</span><small>Extra credit — try if you like!</small></div><div class="empty none" style="margin-top:0"><div class="ico">∅</div><h4>${emptyTitle}</h4><p>${typeLabel ? 'Try another type filter.' : 'Bonus practice will appear here when available.'}</p></div>`;
  }
  document.getElementById('canvas').innerHTML = `
    <h1>My Assignments</h1><p class="lead">Pick one practice and give it your best! 💪</p>
    <div class="segtabs">
      <button class="seg mandatory ${S.tab === 'mandatory' ? 'on' : ''}" data-tab="mandatory"><span class="sico">✓</span>Mandatory<span class="scnt">${counts.mandatory}</span></button>
      <button class="seg optional ${S.tab === 'optional' ? 'on' : ''}" data-tab="optional"><span class="sico">✦</span>Optional<span class="scnt">${counts.optional}</span></button>
    </div>
    <div class="filter"><span class="lbl">Type</span><button class="fchip ${S.type === 'all' ? 'on' : ''}" data-type="all">All</button>${TYPE_ENTRIES.map(t => `<button class="fchip ${S.type === t.id ? 'on' : ''}" data-type="${t.id}">${t.label}</button>`).join('')}</div>
    ${body}`;
  const cur = S.empty ? 'l3' : S.type !== 'all' ? 'l2' : S.tab === 'optional' ? 'l1' : 'l0';
  document.querySelectorAll('.bl a').forEach(a => a.classList.toggle('cur', a.id === cur));
}
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]'); if (tab){ S.tab = tab.dataset.tab; S.visible = 5; render(); return; }
  const ty = e.target.closest('[data-type]'); if (ty){ S.type = ty.dataset.type; S.visible = 5; render(); return; }
  if (e.target.closest('.more button')){ S.visible += 5; render(); }
});
render();
</script>
</body>
</html>
