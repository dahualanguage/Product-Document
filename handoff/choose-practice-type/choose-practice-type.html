<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose Practice Type — v1 定案 ＋ 四欄顏色</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  --primary-main:#00CB61; --error-main:#FF5630;
  --g500:#919EAB; --g600:#637381; --g800:#212B36;
  --divider:rgba(145,158,171,.2);

  /* ---------- 四欄的顏色 ----------
     沿用提案 A（＝ live）的色系，一欄一個，值在 <script> 的 TRACKS：
       Content 綠 · Vocabulary 黃 · Sentence 粉 · Comprehension 紫  */
}

body{
  font-family:'Public Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--g800); background:#eef0f3; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 24px;
}

/* ---------- dialog ---------- */
.dlg{ background:#fff; border-radius:24px; width:100%; max-width:1080px;
  display:flex; flex-direction:column;
  box-shadow:0 24px 48px rgba(22,28,36,.16), 0 0 2px rgba(22,28,36,.12); }
.dlg-hd{ padding:24px 24px 12px; }
.dlg-hd h2{ font-size:1.5rem; font-weight:700; }
.dlg-hd p{ font-size:.875rem; color:var(--g600); margin-top:6px; }
.dlg-bd{ padding:8px 24px 16px; overflow-y:auto; }
.dlg-ft{ padding:12px 24px 20px; display:flex; justify-content:flex-end; }

/* ---------- 四欄，欄高 1 / 2 / 3 / 2 ---------- */
.types{ display:grid; grid-template-columns:repeat(4,1fr);
  grid-template-rows:auto repeat(3,auto); column-gap:20px; row-gap:20px; }

/* 欄位標題＋底下一條該欄顏色的線，橫貫整欄。
   線是這一版唯一多出來的裝置：它把四欄畫成四條軌道，
   Content 欄底下那塊空白因此讀成「這條軌道只有一項」，而不是「少了什麼」。 */
.colhead{ grid-row:1; align-self:end; color:var(--label);
  padding-bottom:9px; border-bottom:3px solid var(--ink);
  font-size:.75rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }

/* ---------- 卡片：外框沿用 live 的 PracticeTypeCard ---------- */
.type{ position:relative; background:#fff; border:1px solid var(--divider); border-radius:24px;
  padding:24px; cursor:pointer; text-align:center; transition:border-color .2s ease, box-shadow .2s ease; }
/* hover 的框線改用該欄的顏色（live 是一律主色綠）——
   卡片的歸屬在被碰到的時候再確認一次 */
.type:hover, .type:focus-visible{ border-color:var(--ink); outline:none;
  box-shadow:0 5px 5px -3px rgba(145,158,171,.2),
             0 8px 10px 1px rgba(145,158,171,.14),
             0 3px 14px 2px rgba(145,158,171,.12); }
.type:focus-visible{ box-shadow:0 0 0 3px color-mix(in srgb, var(--ink) 22%, transparent); }

/* 示意圖沿用 teacher-planning.html 的 THUMB 語彙，但把「綠色＝學生會動到的部分」
   一般化成「有顏色＝學生會動到的部分，色相＝哪一欄」。
   #94a3b8 / #cbd5e1 的灰仍然是素材本身，八張共用。 */
.type .thumb{ display:block; margin-bottom:14px; }
.type .thumb svg{ display:block; width:100%; height:auto; }

.type b{ display:block; font-size:1.125rem; line-height:1.5556; font-weight:700; color:var(--g800); }
.type .desc{ display:block; margin-top:12px; font-size:.875rem; line-height:1.5714; color:var(--g600); }

/* NEW = GlowingChip：MUI Chip color="error" small */
.badge{ position:absolute; top:12px; left:12px; z-index:1;
  display:inline-flex; align-items:center; height:24px; padding:0 8px; border-radius:12px;
  background:var(--error-main); color:#fff; font-size:.8125rem; font-weight:800; line-height:1;
  animation:glowPulse 1.6s ease-in-out infinite; }
@keyframes glowPulse{
  0%  { opacity:1;   transform:scale(1);    box-shadow:0 0 0 0 rgba(255,171,0,.35); }
  50% { opacity:.72; transform:scale(1.05); box-shadow:0 0 0 6px rgba(255,171,0,.08); }
  100%{ opacity:1;   transform:scale(1);    box-shadow:0 0 0 0 rgba(255,171,0,0); }
}

.btn{ font:inherit; font-size:.875rem; font-weight:700; border-radius:8px; height:36px;
  padding:0 16px; cursor:pointer; background:#fff; color:var(--g800);
  border:1px solid rgba(145,158,171,.32); }
.btn:hover{ background:rgba(145,158,171,.08); }

@media (prefers-reduced-motion: reduce){
  .badge{ animation:none; }
  .type{ transition:none; }
}

/* 窄螢幕：放棄欄位對齊，軌道線退成一整行的分隔線 */
@media (max-width:1040px){
  .types{ grid-template-columns:repeat(2,1fr); grid-template-rows:none; }
  .type{ grid-column:auto !important; grid-row:auto !important; }
  .colhead{ grid-row:auto; grid-column:1 / -1; margin-top:8px; }
}
@media (max-width:560px){ .types{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="dlg-hd">
    <h2 id="dlgT">Choose Practice Type</h2>
    <p>Select one practice to continue.</p>
  </div>
  <div class="dlg-bd">
    <div class="types" id="types"></div>
  </div>
  <div class="dlg-ft">
    <button class="btn">Cancel</button>
  </div>
</div>

<script>
/* 定案 B＋C ＋ 四欄顏色。

   規則只有一條：示意圖裡「學生會動到的部分」用該欄的顏色畫，其餘維持灰。
   所以顏色不是貼在卡片上的裝飾，而是接管了 THUMB 語彙裡本來就存在的那個語意欄位
   ——原本一律是綠色，現在改成講「這是哪一欄」。

   完整設計說明見 HANDOFF.md 與 spec（連結在 index.html）。 */

const TRACKS = {
  /* 四欄各自繼承「欄內某一張卡在 live 已經有的顏色」，所以老師從舊介面過來認得出來：
     綠 ← Mirroring 的 primary、黃 ← Vocabulary 的 warning、
     粉 ← Sentence Scramble #EC4899、紫 ← Multiple Choice #7C3AED。
     被放掉的兩個（Sentence Patterns 的 #00897B、QA 的 info 藍）正好是卡片換了欄的那兩張。

     ink   = 學生會動到的那一筆（線條、實心的播放鍵與麥克風）
     tint  = 同色相的粉彩填色，被選中／被填入的地方用它（＝ A 方案 icon 圓的底色）
     wash  = 再淡一階，示意圖的底板用它——那塊畫面屬於這條軌道
     label = 壓深到白底上 ≥4.5:1 的同色，只給欄位標題的文字用
             （粉彩的 ink 當 12px 文字讀不動，但當圖形剛好） */
  content:  { ink:'#00B95C', tint:'#BBF1D0', wash:'#EFFBF4', label:'#00754A' },
  vocab:    { ink:'#EFA00B', tint:'#FFE49E', wash:'#FFF8E7', label:'#8F6209' },
  sentence: { ink:'#EC4899', tint:'#FBD5E8', wash:'#FEF2F8', label:'#BE185D' },
  comp:     { ink:'#8B5CF6', tint:'#E9DDFD', wash:'#F7F3FE', label:'#6D28D9' },
};
const thumb = (c, inner) =>
  '<span class="thumb"><svg viewBox="0 0 136 56" role="img" aria-hidden="true">' +
  `<rect x=".5" y=".5" width="135" height="55" rx="7" fill="${c.wash}" stroke="#e6ecf3"/>` + inner + '</svg></span>';

const play = (cy, c) =>
  `<circle cx="17" cy="${cy}" r="7" fill="${c.ink}"/>` +
  `<path d="M15 ${cy - 3} l5 3 -5 3z" fill="#fff"/>`;

/* 說一句話的麥克風膠囊 —— Open-ended Questions 與 Sentence Response 共用同一個手勢 */
const speak = (c) =>
  `<rect x="40" y="35" width="56" height="15" rx="7.5" fill="${c.tint}" stroke="${c.ink}"/>` +
  `<rect x="55" y="39" width="3.5" height="6" rx="1.75" fill="${c.ink}"/>` +
  `<rect x="63" y="41" width="20" height="3" rx="1.5" fill="${c.ink}"/>`;

const THUMB = {
  /* 兩行句子，各自有播放鍵 —— 拼音細、漢字實 */
  MIRRORING: (c) => thumb(c,
    play(18, c) +
    '<rect x="30" y="13" width="72" height="3" rx="1.5" fill="#cbd5e1"/>' +
    '<rect x="30" y="19.5" width="88" height="5" rx="2" fill="#94a3b8"/>' +
    play(40, c) +
    '<rect x="30" y="35" width="56" height="3" rx="1.5" fill="#cbd5e1"/>' +
    '<rect x="30" y="41.5" width="78" height="5" rx="2" fill="#94a3b8"/>'),

  /* 散落的詞塊，和它們該歸位的那一格 */
  SCRAMBLE: (c) => thumb(c,
    '<rect x="17" y="12" width="23" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/>' +
    '<rect x="45" y="9" width="27" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/>' +
    '<rect x="77" y="13" width="21" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/>' +
    '<rect x="103" y="10" width="16" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/>' +
    `<rect x="17" y="34" width="102" height="13" rx="3" fill="none" stroke="${c.ink}" stroke-dasharray="3 3"/>`),

  /* 一張生詞卡，和一支用來唸它的麥克風 */
  VOCAB: (c) => thumb(c,
    '<rect x="44" y="9" width="48" height="21" rx="5" fill="#fff" stroke="#cbd5e1"/>' +
    '<rect x="55" y="16.5" width="26" height="6" rx="2" fill="#94a3b8"/>' +
    `<circle cx="68" cy="42" r="8.5" fill="${c.tint}" stroke="${c.ink}"/>` +
    `<rect x="66" y="37.5" width="4" height="6.5" rx="2" fill="${c.ink}"/>` +
    `<path d="M63.5 42a4.5 4.5 0 0 0 9 0" stroke="${c.ink}" fill="none" stroke-width="1.4"/>`),

  /* 同一個詞，但改成用選的 */
  VOCAB_MC: (c) => thumb(c,
    '<rect x="48" y="8" width="40" height="7" rx="3" fill="#94a3b8"/>' +
    '<rect x="26" y="21" width="84" height="8" rx="4" fill="#fff" stroke="#cbd5e1"/>' +
    `<rect x="26" y="32" width="84" height="8" rx="4" fill="${c.tint}" stroke="${c.ink}"/>` +
    '<rect x="26" y="43" width="84" height="8" rx="4" fill="#fff" stroke="#cbd5e1"/>'),

  /* 一個問句，一個帶空格的句型，然後開口說 */
  SENTENCE_RESPONSE: (c) => thumb(c,
    '<rect x="18" y="10" width="70" height="5" rx="2.5" fill="#94a3b8"/>' +
    '<rect x="18" y="22" width="24" height="4" rx="2" fill="#cbd5e1"/>' +
    `<rect x="46" y="20" width="24" height="8" rx="3" fill="none" stroke="${c.ink}" stroke-dasharray="3 3"/>` +
    '<rect x="74" y="22" width="16" height="4" rx="2" fill="#cbd5e1"/>' +
    speak(c)),

  /* 一個教學點，然後整句自己造出來 */
  SENTENCE_BUILDING: (c) => thumb(c,
    '<rect x="36" y="7" width="64" height="14" rx="7" fill="#fff" stroke="#cbd5e1"/>' +
    '<rect x="46" y="11.5" width="44" height="5" rx="2.5" fill="#94a3b8"/>' +
    `<rect x="18" y="30" width="100" height="16" rx="8" fill="${c.tint}" stroke="${c.ink}"/>` +
    `<rect x="29" y="35" width="3.5" height="6" rx="1.75" fill="${c.ink}"/>` +
    `<rect x="37" y="36.5" width="66" height="3" rx="1.5" fill="${c.ink}"/>`),

  /* 一道題，選中其中一個選項 */
  MC: (c) => thumb(c,
    '<rect x="16" y="9" width="86" height="5" rx="2.5" fill="#94a3b8"/>' +
    '<rect x="16" y="20" width="104" height="8" rx="4" fill="#fff" stroke="#cbd5e1"/>' +
    `<rect x="16" y="31" width="104" height="8" rx="4" fill="${c.tint}" stroke="${c.ink}"/>` +
    '<rect x="16" y="42" width="104" height="8" rx="4" fill="#fff" stroke="#cbd5e1"/>'),

  /* 一段提示，用說的回答 */
  QA: (c) => thumb(c,
    '<rect x="18" y="12" width="86" height="5" rx="2.5" fill="#94a3b8"/>' +
    '<rect x="18" y="22" width="54" height="4" rx="2" fill="#cbd5e1"/>' +
    speak(c)),
};

const GROUPS = [
  { head:'Content', track:'content', items:[
    { art:THUMB.MIRRORING,         title:'Content Mirroring',    desc:'Listen and repeat each sentence' },
  ]},
  { head:'Vocabulary', track:'vocab', items:[
    { art:THUMB.VOCAB,             title:'Vocabulary Mirroring', desc:'Listen and repeat each word' },
    { art:THUMB.VOCAB_MC,          title:'Vocabulary Quiz',      desc:'Image, pinyin &amp; meaning' },
  ]},
  { head:'Sentence', track:'sentence', items:[
    { art:THUMB.SCRAMBLE,          title:'Sentence Scramble',    desc:'Listen, then reorder the words',       isNew:true },
    { art:THUMB.SENTENCE_RESPONSE, title:'Sentence Response',    desc:'Answer questions using a pattern',     isNew:true },
    { art:THUMB.SENTENCE_BUILDING, title:'Sentence Building',    desc:'Build sentences from teaching points', isNew:true },
  ]},
  { head:'Comprehension', track:'comp', items:[
    { art:THUMB.MC,                title:'Comprehension Quiz',   desc:'Auto-graded questions from a bank', isNew:true },
    { art:THUMB.QA,                title:'Open-ended Questions',    desc:'Open questions, AI assessment' },
  ]},
];

const card = (t, g, col, row) => `
  <div class="type" tabindex="0" style="--ink:${TRACKS[g.track].ink};--label:${TRACKS[g.track].label};grid-column:${col + 1};grid-row:${row + 2}">
    ${t.isNew ? '<span class="badge">NEW</span>' : ''}
    ${t.art(TRACKS[g.track])}
    <b>${t.title}</b>
    <span class="desc">${t.desc}</span>
  </div>`;

document.getElementById('types').innerHTML =
  GROUPS.map((g, col) =>
    `<div class="colhead" style="--ink:${TRACKS[g.track].ink};--label:${TRACKS[g.track].label};grid-column:${col + 1}">${g.head}</div>`).join('')
  + GROUPS.map((g, col) => g.items.map((t, row) => card(t, g, col, row)).join('')).join('');
</script>
</body>
</html>
