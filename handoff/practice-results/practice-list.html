<script>
/* ===========================================================================
   v24 共用假資料 —— 基準檔（practice-list-baseline.html）與提案（proposal.html）共用。

   練習列表拿得到的東西（view/index.js ＋ practice-card-config.js buildPracticeAssignmentMap）：
     每個練習：名稱、型別／子型別、版本、專案名、建立時間
     每個練習每個班：班名、Mandatory／Optional、到期日（同一班指派兩次取最新）、學生名單
   拿不到的：交了幾個、平均分（v24 定案 ④ 要請工程一次給 submitted／total；這裡先假設有）

   今天＝2026-11-20（schoolTimezone 以學校為準，這裡不算時區）——定在這一天是為了讓「全球暖化」7A（Nov 18）已結束、7B（Nov 25）還在跑，同一張卡兩種狀態都看得到。
   「結束」照 v24 定案 ①（2026-11-18 改）：**每一班都**過了到期日才算；沒到期日的班永遠不結束。
   所以 In progress（還有一班沒到期）跟 Ended 不再重疊：指派過的練習只會在其中一個。
   =========================================================================== */
window.V24 = (function () {
  const TODAY = '2026-11-20';

  // 型別外觀 = practice-card-config.js getPracticeTypeConfig（卡片的框、頭、icon）＋ practice-type-labels.js 的 tag（chip）
  const TYPES = {
    MIRRORING:        { label: 'Content Mirroring',    tag: { wash: '#DCFCE7', label: '#15803D', icon: 'mic' },         card: { border: '#BBF7D0', headerBg: '#F0FDF4', divider: '#DCFCE7', iconBg: '#DCFCE7', iconColor: '#16A34A', btn: '#00CB61', btnHover: '#00A749' } },
    VOCAB_MIRRORING:  { label: 'Vocabulary Mirroring', tag: { wash: '#FEF3C7', label: '#D97706', icon: 'mic' },         card: { border: '#FDE68A', headerBg: '#FFFBEB', divider: '#FEF3C7', iconBg: '#FEF3C7', iconColor: '#D97706', btn: '#FFAB00', btnHover: '#B76E00' }, icon: 'bookmark' },
    VOCAB_QUIZ:       { label: 'Vocabulary Quiz',      tag: { wash: '#FEF3C7', label: '#D97706', icon: 'bookmark' },    card: { border: '#FDE68A', headerBg: '#FFFBEB', divider: '#FEF3C7', iconBg: '#FEF3C7', iconColor: '#D97706', btn: '#FFAB00', btnHover: '#B76E00' }, icon: 'bookmark' },
    SENTENCE_SCRAMBLE:{ label: 'Sentence Scramble',    tag: { wash: '#FCE7F3', label: '#EC4899', icon: 'view_column' }, card: { border: '#FBCFE8', headerBg: '#FDF2F8', divider: '#FCE7F3', iconBg: '#FCE7F3', iconColor: '#EC4899', btn: '#EC4899', btnHover: '#DB2777' } },
    SENTENCE_CLOZE:   { label: 'Sentence Cloze',       tag: { wash: '#FCE7F3', label: '#EC4899', icon: 'edit_note' },   card: { border: '#FBCFE8', headerBg: '#FDF2F8', divider: '#FCE7F3', iconBg: '#FCE7F3', iconColor: '#EC4899', btn: '#EC4899', btnHover: '#DB2777' }, icon: 'view_column' },
    SENTENCE_BUILDING:{ label: 'Sentence Building',    tag: { wash: '#CCFBF1', label: '#14B8A6', icon: 'route' },       card: { border: '#99F6E4', headerBg: '#F0FDFA', divider: '#CCFBF1', iconBg: '#CCFBF1', iconColor: '#14B8A6', btn: '#14B8A6', btnHover: '#0D9488' } },
    SENTENCE_RESPONSE:{ label: 'Sentence Response',    tag: { wash: '#CCFBF1', label: '#14B8A6', icon: 'route' },       card: { border: '#99F6E4', headerBg: '#F0FDFA', divider: '#CCFBF1', iconBg: '#CCFBF1', iconColor: '#14B8A6', btn: '#14B8A6', btnHover: '#0D9488' } },
    COMPREHENSION_QUIZ:{ label: 'Comprehension Quiz',  tag: { wash: '#EDE9FE', label: '#7C3AED', icon: 'quiz' },        card: { border: '#DDD6FE', headerBg: '#F5F3FF', divider: '#EDE9FE', iconBg: '#EDE9FE', iconColor: '#7C3AED', btn: '#7C3AED', btnHover: '#6D28D9' } },
    OPEN_ENDED:       { label: 'Open-ended Questions', tag: { wash: '#DBEAFE', label: '#2563EB', icon: 'chat_bubble' }, card: { border: '#BFDBFE', headerBg: '#EFF6FF', divider: '#DBEAFE', iconBg: '#DBEAFE', iconColor: '#2563EB', btn: '#508AFC', btnHover: '#193592' } },
  };
  // 卡片 header 的 icon 照 getPracticeTypeConfig（Vocabulary 兩種都是 bookmark、Cloze 跟 Scramble 一樣 view_column）；tag.icon 是型別 chip／標題用的
  const cardIcon = (t) => TYPES[t].icon || TYPES[t].tag.icon;

  // classes: [班名, 到期日 (null＝沒設), optional, submitted, total]
  const PRACTICES = [
    { id: 'p1',  name: '全球暖化',     type: 'VOCAB_MIRRORING',   project: '全球暖化',   created: '2026-11-03', v: 2, classes: [['Class 7A', '2026-11-18', false, 8, 10], ['Class 7B', '2026-11-25', false, 3, 8]] },
    { id: 'p2',  name: '环境保护',     type: 'COMPREHENSION_QUIZ', project: '环境保护',   created: '2026-11-02', v: 1, classes: [['Class 7A', '2026-11-20', false, 5, 10]] },
    { id: 'p3',  name: '我的家人 (2)', type: 'SENTENCE_RESPONSE',  project: '我的家人',   created: '2026-11-01', v: 1, classes: [] },
    { id: 'p4',  name: '我的一天',     type: 'MIRRORING',          project: '我的一天',   created: '2026-10-28', v: 3, classes: [['Class 8A', '2026-11-10', false, 12, 12], ['Class 8B', '2026-11-10', false, 9, 11]] },
    { id: 'p5',  name: '环境保护',     type: 'OPEN_ENDED',         project: '环境保护',   created: '2026-10-27', v: 1, classes: [['Class 7B', null, true, 2, 8]] },
    { id: 'p6',  name: '我的一天',     type: 'SENTENCE_BUILDING',  project: '我的一天',   created: '2026-10-25', v: 1, classes: [['Class 8B', '2026-11-28', false, 0, 11]] },
    { id: 'p7',  name: '我的学校',     type: 'SENTENCE_CLOZE',     project: '我的学校',   created: '2026-10-22', v: 1, classes: [['Class 8A', '2026-11-15', false, 7, 12], ['Class 8B', '2026-12-01', true, 1, 11]] },
    { id: 'p8',  name: '全球暖化',     type: 'VOCAB_QUIZ',         project: '全球暖化',   created: '2026-10-20', v: 1, classes: [['Class 7A', '2026-11-05', false, 10, 10]] },
    { id: 'p9',  name: '我的一天',     type: 'SENTENCE_SCRAMBLE',  project: '我的一天',   created: '2026-10-15', v: 2, classes: [['Class 8A', '2026-10-30', true, 11, 12]] },
    { id: 'p10', name: '天气',         type: 'OPEN_ENDED',         project: '天气',       created: '2026-10-12', v: 1, classes: [['Class 7B', '2026-11-01', false, 5, 8]] },
    { id: 'p11', name: '春节',         type: 'VOCAB_MIRRORING',    project: '春节',       created: '2026-10-08', v: 1, classes: [] },
    { id: 'p12', name: '春节',         type: 'MIRRORING',          project: '春节',       created: '2026-10-05', v: 1, classes: [['Class 7A', '2026-10-20', false, 6, 10]] },
  ].map((p) => ({
    ...p,
    classes: p.classes.map(([name, due, optional, submitted, total]) => ({ name, due, optional, submitted, total, ended: !!due && due < TODAY })),
  }));

  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtDay = (d) => { const [, m, dd] = d.split('-').map(Number); return `${MONTHS[m - 1]} ${dd}`; };
  const daysUntil = (d) => Math.round((new Date(d) - new Date(TODAY)) / 86400000);

  // v24 定案 ①②：Ended＝任一班過期；In progress＝任一班還沒過期或沒到期日；沒指派的只在 All
  const isEnded = (p) => p.classes.length > 0 && p.classes.every((c) => c.ended);   // 2026-11-18 改：每一班都過了到期日才算 Ended（原本任一班）；沒到期日的班永遠不結束，所以這張也不會進 Ended
  const inProgress = (p) => p.classes.some((c) => !c.ended);
  const latestEnd = (p) => p.classes.filter((c) => c.ended).map((c) => c.due).sort().pop() || '';
  const byCreated = (a, b) => b.created.localeCompare(a.created);
  const byEnded = (a, b) => latestEnd(b).localeCompare(latestEnd(a)) || byCreated(a, b);   // 定案 ⑤
  const listFor = (tab) => {
    if (tab === 'ended') return PRACTICES.filter(isEnded).sort(byEnded);
    if (tab === 'progress') return PRACTICES.filter(inProgress).sort(byCreated);
    if (tab === 'unassigned') return PRACTICES.filter((p) => !p.classes.length).sort(byCreated);   // 2026-11-17：一個班都還沒指派
    return [...PRACTICES].sort(byCreated);
  };
  const counts = () => ({ all: PRACTICES.length, unassigned: PRACTICES.filter((p) => !p.classes.length).length, progress: PRACTICES.filter(inProgress).length, ended: PRACTICES.filter(isEnded).length });

  // 進 v23 Results 頁要帶的 type（v23 mock.js 的 PRACTICES key）
  const V23_TYPE = { MIRRORING: 'mirroring', VOCAB_MIRRORING: 'vocab', VOCAB_QUIZ: 'vocabquiz', SENTENCE_SCRAMBLE: 'scramble', SENTENCE_CLOZE: 'scramble', SENTENCE_BUILDING: 'building', SENTENCE_RESPONSE: 'response', COMPREHENSION_QUIZ: 'quiz', OPEN_ENDED: 'openended' };
  const resultHref = (p, file, extra = '') => {
    const cls = p.classes.map((k) => `${k.name}|${k.due ? `Due ${fmtDay(k.due)}` : `From ${fmtDay(p.created)}`}`).join(';');
    return `results.html?type=${V23_TYPE[p.type]}&name=${encodeURIComponent(p.name)}&cls=${encodeURIComponent(cls)}${extra}`;
  };
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  return { TODAY, TYPES, PRACTICES, cardIcon, fmtDay, daysUntil, isEnded, inProgress, latestEnd, listFor, counts, resultHref, esc };
}());

</script>

.pager span.nav{ color:var(--text3); }
.emptyc{ padding:56px 24px; text-align:center; color:var(--text2); font-size:14px; }
.emptyc b{ display:block; font-size:16px; font-weight:700; color:var(--text); margin-bottom:4px; }
.emptyc .mi{ font-size:36px; color:var(--text3); display:block; margin:0 auto 8px; }

/* ---------- 卡片 ---------- */
.pc{ display:flex; flex-direction:column; height:100%; cursor:pointer; position:relative; border-radius:24px; border:1px solid; overflow:hidden; transition:box-shadow .2s; }
.pc:hover{ box-shadow:0 4px 16px rgba(0,0,0,.08); }
.pc-hd{ padding:20px 16px 16px 24px; display:flex; align-items:flex-start; gap:12px; border-bottom:1px solid; }
.pc-hd .tico{ width:40px; height:40px; border-radius:16px; flex:none; display:flex; align-items:center; justify-content:center; }
.pc-hd .tico .mi{ font-size:22px; }
.pc-hd .ttl{ flex:1; min-width:0; }
.pc-hd .nm{ display:flex; align-items:baseline; gap:6px; }
.pc-hd .nm b{ font-size:18px; font-weight:700; line-height:1.5; overflow-wrap:anywhere; }
.pc-hd .nm .v{ font-size:11px; color:var(--text3); flex:none; }
.pc-hd .typechip{ margin-top:4px; }
.pc-bd{ padding:24px 24px 16px; flex:1; display:flex; flex-direction:column; gap:16px; }
.ctx .l{ font-size:12px; font-weight:500; color:#9CA3AF; }
.ctx .vrow{ display:flex; align-items:center; gap:6px; }
.ctx .vrow .mi{ font-size:18px; color:#6B7280; }
.ctx .vrow b{ font-size:14px; font-weight:700; color:#374151; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.asg{ padding-top:12px; border-top:1px solid #E5E7EB; }
.asg .hd{ display:flex; align-items:center; gap:6px; margin-bottom:6px; font-size:12px; font-weight:600; color:#6B7280; }
.asg .hd .mi{ font-size:14px; color:#9CA3AF; }
/* 2026-11-18：每班兩行（使用者「這邊太擠了，教室名稱也有可能會更長」）——第一行班名（長就 … 截斷）＋ Mandatory／Optional；第二行狀態小字 */
.asg .row{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.asg .row + .row{ margin-top:10px; }
.asg .row .l1{ display:flex; align-items:center; gap:6px; min-width:0; }
.asg .row .clschip{ flex:0 1 auto; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; display:block; line-height:24px; }
.clschip{ height:24px; padding:0 8px; border-radius:8px; background:#F3F4F6; color:#374151; font-size:11.2px; font-weight:600; display:inline-flex; align-items:center; white-space:nowrap; flex:none; }
.achip{ height:20px; padding:0 8px; border-radius:12px; font-size:11px; font-weight:600; display:inline-flex; align-items:center; flex:none; }
.achip.m{ background:#F1F5F9; color:#475569; } .achip.o{ background:#E0E7FF; color:#3730A3; }
.asg .st{ font-size:11px; font-weight:600; color:#9CA3AF; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; padding-left:2px; }   /* 第二行，靠左 */
.asg .st.soon{ color:#10B981; }
.asg .st.ended{ color:#374151; }
.asg .st .sub{ font-weight:800; color:var(--text); }
.asg .st .sub.all{ color:var(--primary-dark); }
.pc-ft{ display:flex; gap:8px; padding:0 24px 24px; margin-top:auto; }
.pc-ft button{ flex:1; height:36px; border-radius:8px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.pc-ft .test{ background:transparent; border:1px solid; }
.pc-ft .res{ border:0; color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); }
.pc-ft .res:disabled, .btn:disabled{ background:rgba(145,158,171,.24) !important; color:rgba(145,158,171,.8) !important; box-shadow:none; cursor:not-allowed; border-color:transparent; }   /* MUI contained disabled */
.menu div.dis, .menu div.dis .mi{ color:var(--text3); cursor:not-allowed; } .menu div.dis:hover{ background:transparent; }
.pc-ft .mi{ font-size:16px; }
.assignnow{ width:100%; height:36px; border:1px dashed #D1D5DB; border-radius:12px; background:transparent; color:#9CA3AF; font-size:13px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.assignnow:hover{ color:var(--error); border-color:var(--error); background:#FFE9D5; }
.assignnow .mi{ font-size:18px; }
.menu{ position:absolute; top:52px; right:16px; z-index:20; background:#fff; border:1px solid var(--divider); border-radius:10px; padding:4px; min-width:180px; box-shadow:0 0 2px rgba(145,158,171,.2), 0 12px 32px -8px rgba(33,43,54,.22); }
.menu div{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:6px; font-size:14px; }
.menu div:hover{ background:var(--grey200); }
.menu div .mi{ font-size:18px; color:var(--text2); }
.menu div.del, .menu div.del .mi{ color:var(--error); }

/* ---------- 列表列 ---------- */
.rows{ display:flex; flex-direction:column; gap:10px; }
.prow{ display:flex; align-items:center; gap:14px; padding:12px 12px 12px 16px; cursor:pointer; position:relative; transition:border-color .15s; }
.prow:hover{ border-color:var(--text3); }
.prow{ border-color:#E5E7EB; border-radius:16px; }
.prow:hover{ background:#F9FAFB; border-color:#D1D5DB; }
.prow .tico{ width:48px; height:48px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
.prow .tico .mi{ font-size:24px; }
.prow .c{ flex:1; min-width:0; }
.prow .c .t{ display:flex; align-items:center; gap:8px; }
.prow .c .t b{ font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prow .c .t .v{ font-size:11px; color:var(--text3); }
.prow .meta{ font-size:12px; color:var(--text2); margin-top:2px; display:flex; gap:6px; align-items:center; }
.prow .asgcol{ width:300px; flex:none; display:flex; flex-direction:column; gap:3px; }
.prow .asgcol .row{ display:flex; align-items:center; gap:8px; font-size:12px; }
.prow .asgcol .cls{ font-weight:600; width:90px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }   /* 2026-11-18：長班名截斷 */
.prow .asgcol .st{ color:#9CA3AF; font-weight:600; display:flex; align-items:center; gap:6px; }
.prow .asgcol .st.ended{ color:#374151; }
.prow .asgcol .sub{ font-weight:700; }
.prow .asgcol .none{ font-size:12px; color:var(--text3); }
.prow .acts{ display:flex; align-items:center; gap:4px; flex:none; }
.prow .menu{ top:52px; right:12px; }

/* ---------- 說明條 ---------- */
.baseline{ position:fixed; left:0; right:0; bottom:0; background:#1B3A2A; color:#fff; font-size:12px; padding:8px 16px; display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; z-index:60; }
.baseline b{ color:#BBF1D0; }
.baseline a{ color:#fff; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.35); }
.baseline .bl-home{ display:inline-flex; align-items:center; gap:2px; border:1px solid rgba(255,255,255,.35); border-radius:6px; padding:1px 8px 1px 4px; margin-right:12px; font-weight:700; } .baseline .bl-home .mi{ font-size:14px; }
.baseline a.cur{ color:#BBF1D0; border-bottom-color:#BBF1D0; font-weight:700; }
</style>
</head>
<body>

<aside class="side">
  <div class="logo"><img src="https://project-logeg.vercel.app/specs/chinese-modules/assets/dh_single.png" alt="Dahua.ai"><b>Dahua<i>.ai</i></b></div>
  <nav class="nav">
    <div class="grp"><div class="sh blank">&nbsp;</div>
      <a href="../dashboard-assignments/dashboard.html"><span class="mi">space_dashboard</span>Dashboard</a></div>
    <div class="grp"><div class="sh">content</div>
      <a href="#"><span class="mi">folder</span>Projects</a></div>
    <div class="grp"><div class="sh">practice</div>
      <a href="#" class="on"><span class="mi">assignment</span>Practice List</a>
      <a href="#"><span class="mi">sports_esports</span>Word Game</a></div>
    <div class="grp"><div class="sh">overview</div>
      <a href="#"><span class="mi">people</span>Students</a>
      <a href="#"><span class="mi">school</span>Classes</a>
      <a href="#"><span class="mi">emoji_events</span>Leaderboard</a>
      <a href="#"><span class="mi">groups</span>Program</a></div>
  </nav>
  <div class="report"><a href="#">Report Issue</a></div>
</aside>

<div class="mainwrap">
  <div class="hdr"><div class="acct"><div class="av">L</div></div></div>
  <div class="main"><div class="container" id="app"></div></div>
</div>

<div class="baseline">
  <span><a href="https://project-logeg.vercel.app/specs/chinese-modules/iterations/index.html" class="bl-home" title="Versions &amp; Iteration index"><span class="mi">arrow_back</span>Index</a><b>交接包</b>　Practice 列表（All｜Unassigned｜In progress｜Ended）· 按 Result 進 <a href="results.html?type=vocab" id="blbase">Results 頁 ↗</a></span>
  <span id="blinks"></span>
</div>

<script>
(function(){
  const M = window.V24; const esc = M.esc;
  const qs = new URLSearchParams(location.search);
  const TABS = [['all', 'All'], ['unassigned', 'Unassigned'], ['progress', 'In progress'], ['ended', 'Ended']];   // 2026-11-17：多 Unassigned（使用者），照生命週期排在 All 後面
  if (qs.get('longcls') === '1') M.PRACTICES.forEach((p) => p.classes.forEach((k) => { k.name = { 'Class 7A': 'Grade 7 Chinese · Section A (Mon/Wed)', 'Class 8B': 'Heritage Chinese 8B — Afternoon' }[k.name] || k.name; }));   // 2026-11-18 demo：長班名
  const S = { tab: ['all', 'unassigned', 'progress', 'ended'].includes(qs.get('tab')) ? qs.get('tab') : 'all', view: qs.get('view') === 'list' ? 'list' : 'card', menu: qs.get('menu') === '1' ? 0 : -1, empty: qs.get('empty') === '1', page: 0 };
  const PER = 12;

  // 每班一列：結束了寫 Ended Nov 18 ＋ 8/10 submitted；還在跑寫 Due Nov 25；沒到期日寫 No due date（定案 ①④）
  // 照產品 getDueDateLabel：七天內綠；過期不再寫紅字 Overdue，改成 Ended ＋ 交卷數（定案 ①④⑥）
  const statusOf = (k) => {
    if (k.ended) return `<span class="st ended">Ended ${M.fmtDay(k.due)}<span style="color:#C4CDD5">·</span><span class="sub num ${k.submitted === k.total ? 'all' : ''}">${k.submitted}/${k.total} submitted</span></span>`;
    if (!k.due) return '<span class="st">No due date</span>';
    return `<span class="st ${M.daysUntil(k.due) <= 7 ? 'soon' : ''}">Due ${M.fmtDay(k.due)}</span>`;
  };
  const classRow = (k) => `<div class="row"><div class="l1"><span class="clschip" title="${esc(k.name)}">${esc(k.name)}</span><span class="achip ${k.optional ? 'o' : 'm'}">${k.optional ? 'Optional' : 'Mandatory'}</span></div>${statusOf(k)}</div>`;   // 2026-11-18：兩行
  // 還沒有成績：沒指派、或每一班都 0 人交（使用者 11/12）。原因寫在 title 裡
  const resHref = (p) => M.resultHref(p, 'proposal.html', `&back=${S.tab}${S.view === 'list' ? '&view=list' : ''}`);
  const noResult = (p) => (!p.classes.length ? 'Not assigned yet' : p.classes.every((k) => !k.submitted) ? 'No submissions yet' : '');
  const sortedClasses = (p) => [...p.classes].sort((a, b) => (b.ended - a.ended) || (a.due || '9').localeCompare(b.due || '9'));   // 結束的排前面
  const menu = (p, list) => {
    const nr = noResult(p);
    const items = [...(p.classes.length ? [['groups', 'Assign practice']] : []), ...(list ? [['science', 'Test'], ['grading', 'Result', nr ? 'dis' : '', nr, nr ? '' : resHref(p)]] : []), ['share', 'Share'], ['content_copy', 'Clone'], ['edit', 'Edit'], ['delete_outline', 'Delete', 'del']];
    return `<div class="menu">${items.map(([i, l, c, t, href]) => `<div class="${c || ''}" ${t ? `title="${t}" aria-disabled="true"` : ''} ${href ? `data-href="${href}"` : ''}><span class="mi">${i}</span>${l}</div>`).join('')}</div>`;
  };
  const tico = (p) => { const c = M.TYPES[p.type].card; return `<span class="tico" style="background:${c.iconBg};color:${c.iconColor}"><span class="mi">${M.cardIcon(p.type)}</span></span>`; };
  const chip = (p) => { const T = M.TYPES[p.type]; return `<span class="typechip" style="background:${T.tag.wash};color:${T.tag.label}">${T.label}</span>`; };

  const card = (p, i) => { const c = M.TYPES[p.type].card; return `<div class="pc" style="border-color:${c.border}">
      <div class="pc-hd" style="background:${c.headerBg};border-color:${c.divider}">${tico(p)}<div class="ttl"><div class="nm"><b>${esc(p.name)}</b><span class="v">v${p.v}</span></div>${chip(p)}</div><button class="ibtn" data-menu="${i}" aria-label="More"><span class="mi">more_vert</span></button></div>
      <div class="pc-bd">
        <div class="ctx"><div class="l">Belongs to</div><div class="vrow"><span class="mi">folder</span><b>${esc(p.project)}</b></div></div>
        ${p.classes.length ? `<div class="asg"><div class="hd"><span class="mi">groups</span>Assigned to ${p.classes.length} ${p.classes.length === 1 ? 'class' : 'classes'}</div>${sortedClasses(p).map(classRow).join('')}</div>`
          : `<div class="asg"><button class="assignnow"><span class="mi">groups</span>Assign Now</button></div>`}
      </div>
      <div class="pc-ft"><button class="test" style="color:${c.btn};border-color:${c.border}"><span class="mi">science</span>Test</button><button class="res" style="background:${c.btn}" ${noResult(p) ? `disabled title="${noResult(p)}"` : `data-href="${resHref(p)}"`}><span class="mi">grading</span>Result</button></div>
      ${S.menu === i ? menu(p, false) : ''}
    </div>`; };
  const row = (p, i) => `<div class="card prow">${tico(p)}
      <div class="c"><div class="t"><b>${esc(p.name)}</b><span class="v">v${p.v}</span>${chip(p)}</div><div class="meta"><span class="mi" style="font-size:14px">folder</span>${esc(p.project)} · ${p.created}</div></div>
      <div class="asgcol">${p.classes.length ? sortedClasses(p).map((k) => `<div class="row"><span class="cls">${esc(k.name)}</span><span class="achip ${k.optional ? 'o' : 'm'}">${k.optional ? 'Optional' : 'Mandatory'}</span>${k.ended ? `<span class="st ended">Ended ${M.fmtDay(k.due)} · <span class="sub num">${k.submitted}/${k.total}</span></span>` : `<span class="st">${k.due ? `Due ${M.fmtDay(k.due)}` : 'No due date'}</span>`}</div>`).join('') : '<span class="none">Not assigned</span>'}</div>
      <div class="acts"><button class="btn outlined sm" ${noResult(p) ? `disabled title="${noResult(p)}"` : `data-href="${resHref(p)}"`}><span class="mi">grading</span>Result</button><button class="ibtn" data-menu="${i}" aria-label="More"><span class="mi">more_vert</span></button></div>
      ${S.menu === i ? menu(p, true) : ''}</div>`;

  const emptyFor = (tab) => ({
    all: '<span class="mi">assignment</span><b>No data</b>Create a practice to see it here.',
    progress: '<span class="mi">hourglass_empty</span><b>Nothing in progress</b>Assign a practice and it shows here until its due date passes.',
    ended: '<span class="mi">grading</span><b>No ended assignments yet</b>A practice shows here once all of its classes pass their due date.',
  }[tab]);

  const render = () => {
    const n = S.empty ? { all: 0, unassigned: 0, progress: 0, ended: 0 } : M.counts();
    const tabs = TABS.filter(([k]) => k !== 'unassigned' || n.unassigned);   // 2026-11-17：沒有未指派的練習就不出這個 tab（使用者）
    if (!tabs.some(([k]) => k === S.tab)) S.tab = 'all';
    const list = S.empty ? [] : M.listFor(S.tab);
    const pages = Math.max(1, Math.ceil(list.length / PER));
    const shown = list.slice(S.page * PER, S.page * PER + PER);
    document.getElementById('app').innerHTML = `
      <div class="pagehd"><div class="h4"><span class="tico"><span class="mi">assignment</span></span><div>Practice List<div class="sub">Create and assign practice sessions.</div></div></div>
        <div class="hdr-r"><button class="btn contained"><span class="mi">add</span>New practice</button><div class="seg icons"><button class="${S.view === 'card' ? 'on' : ''}" data-view="card" aria-label="Card view"><span class="mi">view_module</span></button><button class="${S.view === 'list' ? 'on' : ''}" data-view="list" aria-label="List view"><span class="mi">table_rows</span></button></div></div></div>
      <div class="card">
        <div class="filters one">
          <div class="ftabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.tab === k}" class="${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}<span class="n num">${n[k]}</span></button>`).join('')}</div>
          <span class="fsep"></span>
          <span class="dd-trig">Type<span class="mi caret">expand_more</span></span>
          <span class="dd-trig">Assignment<span class="mi caret">expand_more</span></span>
          <span class="dd-trig">Class<span class="mi caret">expand_more</span></span>
          <span class="fright"><span class="inp" style="width:200px"><span class="mi">search</span><span>Search…</span></span></span>
        </div>
        <div class="listwrap">
          ${list.length ? (S.view === 'card' ? `<div class="grid">${shown.map(card).join('')}</div>` : `<div class="rows">${shown.map(row).join('')}</div>`)
            + `<div class="pager"><span class="nav mi">chevron_left</span>${Array.from({ length: pages }, (_, k) => `<span class="${k === S.page ? 'on' : ''}">${k + 1}</span>`).join('')}<span class="nav mi">chevron_right</span></div>`
          : `<div class="emptyc">${emptyFor(S.tab)}</div>`}
        </div>
      </div>`;
    document.title = `Practice List · ${TABS.find(([k]) => k === S.tab)[1]} — v24 提案`;
  };
  document.getElementById('app').addEventListener('click', (e) => {
    const go = e.target.closest('[data-href]'); if (go) { location.href = go.dataset.href; return; }
    const t = e.target.closest('[data-tab]'); if (t) { S.tab = t.dataset.tab; S.menu = -1; S.page = 0; render(); return; }
    const v = e.target.closest('[data-view]'); if (v) { S.view = v.dataset.view; S.menu = -1; render(); return; }
    const m = e.target.closest('[data-menu]'); if (m) { const i = Number(m.dataset.menu); S.menu = S.menu === i ? -1 : i; render(); return; }
    if (S.menu >= 0 && !e.target.closest('.menu')) { S.menu = -1; render(); }
  });
  render();
  const links = [['?tab=all', 'All'], ['?tab=unassigned', 'Unassigned'], ['?tab=progress', 'In progress'], ['?tab=ended', 'Ended'], ['?tab=ended&view=list', 'Ended 列表'], ['?tab=ended&longcls=1', '長班名'], ['?tab=all&menu=1', '卡片 ⋯'], ['?tab=all&view=list&menu=1', '列表 ⋯'], ['?tab=ended&empty=1', 'Ended 空']];
  document.getElementById('blinks').innerHTML = links.map(([q, l]) => `<a href="${q}" class="${location.search === q ? 'cur' : ''}">${l}</a>`).join(' · ');
}());
</script>
</body>
