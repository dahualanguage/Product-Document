<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IP Character — Live Translate</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Public Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #f0f2f5; color: #0f172a;
      min-height: 100vh; padding: 48px 20px 80px;
    }
    .page { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; text-align: center; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 48px; text-align: center; }

    .hero-img {
      display: block; max-width: 100%; height: auto;
      margin: 0 auto 48px; border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }

    .notes { max-width: 600px; margin: 0 auto; }
    .note-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .note-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 32px; }
    @media (max-width: 500px) { .note-grid { grid-template-columns: 1fr; } }
    .note-card {
      background: #fff; border-radius: 14px; padding: 16px;
      border: 1px solid #eef0ef; text-align: center;
    }
    .note-card-title { font-size: 14px; font-weight: 600; color: #2859C5; margin-bottom: 4px; }
    .note-card-desc { font-size: 12px; color: #64748b; line-height: 1.5; }

    .color-row {
      display: flex; gap: 16px; align-items: center; justify-content: center;
      margin-top: 32px; flex-wrap: wrap;
    }
    .color-item { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 24px; height: 24px; border-radius: 6px; border: 1px solid #e2e8f0; }
    .swatch-hex { font-size: 10px; color: #64748b; font-weight: 500; }
  </style>
</head>
<body>

<div class="page">
  <h1>Live Translate — IP Character</h1>
  <p class="subtitle">麥克風精靈 · 聽 / 翻譯 / 練習</p>

  <!-- 直接嵌入原圖 -->
  <img class="hero-img" src="assets/ip-characters.png" alt="IP Characters — 聽 / 翻譯 / 練習" />

  <div class="notes">
    <div class="note-title">三種狀態</div>
    <div class="note-grid">
      <div class="note-card">
        <div class="note-card-title">👂 聽</div>
        <div class="note-card-desc">左手舉起揮動<br>右側聲波<br>開心微笑</div>
      </div>
      <div class="note-card">
        <div class="note-card-title">🌐 翻譯</div>
        <div class="note-card-desc">左手舉翻譯泡泡 (A/文)<br>右手拿鉛筆<br>專注表情</div>
      </div>
      <div class="note-card">
        <div class="note-card-title">📖 練習</div>
        <div class="note-card-desc">右手舉書本<br>星星裝飾<br>開心大笑</div>
      </div>
    </div>

    <div class="note-title">色彩</div>
    <div class="color-row">
      <div class="color-item">
        <div class="swatch" style="background:#8FBFFA;"></div>
        <div class="swatch-hex">#8FBFFA 頭部</div>
      </div>
      <div class="color-item">
        <div class="swatch" style="background:#2859C5;"></div>
        <div class="swatch-hex">#2859C5 支架/瞳孔</div>
      </div>
      <div class="color-item">
        <div class="swatch" style="background:#fff; border-color:#e2e8f0;"></div>
        <div class="swatch-hex">#fff 眼白/高光</div>
      </div>
      <div class="color-item">
        <div class="swatch" style="background:#F5B731;"></div>
        <div class="swatch-hex">#F5B731 鉛筆/星星</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
