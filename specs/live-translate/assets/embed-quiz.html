<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=390"><style>*{margin:0;padding:0;}body{width:390px;height:844px;overflow:hidden;}</style></head><body>
<iframe src="../demo-live-translate-mobile.html" style="width:390px;height:844px;border:none;" id="f"></iframe>
<script>
document.getElementById('f').onload=function(){
  var w=this.contentWindow;
  setTimeout(function(){try{
    w.switchTab('quiz');
    /* Auto-select words and start practice */
    setTimeout(function(){try{
      w.showQuizPreview();
      setTimeout(function(){try{
        w.startQuizPractice();
      }catch(e){}}, 300);
    }catch(e){}}, 300);
  }catch(e){}}, 500);
};
</script></body></html>
