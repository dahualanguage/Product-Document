<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo — Spelling Practice Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b; background: #fff; line-height: 1.5; font-size: 14px;
      width: 1440px; height: 100vh; overflow: hidden;
    }

    /* ── App Frame ── */
    .app-frame { display: flex; width: 1440px; height: 100vh; background: #fff; }

    /* ── Sidebar ── */
    .app-sidebar {
      width: 88px; flex-shrink: 0; background: #fff;
      border-right: 1px solid #e2e8f0;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 0; gap: 6px;
    }
    .sidebar-logo {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px; flex-shrink: 0;
    }
    .sidebar-logo span { font-size: 22px; font-weight: 900; color: #059669; font-family: Georgia, serif; }
    .sidebar-item {
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 0; width: 64px; cursor: pointer;
      transition: all .15s; border-radius: 10px; gap: 4px;
    }
    .sidebar-item svg { width: 22px; height: 22px; fill: #94a3b8; }
    .sidebar-item span { font-size: 10px; font-weight: 600; color: #94a3b8; }
    .sidebar-item:hover { background: #f1f5f9; }
    .sidebar-item.active { background: #ecfdf5; }
    .sidebar-item.active svg { fill: #10b981; }
    .sidebar-item.active span { color: #10b981; }

    /* ── Main ── */
    .app-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .app-header {
      height: 56px; flex-shrink: 0; background: #fff;
      border-bottom: 1px solid #C4CDD5;
      display: flex; align-items: center; padding: 0 28px; gap: 12px;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: #64748b;
      text-decoration: none; padding: 6px 10px; border-radius: 6px;
      transition: all .15s;
    }
    .back-btn:hover { background: #f1f5f9; color: #0f172a; }
    .back-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .header-divider { width: 1px; height: 24px; background: #e2e8f0; }
    .app-header-title { font-size: 16px; font-weight: 700; color: #0f172a; flex: 1; }
    .header-badge {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px;
      background: #E6F9FC; color: #00B8D9;
    }

    .app-content { flex: 1; background: #EFF5FF; overflow-y: auto; display: flex; flex-direction: column; position: relative; }

    /* ── Progress bar (top) ── */
    .progress-bar { height: 4px; background: #e2e8f0; width: 100%; }
    .progress-bar-fill {
      height: 100%; background: linear-gradient(90deg, #77ED8B, #22C55E);
      border-radius: 0 2px 2px 0; width: 100%;
    }

    /* ── Result card ── */
    .practice-area {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 120px 36px 120px;
      max-width: 680px; margin: 0 auto; width: 100%;
    }
    .q-card {
      background: #fff; border-radius: 16px; padding: 48px 40px;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
      width: 100%; text-align: center;
    }
  </style>
</head>
<body>

<div class="app-frame">

  <!-- ── Sidebar ── -->
  <nav class="app-sidebar">
    <div class="sidebar-logo"><span>D</span></div>
    <div class="sidebar-item" title="Dashboard">
      <svg viewBox="0 0 24 24"><path d="M4 13h6c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1zm0 8h6c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1zm10 0h6c.55 0 1-.45 1-1v-8c0-.55-.45-1-1-1h-6c-.55 0-1 .45-1 1v8c0 .55.45 1 1 1zm-1-20v4c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1h-6c-.55 0-1 .45-1 1z"/></svg>
      <span>Dashboard</span>
    </div>
    <div class="sidebar-item" title="Live Class">
      <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      <span>Live Class</span>
    </div>
    <div class="sidebar-item active" title="Word Bank">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
      <span>Word Bank</span>
    </div>
  </nav>

  <!-- ── Main area ── -->
  <div class="app-main">
    <div class="app-header">
      <a class="back-btn" href="../demo-word-bank.html">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Word Bank
      </a>
      <div class="header-divider"></div>
      <span class="app-header-title">Spelling Practice</span>
      <span class="header-badge">All Random · 5 words</span>
    </div>

    <!-- Progress bar (100%) -->
    <div>
      <div class="progress-bar">
        <div class="progress-bar-fill"></div>
      </div>
    </div>

    <div class="app-content">
      <div class="practice-area">
        <div class="q-card">
          <div style="font-size:48px;margin-bottom:16px;">🎉</div>
          <div style="font-size:20px;font-weight:800;color:#0f172a;margin-bottom:6px;">Practice Complete!</div>
          <div style="font-size:14px;color:#64748b;margin-bottom:24px;">You finished all 5 words</div>
          <div style="display:flex;justify-content:center;gap:32px;margin-bottom:28px;">
            <div><div style="font-size:28px;font-weight:800;color:#22C55E;">3</div><div style="font-size:11px;color:#94a3b8;font-weight:600;">CORRECT</div></div>
            <div><div style="font-size:28px;font-weight:800;color:#ef4444;">2</div><div style="font-size:11px;color:#94a3b8;font-weight:600;">WRONG</div></div>
            <div><div style="font-size:28px;font-weight:800;color:#0f172a;">60%</div><div style="font-size:11px;color:#94a3b8;font-weight:600;">ACCURACY</div></div>
          </div>
          <div style="display:flex;gap:10px;justify-content:center;">
            <a href="../demo-word-bank.html" style="padding:12px 24px;border-radius:10px;background:#f1f5f9;color:#475569;font-weight:700;font-size:13px;text-decoration:none;transition:all .15s;">Back to Word Bank</a>
            <button onclick="location.reload()" style="padding:12px 24px;border-radius:10px;background:linear-gradient(135deg,#77ED8B,#22C55E);color:#fff;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;">Practice Again</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
