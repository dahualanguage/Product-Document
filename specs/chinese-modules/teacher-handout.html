<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redesign v9 — Teacher · Handout (DAHUA AI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
<link rel="stylesheet" href="assets/teacher-shell.css" />
<style>
  .ho{ display:grid; grid-template-columns:minmax(0,1fr) 288px; gap:22px; padding:24px 30px 60px; max-width:1360px; align-items:start; }

  /* ---------- the printable sheet ---------- */
  .sheetwrap{ display:flex; justify-content:center; }
  .a4{ width:100%; max-width:794px; background:#fff; border:1px solid var(--line); border-radius:6px;
    box-shadow:var(--sh-lg); padding:46px 52px 54px; }
  .a4 .hd{ display:flex; align-items:flex-start; gap:14px; padding-bottom:16px; border-bottom:2px solid var(--ink); margin-bottom:24px; }
  .a4 .hd .logo{ width:40px; height:40px; border-radius:10px; flex:none; display:grid; place-items:center; color:#fff;
    background:linear-gradient(145deg,#10b981,#047857); font-weight:800; font-size:15px; }
  .a4 .hd .ht{ flex:1; min-width:0; }
  .a4 .hd .ht h1{ font-size:22px; font-weight:800; color:var(--ink); letter-spacing:-.3px; }
  .a4 .hd .ht .sub{ font-size:12.5px; font-weight:600; color:var(--muted); margin-top:2px; }
  .a4 .hd .who{ text-align:right; font-size:11px; font-weight:700; color:var(--faint); line-height:1.9; flex:none; }
  .a4 .hd .who i{ display:inline-block; width:88px; border-bottom:1px solid var(--line); font-style:normal; }

  .hsec{ margin-bottom:26px; }
  .hsec:last-child{ margin-bottom:0; }
  .hsec .st{ display:flex; align-items:center; gap:8px; margin-bottom:11px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .hsec .st .material-icons-round{ font-size:18px; color:var(--emerald); }
  .hsec .st b{ font-size:13.5px; font-weight:800; color:var(--ink); letter-spacing:-.1px; }
  .hsec .st .n{ margin-left:auto; font-size:11px; font-weight:800; color:var(--faint); }

  /* reading with pinyin */
  .rline{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:1px 3px; }
  .rline + .rline{ margin-top:13px; }
  .wd{ display:flex; flex-direction:column; align-items:center; }
  .wd .py{ font-size:10px; font-weight:600; color:var(--emerald-d); line-height:1.5; height:15px; }
  .wd .hz{ font-size:19px; font-weight:600; color:var(--ink); line-height:1.5; letter-spacing:.5px; }
  .rtr{ font-size:11.5px; font-weight:600; color:var(--muted); margin-top:3px; padding-left:2px; }

  .plain{ font-size:16px; font-weight:600; color:var(--ink); line-height:2.15; letter-spacing:.5px; }
  .plaintr{ font-size:13px; font-weight:600; color:var(--slate); line-height:1.9; }

  /* teaching points */
  .tp{ width:100%; border-collapse:collapse; }
  .tp th{ text-align:left; font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    color:var(--faint); padding:0 8px 6px 0; border-bottom:1px solid var(--line-2); }
  .tp td{ padding:8px 8px 8px 0; border-bottom:1px solid var(--line-2); vertical-align:top; font-size:12.5px; color:var(--slate); }
  .tp td.w{ font-size:17px; font-weight:600; color:var(--ink); white-space:nowrap; letter-spacing:.5px; }
  .tp td.p{ font-size:11.5px; font-weight:600; color:var(--emerald-d); white-space:nowrap; }
  .tp td.pos{ font-size:11px; font-weight:700; color:var(--faint); font-style:italic; white-space:nowrap; }
  .tp td.ex{ font-size:12px; color:var(--muted); }

  /* questions */
  .qn{ margin-bottom:14px; }
  .qn .qt{ font-size:13px; font-weight:700; color:var(--ink); display:flex; gap:7px; }
  .qn .qt .qi{ font-weight:800; color:var(--emerald-d); flex:none; }
  .qn .opts{ margin:6px 0 0 20px; }
  .qn .opts div{ font-size:12.5px; color:var(--slate); padding:2px 0; }
  .qn .rule{ margin:9px 0 0 20px; border-bottom:1px solid var(--line); height:16px; }
  .qn .rule + .rule{ margin-top:11px; }

  .akey{ display:flex; flex-wrap:wrap; gap:8px 22px; }
  .akey span{ font-size:12.5px; font-weight:700; color:var(--slate); }
  .akey span b{ color:var(--emerald-d); }

  /* ---------- side panel ---------- */
  .panel-stick{ position:sticky; top:88px; display:flex; flex-direction:column; gap:16px; }
  .opt-row{ display:flex; align-items:center; gap:10px; padding:10px 16px; }
  .opt-row + .opt-row{ border-top:1px solid var(--line-2); }
  .opt-row label{ flex:1; font-size:13px; font-weight:700; color:var(--slate); cursor:pointer; display:flex; align-items:center; gap:9px; }
  .opt-row .material-icons-round{ font-size:18px; color:var(--faint); }
  .opt-row.off label{ color:var(--faint); }
  .opt-row.off .material-icons-round{ color:#cbd5e1; }
  .cbx{ appearance:none; -webkit-appearance:none; width:18px; height:18px; border:1.5px solid #cbd5e1; border-radius:5px;
    background:#fff; cursor:pointer; flex:none; position:relative; transition:.13s; }
  .cbx:checked{ background:var(--emerald); border-color:var(--emerald); }
  .cbx:checked::after{ content:""; position:absolute; left:5px; top:1px; width:5px; height:10px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .sw{ appearance:none; -webkit-appearance:none; width:34px; height:19px; border-radius:999px; background:#cbd5e1;
    position:relative; cursor:pointer; transition:.16s; border:none; flex:none; }
  .sw::after{ content:""; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:#fff; transition:.16s; }
  .sw:checked{ background:var(--emerald); }
  .sw:checked::after{ transform:translateX(15px); }
  .panel-note{ padding:12px 16px 14px; font-size:11.5px; font-weight:600; color:var(--muted); line-height:1.6;
    border-top:1px solid var(--line-2); background:#fbfdff; }
  .printbtn{ width:100%; justify-content:center; }

  @media (max-width:1100px){
    .ho{ grid-template-columns:minmax(0,1fr); }
    .panel-stick{ position:static; }
  }
  @media (max-width:700px){
    .ho{ padding:16px 14px 44px; }
    .a4{ padding:22px 20px 26px; }
    .a4 .hd{ flex-wrap:wrap; }
    .a4 .hd .who{ text-align:left; }
    .wd .hz{ font-size:16px; } .plain{ font-size:14px; }
  }

  /* what the printed sheet looks like — chrome drops away */
  @media print{
    .side,.pagebar,.panel-stick,.nav-scrim,.toast{ display:none !important; }
    .app{ display:block; }
    .ho{ display:block; padding:0; }
    .a4{ box-shadow:none; border:none; border-radius:0; max-width:none; width:210mm; padding:16mm 18mm; }
    @page{ size:A4; margin:0; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side" data-current="projects"></aside>

  <div class="main">
    <div class="pagebar">
      <button class="navtoggle" data-navtoggle aria-label="Open menu" aria-expanded="false"><span class="material-icons-round">menu</span></button>
      <a class="btn-sm" href="teacher-projects.html" aria-label="Back to Projects" style="width:36px;height:36px;padding:0;justify-content:center"><span class="material-icons-round">arrow_back</span></a>
      <div class="hdr-ic"><span class="material-icons-round">description</span></div>
      <div class="dt"><b>Handout</b><span>食物 — What we eat</span></div>
      <div class="pb-acts">
        <a class="btn-ghost" href="teacher-slides.html"><span class="material-icons-round" style="font-size:17px">slideshow</span> Slides</a>
        <div class="ava">LW</div>
      </div>
    </div>

    <div class="ho">
      <!-- ============ the sheet ============ -->
      <div class="sheetwrap">
        <div class="a4" id="sheet"></div>
      </div>

      <!-- ============ controls ============ -->
      <div class="panel-stick">
        <section class="panel">
          <div class="p-head"><h2>Sections</h2><span class="badge" id="secCount"></span></div>
          <div id="secList"></div>
          <div class="panel-note">Untick a section to leave it out of the printed handout. Sections with no content for this project are disabled.</div>
        </section>

        <section class="panel">
          <div class="p-head"><h2>Display</h2></div>
          <div class="opt-row"><label for="optPinyin"><span class="material-icons-round">spellcheck</span>Pinyin</label>
            <input class="sw" type="checkbox" id="optPinyin" checked /></div>
          <div class="opt-row"><label for="optTrans"><span class="material-icons-round">translate</span>Translation</label>
            <input class="sw" type="checkbox" id="optTrans" checked /></div>
          <div class="opt-row"><label for="optLogo"><span class="material-icons-round">school</span>School Logo</label>
            <input class="sw" type="checkbox" id="optLogo" checked /></div>
        </section>

        <button class="btnp printbtn" id="printBtn"><span class="material-icons-round">print</span> Print handout</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/teacher-nav.js"></script>
<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s);};
  var tt; function say(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2400);}
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  var TOPIC={ han:'食物', py:'shíwù', en:'What we eat', level:'HSK 1', cls:'4A' };

  var SENTENCES=[
    { w:[['我','wǒ'],['喜欢','xǐhuan'],['吃','chī'],['米饭','mǐfàn'],['。','']], t:'I like eating rice.' },
    { w:[['你','nǐ'],['饿','è'],['了','le'],['吗','ma'],['？','']], t:'Are you hungry?' },
    { w:[['这个','zhège'],['苹果','píngguǒ'],['很','hěn'],['好吃','hǎochī'],['。','']], t:'This apple is delicious.' },
    { w:[['我','wǒ'],['想','xiǎng'],['喝','hē'],['牛奶','niúnǎi'],['。','']], t:'I want to drink milk.' },
    { w:[['早饭','zǎofàn'],['你','nǐ'],['吃','chī'],['什么','shénme'],['？','']], t:'What do you eat for breakfast?' },
    { w:[['我','wǒ'],['不','bù'],['喜欢','xǐhuan'],['吃','chī'],['面条','miàntiáo'],['。','']], t:'I don’t like eating noodles.' }
  ];

  var VOCAB=[
    { w:'米饭', p:'mǐfàn',   pos:'n.',   en:'cooked rice',      ex:'我要一碗米饭。' },
    { w:'面条', p:'miàntiáo', pos:'n.',   en:'noodles',          ex:'他爱吃面条。' },
    { w:'鸡蛋', p:'jīdàn',    pos:'n.',   en:'egg',              ex:'早饭有鸡蛋。' },
    { w:'牛奶', p:'niúnǎi',   pos:'n.',   en:'milk',             ex:'我每天喝牛奶。' },
    { w:'苹果', p:'píngguǒ',  pos:'n.',   en:'apple',            ex:'这个苹果很甜。' },
    { w:'好吃', p:'hǎochī',   pos:'adj.', en:'tasty, delicious', ex:'妈妈做的菜很好吃。' },
    { w:'饿',   p:'è',        pos:'adj.', en:'hungry',           ex:'我有点儿饿。' },
    { w:'喝',   p:'hē',       pos:'v.',   en:'to drink',         ex:'你想喝什么？' }
  ];

  var QUESTIONS=[
    { q:'“我喜欢吃___。” 哪一个最合适？', o:['米饭','跑步','很好'], a:0 },
    { q:'“你饿了吗？” 在问什么？', o:['Are you hungry?','Are you tired?','Are you thirsty?'], a:0 },
    { q:'“好吃” 的意思是什么？', o:['expensive','tasty','cold'], a:1 },
    { q:'早饭你吃什么？请写两句。', o:null }
  ];

  /* section registry — same six as the app */
  var SECTIONS=[
    { k:'pinyin',        icon:'article',       label:'Reading with Pinyin', on:true,  has:true },
    { k:'text',          icon:'description',   label:'Full Reading',        on:true,  has:true },
    { k:'translation',   icon:'translate',     label:'Translation',         on:true,  has:true },
    { k:'teachingPoints',icon:'menu_book',     label:'Teaching Points',     on:true,  has:true },
    { k:'questions',     icon:'help_outline',  label:'Questions',           on:true,  has:true },
    { k:'answerKey',     icon:'vpn_key',       label:'Answer Key',          on:false, has:true }
  ];

  var opt={ pinyin:true, trans:true, logo:true };

  function words(list){
    return list.map(function(p){
      return '<span class="wd">'+(opt.pinyin?'<span class="py">'+esc(p[1])+'</span>':'')+
        '<span class="hz">'+esc(p[0])+'</span></span>';
    }).join('');
  }
  function plainText(){ return SENTENCES.map(function(s){ return s.w.map(function(p){return p[0];}).join(''); }).join(''); }
  function on(k){ var s=SECTIONS.filter(function(x){return x.k===k;})[0]; return s && s.on && s.has; }

  function sec(k,icon,title,note,inner){
    return '<div class="hsec"><div class="st"><span class="material-icons-round">'+icon+'</span><b>'+esc(title)+'</b>'+
      (note?'<span class="n">'+esc(note)+'</span>':'')+'</div>'+inner+'</div>';
  }

  function renderSheet(){
    var h='';

    h += '<div class="hd">'+
      (opt.logo?'<span class="logo">DH</span>':'')+
      '<span class="ht"><h1>'+esc(TOPIC.han)+' — '+esc(TOPIC.en)+'</h1>'+
      '<span class="sub">'+esc(TOPIC.level)+' · Class '+esc(TOPIC.cls)+' · '+VOCAB.length+' new words</span></span>'+
      '<span class="who">Name <i></i><br/>Date <i></i></span></div>';

    if(on('pinyin')){
      h += sec('pinyin','article','Reading with Pinyin', SENTENCES.length+' sentences',
        SENTENCES.map(function(s){
          return '<div class="rline">'+words(s.w)+'</div>'+
            (opt.trans?'<div class="rtr">'+esc(s.t)+'</div>':'');
        }).join(''));
    }
    if(on('text')){
      h += sec('text','description','Full Reading','', '<div class="plain">'+esc(plainText())+'</div>');
    }
    if(on('translation') && opt.trans){
      h += sec('translation','translate','Translation','',
        '<div class="plaintr">'+SENTENCES.map(function(s){return esc(s.t);}).join(' ')+'</div>');
    }
    if(on('teachingPoints')){
      h += sec('teachingPoints','menu_book','Teaching Points', VOCAB.length+' words',
        '<table class="tp"><thead><tr><th>Word</th>'+(opt.pinyin?'<th>Pinyin</th>':'')+
        '<th></th>'+(opt.trans?'<th>Meaning</th>':'')+'<th>Example</th></tr></thead><tbody>'+
        VOCAB.map(function(v){
          return '<tr><td class="w">'+esc(v.w)+'</td>'+
            (opt.pinyin?'<td class="p">'+esc(v.p)+'</td>':'')+
            '<td class="pos">'+esc(v.pos)+'</td>'+
            (opt.trans?'<td>'+esc(v.en)+'</td>':'')+
            '<td class="ex">'+esc(v.ex)+'</td></tr>';
        }).join('')+'</tbody></table>');
    }
    if(on('questions')){
      h += sec('questions','help_outline','Questions', QUESTIONS.length+' questions',
        QUESTIONS.map(function(q,i){
          var body = q.o
            ? '<div class="opts">'+q.o.map(function(o,j){
                return '<div>'+String.fromCharCode(65+j)+'. '+esc(o)+'</div>'; }).join('')+'</div>'
            : '<div class="rule"></div><div class="rule"></div>';
          return '<div class="qn"><div class="qt"><span class="qi">'+(i+1)+'.</span><span>'+esc(q.q)+'</span></div>'+body+'</div>';
        }).join(''));
    }
    if(on('answerKey')){
      h += sec('answerKey','vpn_key','Answer Key','teacher copy',
        '<div class="akey">'+QUESTIONS.map(function(q,i){
          return '<span>'+(i+1)+'. <b>'+(q.o?String.fromCharCode(65+q.a):'open')+'</b></span>';
        }).join('')+'</div>');
    }

    $('#sheet').innerHTML=h;
  }

  function renderSections(){
    $('#secList').innerHTML=SECTIONS.map(function(s,i){
      var dim = !s.has || !s.on;
      var forced = s.k==='translation' && !opt.trans;
      return '<div class="opt-row'+(dim||forced?' off':'')+'">'+
        '<label for="sec'+i+'"><span class="material-icons-round">'+s.icon+'</span>'+esc(s.label)+
        (forced?' <span class="pill" style="font-size:10px">Translation is off</span>':'')+'</label>'+
        '<input class="cbx" type="checkbox" id="sec'+i+'" data-sec="'+i+'"'+(s.on?' checked':'')+
        (s.has?'':' disabled')+' /></div>';
    }).join('');
    var n=SECTIONS.filter(function(s){return s.on&&s.has;}).length;
    $('#secCount').textContent=n+' of '+SECTIONS.length;
  }

  $('#secList').addEventListener('change',function(e){
    var c=e.target.closest('[data-sec]'); if(!c) return;
    SECTIONS[+c.dataset.sec].on=c.checked;
    renderSections(); renderSheet();
  });
  $('#optPinyin').addEventListener('change',function(){ opt.pinyin=this.checked; renderSections(); renderSheet(); });
  $('#optTrans').addEventListener('change',function(){ opt.trans=this.checked; renderSections(); renderSheet(); });
  $('#optLogo').addEventListener('change',function(){ opt.logo=this.checked; renderSheet(); });

  $('#printBtn').addEventListener('click',function(){
    var n=SECTIONS.filter(function(s){return s.on&&s.has;}).length;
    if(!n){ say('Tick at least one section to print'); return; }
    say('Opening the print preview — '+n+' sections, A4');
    setTimeout(function(){ window.print(); },400);
  });

  renderSections(); renderSheet();
})();
</script>
</body>
</html>
