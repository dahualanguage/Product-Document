<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose Practice Type — v1 提案 B（攤平八張＋同源標題）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Material+Icons+Round&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  /* 六個顏色全部沿用 live —— src/theme/palette.js + AddNewPracticeDialog.js */
  --mirroring-bg:#BBF1D0; --mirroring-fg:#00CB61;  /* primary  · Mirroring */
  --vocab-bg:#FFF5CC;     --vocab-fg:#FFAB00;      /* warning  · Vocabulary */
  --pattern-bg:#E0F2F1;   --pattern-fg:#00897B;    /* Sentence Patterns */
  --scramble-bg:#FCE7F3;  --scramble-fg:#EC4899;   /* Sentence Scramble */
  --mc-bg:#F3E8FF;        --mc-fg:#7C3AED;         /* Multiple Choice */
  --qa-bg:#DCECFE;        --qa-fg:#508AFC;         /* info · QA */
  --primary-main:#00CB61; --error-main:#FF5630;
  --g500:#919EAB; --g600:#637381; --g800:#212B36;
  --divider:rgba(145,158,171,.2);
}

body{
  font-family:'Public Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--g800); background:#eef0f3; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 24px;
}
.mi{ font-family:'Material Icons Round'; font-weight:normal; font-style:normal; line-height:1;
     letter-spacing:normal; text-transform:none; white-space:nowrap; word-wrap:normal;
     direction:ltr; -webkit-font-feature-settings:'liga'; -webkit-font-smoothing:antialiased;
     user-select:none; }

/* ---------- dialog ---------- */
.dlg{ background:#fff; border-radius:24px; width:100%; max-width:1080px;
  display:flex; flex-direction:column;
  box-shadow:0 24px 48px rgba(22,28,36,.16), 0 0 2px rgba(22,28,36,.12); }
.dlg-hd{ padding:24px 24px 12px; }
.dlg-hd h2{ font-size:1.5rem; font-weight:700; }
.dlg-hd p{ font-size:.875rem; color:var(--g600); margin-top:6px; }
.dlg-bd{ padding:8px 24px 16px; overflow-y:auto; }
.dlg-ft{ padding:12px 24px 20px; display:flex; justify-content:flex-end; }

/* ---------- 4 欄 × 2 列，每欄上方一個共用標題 ----------
   用同一個 grid 排三列（標題列 + 兩列卡片），而不是四個獨立欄位——
   這樣跨欄的標題、icon、標題文字、說明文字都會落在同一條線上。 */
.types{ display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:auto 1fr 1fr;
  column-gap:20px; row-gap:20px; }

/* 同源標題：這一欄的兩張卡考的是同一批素材 */
.colhead{ align-self:end; margin-bottom:-6px; text-align:center;
  font-size:.75rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--g500); }

/* ---------- 卡片：逐項對齊 src/components/practice/practice-type-card.js ----------
   Grid spacing 2.5 = 20px；Card borderRadius 3 = 24px；內距 p:3 = 24px；
   Stack spacing 1.5 = 12px；icon 56px / glyph 28px；title = h6 (1.125rem/700)。 */
.type{ position:relative; background:#fff; border:1px solid var(--divider); border-radius:24px;
  padding:24px; cursor:pointer; text-align:center; transition:all .2s ease; }
/* live 的 hover 只換陰影 + 綠色框線，沒有位移 */
.type:hover{ border-color:var(--primary-main);
  box-shadow:0 5px 5px -3px rgba(145,158,171,.2),
             0 8px 10px 1px rgba(145,158,171,.14),
             0 3px 14px 2px rgba(145,158,171,.12); }

.type .ic{ width:56px; height:56px; border-radius:50%; margin:0 auto 12px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04); }
.type .ic .mi{ font-size:28px; }
.type b{ display:block; font-size:1.125rem; line-height:1.5556; font-weight:700; color:var(--g800); }
/* 說明文字給專屬 class。不能用 .type span——會打中 icon 的 <span class="mi">
   和 <span class="badge">，直接命中的 color 會蓋掉它們自己的顏色。 */
.type .desc{ display:block; margin-top:12px; font-size:.875rem; line-height:1.5714; color:var(--g600); }

/* NEW = GlowingChip：MUI Chip color="error" small，高 24、字重 800，帶琥珀色脈動 */
.badge{ position:absolute; top:12px; left:12px;
  display:inline-flex; align-items:center; height:24px; padding:0 8px; border-radius:12px;
  background:var(--error-main); color:#fff; font-size:.8125rem; font-weight:800; line-height:1;
  animation:glowPulse 1.6s ease-in-out infinite; }
@keyframes glowPulse{
  0%  { opacity:1;   transform:scale(1);    box-shadow:0 0 0 0 rgba(255,171,0,.35); }
  50% { opacity:.72; transform:scale(1.05); box-shadow:0 0 0 6px rgba(255,171,0,.08); }
  100%{ opacity:1;   transform:scale(1);    box-shadow:0 0 0 0 rgba(255,171,0,0); }
}

/* 每張卡的顏色 = 它在 live 的顏色。
   拆出來的四張沿用母卡的顏色（Vocabulary 琥珀 / Sentence Patterns 藍綠）。 */
.c-mirroring .ic{ background:var(--mirroring-bg); color:var(--mirroring-fg); }
.c-mirroring:hover{ border-color:var(--mirroring-fg); }
.c-scramble  .ic{ background:var(--scramble-bg);  color:var(--scramble-fg); }
.c-scramble:hover{ border-color:var(--scramble-fg); }
.c-vocab     .ic{ background:var(--vocab-bg);     color:var(--vocab-fg); }
.c-vocab:hover{ border-color:var(--vocab-fg); }
.c-pattern   .ic{ background:var(--pattern-bg);   color:var(--pattern-fg); }
.c-pattern:hover{ border-color:var(--pattern-fg); }
.c-mc        .ic{ background:var(--mc-bg);        color:var(--mc-fg); }
.c-mc:hover{ border-color:var(--mc-fg); }
.c-qa        .ic{ background:var(--qa-bg);        color:var(--qa-fg); }
.c-qa:hover{ border-color:var(--qa-fg); }

.btn{ font:inherit; font-size:.875rem; font-weight:700; border-radius:8px; height:36px;
  padding:0 16px; cursor:pointer; background:#fff; color:var(--g800);
  border:1px solid rgba(145,158,171,.32); }
.btn:hover{ background:rgba(145,158,171,.08); }

@media (max-width:1040px){
  .types{ grid-template-columns:repeat(2,1fr); grid-template-rows:none; }
  .colhead{ grid-column:1 / -1; text-align:left; margin-top:8px; margin-bottom:-12px; }
}
@media (max-width:560px){ .types{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="dlg-hd">
    <h2 id="dlgT">Choose Practice Type</h2>
    <p>Select one practice to continue.</p>
  </div>
  <div class="dlg-bd">
    <div class="types" id="types"></div>
  </div>
  <div class="dlg-ft">
    <button class="btn">Cancel</button>
  </div>
</div>

<script>
/* 提案 B = 提案 A ＋ 每一欄上方一個共用標題，講明這兩張考的是同一批素材。
   名稱維持完整（不縮短），顏色與 icon 全部沿用 live。
   對照現況與提案 A 見 spec.html §4。 */
const GROUPS = [
  { head:'Sentence', items:[
    { c:'mirroring', icon:'mic',             title:'Sentence Mirroring',   desc:'Listen and repeat each sentence',
      was:'Mirroring Practice · ic:round-mic · primary' },
    { c:'scramble',  icon:'view_column',     title:'Sentence Scramble',    desc:'Listen, then reorder the words',
      was:'Sentence Scramble · ic:round-view-column · #EC4899', isNew:true },
  ]},
  { head:'Vocabulary', items:[
    { c:'vocab',     icon:'flip',            title:'Vocabulary Mirroring', desc:'Listen and repeat each word',
      was:'Vocabulary → Mirroring · ic:round-flip' },
    { c:'vocab',     icon:'checklist',       title:'Vocabulary Quiz',      desc:'Image, pinyin &amp; meaning',
      was:'Vocabulary → Multiple Choice · ic:round-checklist' },
  ]},
  { head:'Teaching Points', items:[
    { c:'pattern',   icon:'question_answer', title:'Pattern Response',     desc:'Answer questions using a pattern',
      was:'Sentence Patterns → Guided Response · ic:round-question-answer', isNew:true },
    { c:'pattern',   icon:'construction',    title:'Pattern Building',     desc:'Build sentences from teaching points',
      was:'Sentence Patterns → Sentence Building · ic:round-construction', isNew:true },
  ]},
  { head:'Question Bank', items:[
    { c:'mc',        icon:'quiz',            title:'Question Bank Quiz',   desc:'Auto-graded questions from a bank',
      was:'Multiple Choice · ic:round-quiz · #7C3AED', isNew:true },
    { c:'qa',        icon:'chat_bubble',     title:'Question Bank QA',     desc:'Open questions, AI assessment',
      was:'QA Practice · ic:round-chat-bubble · info' },
  ]},
];

const card = (t) => `
  <div class="type c-${t.c}" title="現況：${t.was}">
    ${t.isNew ? '<span class="badge">NEW</span>' : ''}
    <div class="ic"><span class="mi">${t.icon}</span></div>
    <b>${t.title}</b>
    <span class="desc">${t.desc}</span>
  </div>`;

/* 先鋪四個標題，再一列一列鋪卡片——同一個 grid 才能讓跨欄的元素對齊 */
document.getElementById('types').innerHTML =
  GROUPS.map(g => `<div class="colhead">${g.head}</div>`).join('')
  + GROUPS.map(g => card(g.items[0])).join('')
  + GROUPS.map(g => card(g.items[1])).join('');
</script>
</body>
</html>
