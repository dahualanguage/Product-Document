<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Game V2 — v5 基準（現行複刻）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900&family=Public+Sans:wght@700;800&family=Material+Icons+Round&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   基準檔 —— 現行 /student/word-game-v2/ 的三個畫面逐項照 sx 複刻，不做自由發揮。
   對照組：proposal.html 是提案。假資料兩邊共用 mock.js。

   出處（dahua-dash origin/develop @ 599dd4cb，2026-09-15 fetch）：
     src/app/student/word-game-v2/page.js                    Fredoka → --font-title、Nunito → --font-body
     src/sections/student/word-game-v2/constants.js          COLORS / PANEL_STYLE / BTN_STYLE / LEVELS
     src/sections/student/word-game-v2/components/game-v2-layout.js   logo、右上 HUD（Stars / 音量 / 帳號）、音量 popover、右下吉祥物
     src/sections/student/word-game-v2/screens/world-map-screen.js    世界地圖：左上 Level 資訊、七個世界節點、右下吉祥物＋打字對話框
     src/sections/student/word-game-v2/screens/level-screen-a.js      關卡格：標頭卡、10 欄格子、分頁
     src/sections/student/word-game-v2/components/session-dialog.js   Continue / Start over 覆蓋層
     src/layouts/common/account-popover.js                   40px IconButton 包 36px Avatar
     src/theme/index.js                                      shape.borderRadius = 8 → sx borderRadius:4 = 32px

   網址參數：
     ?screen=map（預設）| stages
     &hover=3        地圖：世界 3 的 hover 狀態（光暈＋動態圖）
     &page=2         關卡格第二頁
     &dlg=1          關卡格上的 Continue / Start over 覆蓋層
     &sound=1        右上音量 popover 打開
   =========================================================================== */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --green:#12A150; --green-d:#0B7A3B; --green-l:#DCF7E6;
  --gold:#FFC219; --coral:#FF5A6E; --purple:#7C3AED; --info:#1CB0F6;
  --ink:#243B2E; --ink-soft:#5B7266; --line:#E4EDE7; --shell:#EAF3EC;
  --font-title:'Fredoka', cursive; --font-body:'Nunito', sans-serif;
  --mui-primary:#00CB61;   /* MUI 預設 Button / Typography h6 走 theme，不走遊戲字體 */
}
html,body{ height:100%; }
body{ font-family:var(--font-body); color:var(--ink); background:#fff; overflow:hidden; -webkit-font-smoothing:antialiased; }
.mi{ font-family:'Material Icons Round'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal;
     text-transform:none; white-space:nowrap; direction:ltr; -webkit-font-feature-settings:'liga'; -webkit-font-smoothing:antialiased; user-select:none; display:inline-block; }
img{ display:block; }
button{ font-family:inherit; }

/* ---------- Layout (game-v2-layout.js) ---------- */
.layout{ min-height:100vh; display:flex; flex-direction:column; align-items:center; position:relative; overflow:hidden; }
.layout > .bgimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.logo{ position:absolute; top:12px; left:12px; z-index:2; }
.logo img{ height:80px; object-fit:contain; filter:drop-shadow(0 2px 8px rgba(0,0,0,.2)); }

.hud{ position:fixed; top:28px; right:28px; z-index:30; display:flex; align-items:center; gap:12px; }
.stars{ background:rgba(255,255,255,.95); border-radius:80px; padding:6px 16px; display:flex; align-items:center; gap:6px;
  box-shadow:0 3px 12px rgba(0,0,0,.12); border:2px solid #FDE68A; }
.stars .mi{ font-size:28px; color:var(--gold); animation:starPulse 2s ease-in-out infinite; }
@keyframes starPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.2) rotate(15deg);} }
.stars b{ font-family:'Public Sans',sans-serif; font-weight:800; font-size:18px; line-height:1.5; color:var(--ink); }  /* variant="h6"，沒有指定 GAME_FONT → 走 theme */
.iconbtn{ all:unset; cursor:pointer; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.95); box-shadow:0 3px 12px rgba(0,0,0,.12);
  border:2px solid #E5E7EB; display:grid; place-items:center; }
.iconbtn:hover{ background:#F9FAFB; }
.iconbtn .mi{ font-size:24px; color:var(--ink); }
.acct{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:rgba(145,158,171,.08); cursor:pointer; }
.acct .av{ width:36px; height:36px; border-radius:50%; background:#C8FAD6; color:#007B55; font-family:'Public Sans',sans-serif; font-weight:700; font-size:15px; display:grid; place-items:center; }

/* Sound popover (MUI Popover, paper borderRadius:4 = 32px) */
.pop{ display:none; position:fixed; top:80px; right:28px; z-index:40; width:260px; background:#fff; border-radius:32px; padding:20px;
  box-shadow:0 8px 32px rgba(0,0,0,.15); font-family:var(--font-body); }
.pop.on{ display:block; }
.pop h6{ font-size:14px; font-weight:800; margin-bottom:16px; }
.pop .row{ display:flex; align-items:center; justify-content:space-between; }
.pop .row .l{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; }
.pop .row .l .mi{ font-size:20px; }
.pop .row .m{ all:unset; cursor:pointer; width:30px; height:30px; display:grid; place-items:center; }
.pop .row .m .mi{ font-size:18px; }
.pop .sl{ position:relative; height:4px; border-radius:2px; margin:12px 6px 0; }
.pop .sl i{ position:absolute; top:50%; width:12px; height:12px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 0 transparent; }
.pop .music{ margin-bottom:20px; }
.pop .music .mi, .pop .music .m .mi{ color:var(--purple); }
.pop .music .sl{ background:rgba(124,58,237,.3); } .pop .music .sl b{ position:absolute; left:0; top:0; bottom:0; width:70%; background:var(--purple); border-radius:2px; } .pop .music .sl i{ left:70%; background:var(--purple); }
.pop .sfx .mi, .pop .sfx .m .mi{ color:#FF9600; }
.pop .sfx .sl{ background:rgba(255,150,0,.3); } .pop .sfx .sl b{ position:absolute; left:0; top:0; bottom:0; width:85%; background:#FF9600; border-radius:2px; } .pop .sfx .sl i{ left:85%; background:#FF9600; }

/* ---------- World map (world-map-screen.js) ---------- */
.map{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#1a5c2e; overflow:hidden; }
.map .scene{ position:relative; width:100%; height:100%; }
.map .scene > img{ width:100%; height:100%; object-fit:fill; }   /* 產品是 <video objectFit:fill>，這裡用它的靜態幀 */
.map .overlay{ position:absolute; inset:0; }

.lvinfo{ position:absolute; top:14px; left:140px; z-index:25; display:flex; align-items:center; }
.lvinfo img{ width:80px; height:80px; object-fit:contain; filter:drop-shadow(0 2px 6px rgba(0,0,0,.3)); margin-right:-8px; position:relative; z-index:1; }
.lvinfo .box{ background:rgba(0,0,0,.6); backdrop-filter:blur(10px); border-radius:14px; padding:8px 24px 8px 20px; display:flex; flex-direction:column; gap:4px; border:1.5px solid rgba(255,255,255,.15); }
.lvinfo .box b{ font-family:var(--font-title); font-weight:700; font-size:20px; color:#fff; line-height:1; }
.lvinfo .box .pr{ width:130px; display:flex; align-items:center; gap:8px; }
.lvinfo .box .bar{ flex:1; height:7px; border-radius:4px; background:rgba(255,255,255,.2); overflow:hidden; }
.lvinfo .box .bar i{ display:block; height:100%; border-radius:4px; background:var(--green); }
.lvinfo .box span{ font-weight:800; font-size:12px; color:rgba(255,255,255,.8); }

.node{ position:absolute; pointer-events:none; }
.node .anchor{ position:relative; pointer-events:auto; cursor:pointer; }
.node.locked .anchor{ cursor:not-allowed; }
.node img.bld{ width:var(--w); max-width:var(--max); aspect-ratio:1; object-fit:contain; transform:translate(-50%,-50%);
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.3)); transition:filter .2s; }
.node.locked img.bld{ filter:saturate(.3) brightness(.95); }
.node.current img.bld{ filter:drop-shadow(0 0 12px rgba(255,255,255,.5)) drop-shadow(0 6px 16px rgba(0,0,0,.3)); animation:floatBounce 3s ease-in-out infinite; }
.node.hover img.bld{ filter:drop-shadow(0 0 20px rgba(255,255,255,.6)) brightness(1.15); }
@keyframes floatBounce{ 0%,100%{ transform:translate(-50%,-50%);} 50%{ transform:translate(-50%,calc(-50% - 8px));} }
.node .glow{ position:absolute; left:0; top:0; width:130%; height:130%; border-radius:50%; transform:translate(-65%,-65%); pointer-events:none;
  background:radial-gradient(circle, var(--t)99 0%, var(--t)44 40%, transparent 70%); animation:glowPulse 1s ease-in-out infinite; }
@keyframes glowPulse{ 0%,100%{ opacity:.7; transform:translate(-65%,-65%) scale(1);} 50%{ opacity:1; transform:translate(-65%,-65%) scale(1.15);} }
.node .goldbg{ position:absolute; left:0; top:0; width:130%; height:130%; border-radius:50%; transform:translate(-65%,-65%); pointer-events:none;
  background:radial-gradient(circle, rgba(255,215,0,.55) 0%, rgba(255,200,0,.3) 55%, transparent 72%); animation:goldenPulse 2s ease-in-out infinite; }
@keyframes goldenPulse{ 0%,100%{ opacity:.8; transform:translate(-65%,-65%) scale(1);} 50%{ opacity:1; transform:translate(-65%,-65%) scale(1.06);} }
.node .ring{ position:absolute; left:0; top:0; width:120%; height:120%; border-radius:50%; transform:translate(-60%,-60%); pointer-events:none;
  border:4px solid rgba(255,215,0,.9); box-shadow:0 0 20px rgba(255,200,0,.6), inset 0 0 20px rgba(255,200,0,.15); }
.node .cta{ position:absolute; left:0; top:0; transform:translate(-50%,-280%); text-align:center; pointer-events:none; z-index:10; animation:arrowBounce 1.5s ease-in-out infinite; }
@keyframes arrowBounce{ 0%,100%{ transform:translate(-50%,-280%);} 50%{ transform:translate(-50%,-260%);} }
.node .cta b{ display:block; font-family:var(--font-title); font-weight:700; font-size:26px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.5); white-space:nowrap; }
.node .cta i{ display:block; width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent; border-top:18px solid #FFD700; border-radius:4px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); margin:4px auto 0; }
.node .lbl{ position:absolute; left:0; top:30%; transform:translate(-50%,0); background:rgba(0,0,0,.5); border-radius:12px; padding:4px 16px; pointer-events:none; z-index:5;
  box-shadow:0 2px 6px rgba(0,0,0,.2); color:#fff; font-weight:800; font-size:12px; white-space:nowrap; }
.node.current .lbl{ background:linear-gradient(135deg,#FFD700,#FFA500); border:2px solid rgba(255,255,255,.6); font-size:14px; text-shadow:0 1px 4px rgba(0,0,0,.3); }
.node .lock{ position:absolute; left:0; top:0; transform:translate(-50%,-50%); width:48px; height:48px; border-radius:50%; background:rgba(0,0,0,.45); display:grid; place-items:center; pointer-events:none; }
.node .lock .mi{ font-size:28px; color:#fff; }

.mascot{ position:absolute; bottom:0; right:0; z-index:15; pointer-events:none; display:flex; align-items:flex-end; }
.mascot .bubble{ background:rgba(255,255,255,.95); backdrop-filter:blur(8px); border-radius:20px 20px 4px 20px; box-shadow:0 4px 20px rgba(0,0,0,.15);
  padding:16px 24px; margin:0 -8px 40px 0; max-width:260px; min-height:48px; font-weight:700; font-size:18px; color:var(--ink); line-height:1.5; }
.mascot .bubble i{ font-style:normal; animation:blink .8s infinite; }
@keyframes blink{ 0%,100%{ opacity:1;} 50%{ opacity:0;} }
.mascot > img{ width:320px; height:320px; object-fit:contain; margin:0 -16px -16px 0; filter:drop-shadow(0 4px 12px rgba(0,0,0,.2)); }

/* ---------- Stage grid (level-screen-a.js) ---------- */
.content{ width:100%; flex:1; display:flex; flex-direction:column; position:relative; z-index:1; max-width:800px; padding:96px 16px 24px; }
.stagewrap{ flex:1; position:relative; padding-bottom:32px; overflow-y:auto; }
.hdr{ background:#fff; border-radius:32px; padding:16px; margin-bottom:16px; display:flex; align-items:center; gap:12px; box-shadow:0 4px 16px rgba(0,0,0,.08); }
.hdr .back{ all:unset; cursor:pointer; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--ink); flex:none; }
.hdr .back:hover{ background:rgba(0,0,0,.04); }
.hdr .back .mi{ font-size:24px; }
.hdr .t{ flex:1; }
.hdr .t b{ display:block; font-family:var(--font-title); font-weight:800; font-size:18px; line-height:1.2; }
.hdr .t span{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
.hdr .t .bar{ height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
.hdr .t .bar i{ display:block; height:100%; border-radius:4px; background:var(--green); }
.hdr .cnt{ font-weight:800; font-size:14px; color:var(--green-d); flex:none; }

.grid{ background:#fff; border-radius:32px; padding:24px; box-shadow:0 4px 16px rgba(0,0,0,.08);
  background-image:repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(0,0,0,.015) 20px, rgba(0,0,0,.015) 40px); }
.row{ display:grid; grid-template-columns:repeat(10,1fr); gap:16px; margin-bottom:12px; }
.deco{ display:flex; justify-content:center; padding:4px 0; font-size:12px; opacity:.25; }
.st{ position:relative; aspect-ratio:1; }
.st .oring{ position:absolute; inset:0; border-radius:50%; border:4px solid var(--rc); }
.st .oring.part{ border:none; background:conic-gradient(from -90deg, var(--rc) var(--deg), #D0D0D0 var(--deg));
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px)); mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px)); }
.st .coin{ position:absolute; inset:12%; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.1); transition:all .2s ease; }
.st.locked .coin{ cursor:default; opacity:.55; }
.st.current .coin{ animation:currentPulse 1.6s ease-in-out infinite; }
@keyframes currentPulse{ 0%,100%{ box-shadow:0 2px 4px rgba(0,0,0,.1), 0 0 0 0 rgba(28,176,246,.5);} 50%{ box-shadow:0 2px 4px rgba(0,0,0,.1), 0 0 0 7px rgba(28,176,246,0);} }
.st .coin .n{ font-weight:800; font-size:13px; color:rgba(255,255,255,.6); }
.st.done .coin .n, .st.current .coin .n{ color:#fff; }
.st.current .coin .n{ font-size:14px; }
.st .coin .mi{ font-size:18px; color:rgba(255,255,255,.6); }
.st.done .coin .mi{ font-size:22px; color:#fff; filter:drop-shadow(0 1px 2px rgba(0,0,0,.2)); }
.st.current .coin .mi{ color:rgba(255,255,255,.9); }
.st .coin .boss{ font-size:22px; }
.st.locked .coin .boss{ font-size:20px; opacity:.4; }
.st .scroll{ position:absolute; bottom:-2px; right:-2px; font-size:14px; }

.pager{ display:flex; justify-content:center; align-items:center; gap:12px; margin-top:20px; }
.pager .nav{ all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:4px; padding:4px 5px; border-radius:8px; font-weight:700; font-size:13px; color:var(--mui-primary); }
.pager .nav:hover{ background:rgba(0,203,97,.08); }
.pager .nav.dis{ color:rgba(145,158,171,.8); cursor:default; }
.pager .nav .mi{ font-size:18px; }
.pager .pg{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; cursor:pointer; font-weight:800; font-size:13px; color:var(--ink-soft); border:2px solid var(--line); }
.pager .pg:hover{ background:#E8F4FE; }
.pager .pg.on{ background:var(--info); color:#fff; border:none; }

.mascot2{ position:fixed; bottom:0; right:0; z-index:5; pointer-events:none; }
.mascot2 img{ width:360px; height:360px; object-fit:contain; filter:drop-shadow(0 4px 12px rgba(0,0,0,.15)); margin:0 -24px -80px 0; }

/* Session dialog (session-dialog.js) */
.ov{ display:none; position:fixed; inset:0; z-index:9998; align-items:center; justify-content:center; background:rgba(0,0,0,.5); padding:24px; }
.ov.on{ display:flex; }
.ov .card{ width:100%; max-width:360px; background:rgba(255,255,255,.97); backdrop-filter:blur(12px); border-radius:24px; padding:28px 32px;
  box-shadow:0 0 50px rgba(11,60,35,.25), 0 20px 60px rgba(0,0,0,.2); border:3px solid rgba(255,255,255,.7); display:flex; flex-direction:column; gap:20px; }
.ov .em{ text-align:center; font-size:44px; }
.ov .ti{ font-family:var(--font-title); font-weight:800; font-size:22px; text-align:center; }
.ov .bd{ font-size:14px; color:var(--ink-soft); text-align:center; line-height:1.5; }
.ov .pri{ all:unset; cursor:pointer; background:linear-gradient(180deg,#20B95F,#12A150); color:#fff; font-family:var(--font-title); font-weight:600; font-size:17px; border-radius:14px; padding:12.8px 0; text-align:center; box-shadow:inset 0 -3px 0 rgba(0,0,0,.16); }
.ov .gho{ all:unset; cursor:pointer; font-weight:700; font-size:15px; color:var(--ink-soft); padding:9.6px 0; text-align:center; border-radius:14px; margin-top:10px; }
</style>
</head>
<body>
<div class="layout" id="app"></div>
<script src="mock.js"></script>
<script>
(() => {
  const { LEVELS, world, student, currentLevelId, maxUnlockedLevel, subtitle, starPct, q } = window.WG;
  const screen = q('screen', 'map');
  const app = document.getElementById('app');
  const A = '../../assets/game/v2';

  const hud = () => `
    <div class="logo"><img src="${A}/wordgame.webp" alt="Word Game"></div>
    <div class="hud">
      <div class="stars"><span class="mi">star</span><b>${student.stars.toLocaleString()}</b></div>
      <button class="iconbtn" id="snd" aria-label="Sound settings"><span class="mi">volume_up</span></button>
      <div class="acct"><div class="av">${student.initials}</div></div>
    </div>
    <div class="pop ${q('sound') ? 'on' : ''}" id="pop">
      <h6>Sound Settings</h6>
      <div class="music"><div class="row"><div class="l"><span class="mi">music_note</span>Music</div><button class="m"><span class="mi">volume_up</span></button></div><div class="sl"><b></b><i></i></div></div>
      <div class="sfx"><div class="row"><div class="l"><span class="mi">notifications_active</span>Sound Effects</div><button class="m"><span class="mi">volume_up</span></button></div><div class="sl"><b></b><i></i></div></div>
    </div>`;

  const status = (id) => (id > maxUnlockedLevel ? 'locked' : id === currentLevelId ? 'current' : 'unlocked');
  const hoverId = Number(q('hover', -1));

  const renderMap = () => {
    const nodes = LEVELS.map((l) => {
      const s = status(l.id);
      const hov = l.id === hoverId;   // 產品：onMouseEnter 不看 locked，鎖住的世界一樣有光暈（只有 cursor 變 not-allowed）
      const img = (s === 'current' || hov) ? `${A}/level/${l.id}.webp` : `${A}/level/${l.id}.webp`;
      const z = hov ? 20 : s === 'current' ? 10 : 5;
      return `
      <div class="node ${s} ${hov ? 'hover' : ''}" style="left:${l.x}%; top:${l.y}%; z-index:${z}; --t:${l.theme}">
        <div class="anchor">
          ${hov ? '<div class="glow"></div>' : ''}
          ${s === 'current' ? '<div class="goldbg"></div><div class="ring"></div><div class="cta"><b>Click to Start!</b><i></i></div>' : ''}
          <img class="bld" src="${img}" alt="${l.name}" style="--w:${l.size / 10}vw; --max:${l.size}px">
          <div class="lbl">Level ${l.id}</div>
          ${s === 'locked' ? '<div class="lock"><span class="mi">lock</span></div>' : ''}
        </div>
      </div>`;
    }).join('');
    app.innerHTML = `
      ${hud()}
      <div class="map">
        <div class="scene">
          <img src="${A}/bg.webp" alt="">
          <div class="overlay">
            <div class="lvinfo">
              <img src="${A}/moscot/6.webp" alt="">
              <div class="box"><b>Level ${currentLevelId}</b>
                <div class="pr"><div class="bar"><i style="width:${(world.completed / world.total) * 100}%"></i></div><span>${world.completed}/${world.total}</span></div>
              </div>
            </div>
            ${nodes}
          </div>
        </div>
        <div class="mascot">
          <div class="bubble"><span id="tw"></span><i>|</i></div>
          <img src="${A}/moscot/1.webp" alt="Douhua">
        </div>
      </div>`;
    typewriter();
  };

  const typewriter = () => {
    const MSGS = ["Hi, I'm Douhua! 👋", 'Ready to learn Chinese? 🐾'];
    const el = document.getElementById('tw'); if (!el) return;
    let m = 0, c = 0;
    const step = () => {
      const msg = MSGS[m];
      if (c < msg.length) { c += 1; el.textContent = msg.slice(0, c); setTimeout(step, 50); return; }
      if (m < MSGS.length - 1) setTimeout(() => { m += 1; c = 0; el.textContent = ''; step(); }, 2000);
    };
    step();
  };

  const renderStages = () => {
    const PER = 30, COLS = 10;
    const pages = Math.ceil(world.total / PER);
    const page = Math.min(pages, Math.max(1, Number(q('page', Math.floor(world.currentIndex / PER) + 1)))) - 1;
    const start = page * PER, end = Math.min(start + PER, world.total);
    const DECO = ['🏮','🌸','🐉','🏯','☁️','🎋','🌙','🍵','🎏','🧧'];
    const rows = [];
    for (let i = start; i < end; i += COLS) rows.push(world.stages.slice(i, Math.min(i + COLS, end)).map((s, j) => ({ s, idx: i + j })));

    const node = ({ s, idx }) => {
      const done = s.passed, cur = idx === world.currentIndex, locked = !s.unlocked;
      const quiz = s.type === 'QUIZ' || s.type === 'BOSS', boss = s.type === 'BOSS';
      const pct = starPct(s), part = pct > 0 && pct < 100;
      const rc = cur ? '#0B7FB8' : done && quiz ? '#C89200' : done ? '#3D7A3F' : '#C0C0C0';
      let bg = '#D5D5D5';
      if (boss && done) bg = '#EA2B2B';
      else if (cur) bg = '#1CB0F6';
      else if (done && quiz && !boss) bg = '#FFC107';
      else if (done && !boss) bg = '#6BAF6E';
      const inner = boss ? '<span class="boss">👹</span>' : quiz ? '<span class="mi">star</span>' : `<span class="n">${s.level}</span>`;
      return `<div class="st ${done ? 'done' : ''} ${cur ? 'current' : ''} ${locked ? 'locked' : ''}" style="--rc:${rc}; --bg:${bg}; --deg:${pct * 3.6}deg">
        <div class="oring ${part ? 'part' : ''}"></div>
        <div class="coin">${inner}${quiz && !boss && !locked ? '<span class="scroll">📜</span>' : ''}</div>
      </div>`;
    };

    const pager = pages > 1 ? `<div class="pager">
        <button class="nav ${page === 0 ? 'dis' : ''}"><span class="mi">chevron_left</span>Prev</button>
        ${Array.from({ length: pages }, (_, i) => `<a class="pg ${i === page ? 'on' : ''}" href="?screen=stages&page=${i + 1}">${i + 1}</a>`).join('')}
        <button class="nav ${page === pages - 1 ? 'dis' : ''}">Next<span class="mi">chevron_right</span></button>
      </div>` : '';

    app.innerHTML = `
      <img class="bgimg" src="${A}/bg1.webp" alt="">
      ${hud()}
      <div class="content"><div class="stagewrap">
        <div class="hdr">
          <a class="back" href="?screen=map"><span class="mi">arrow_back</span></a>
          <div class="t"><b>Level ${world.id}</b><span>${subtitle(world.id)}</span><div class="bar"><i style="width:${(world.completed / world.total) * 100}%"></i></div></div>
          <div class="cnt">${world.completed}/${world.total}</div>
        </div>
        <div class="grid">
          ${rows.map((r, ri) => `<div class="row">${r.map(node).join('')}</div>${ri < rows.length - 1 ? `<div class="deco">${DECO[ri % DECO.length]}</div>` : ''}`).join('')}
          ${pager}
        </div>
      </div></div>
      <div class="mascot2"><img src="${A}/moscot/2.webp" alt="Douhua"></div>
      <div class="ov ${q('dlg') ? 'on' : ''}"><div class="card">
        <div class="em">✏️</div><div class="ti">Continue your practice?</div>
        <div class="bd">You have unfinished progress on this stage. Continue where you left off, or start over from the beginning.</div>
        <div><button class="pri" style="width:100%">Continue</button><button class="gho" style="width:100%">Start over</button></div>
      </div></div>`;
  };

  if (screen === 'stages') renderStages(); else renderMap();
  document.getElementById('snd')?.addEventListener('click', () => document.getElementById('pop').classList.toggle('on'));
})();
</script>
</body>
</html>
