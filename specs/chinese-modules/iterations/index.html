<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versions &amp; Iteration — Chinese Modules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#1e293b; background:#f8fafc; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.topbar{ background:#fff; border-bottom:1px solid #e2e8f0; padding:14px 40px;
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100; flex-wrap:wrap; }
.topbar a{ color:#64748b; text-decoration:none; font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:6px; }
.topbar a:hover{ color:#1e293b; }
.topbar .sep{ color:#cbd5e1; }
.topbar .muted{ color:#64748b; font-size:13px; font-weight:600; }
.topbar .current{ color:#8b5cf6; font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px; }
.topbar .num{ display:inline-flex; align-items:center; justify-content:center; font-size:10px;
  font-weight:700; color:#fff; background:#8b5cf6; padding:2px 7px; border-radius:5px; }
.wrap{ max-width:1080px; margin:0 auto; padding:48px 24px 80px; }

header{ margin-bottom:40px; }
.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:.75rem; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:#8b5cf6; margin-bottom:12px; }
.eyebrow::before{ content:'2.4'; width:28px; height:22px; border-radius:7px; background:#8b5cf6;
  color:#fff; font-size:.6875rem; display:grid; place-items:center; letter-spacing:0; }
h1{ font-size:2rem; font-weight:800; letter-spacing:-.02em; color:#0f172a; }
.sub{ margin-top:8px; color:#64748b; font-size:1rem; max-width:70ch; }
.back{ display:inline-block; margin-top:20px; font-size:.875rem; color:#64748b; text-decoration:none; }
.back:hover{ color:#8b5cf6; }

.note{ margin-top:28px; padding:16px 18px; background:#faf5ff; border:1px solid #e9d5ff;
  border-radius:12px; font-size:.9375rem; color:#5b21b6; }
.note b{ font-weight:700; }

h2.sec{ font-size:.8125rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:#94a3b8; margin:44px 0 16px; }

.v{ background:#fff; border:1px solid #e2e8f0; border-radius:16px; overflow:hidden;
  box-shadow:0 1px 2px rgba(15,23,42,.04); margin-bottom:24px; }
.v-inner{ display:grid; grid-template-columns:minmax(0,420px) minmax(0,1fr); }
.v-prev{ background:#f1f5f9; border-right:1px solid #e2e8f0; position:relative; min-height:280px; }
.v-prev iframe{ position:absolute; inset:0; width:200%; height:200%; border:0;
  transform:scale(.5); transform-origin:0 0; }
.v-info{ padding:24px 26px 26px; }

.tag{ display:inline-flex; align-items:center; font-size:.6875rem; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; padding:4px 10px; border-radius:999px; }
.tag.draft{ background:#fef3c7; color:#92400e; }
.tag.done{ background:#dcfce7; color:#166534; }
.tag.logged{ background:#e2e8f0; color:#475569; }
.none{ position:absolute; inset:0; display:grid; place-items:center;
  color:#94a3b8; font-size:.875rem; }
td.muted{ color:#94a3b8; }
.v-name{ font-size:1.25rem; font-weight:700; color:#0f172a; margin:10px 0 2px; }
.v-date{ font-size:.8125rem; color:#94a3b8; }
.v-desc{ margin-top:12px; font-size:.9375rem; color:#475569; }

table{ width:100%; border-collapse:collapse; margin-top:16px; font-size:.875rem; }
th{ text-align:left; font-weight:700; color:#94a3b8; font-size:.75rem; letter-spacing:.05em;
  text-transform:uppercase; padding:0 10px 8px 0; border-bottom:1px solid #e2e8f0; }
td{ padding:10px 10px 10px 0; border-bottom:1px solid #f1f5f9; vertical-align:top; color:#475569; }
td:first-child{ white-space:nowrap; }
.side{ display:inline-flex; font-size:.75rem; font-weight:700; padding:2px 8px; border-radius:6px; }
.side-老師{ background:#dcfce7; color:#166534; }
.side-學生{ background:#ffedd5; color:#9a3412; }
.side-兩端{ background:#e0e7ff; color:#3730a3; }
td b{ color:#0f172a; font-weight:600; }

.acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
.acts a{ font-size:.8125rem; font-weight:600; text-decoration:none; padding:8px 14px;
  border-radius:9px; border:1px solid #e2e8f0; color:#475569; background:#fff; }
.acts a:hover{ border-color:#8b5cf6; color:#8b5cf6; }
.acts a.primary{ background:#8b5cf6; border-color:#8b5cf6; color:#fff; }
.acts a.primary:hover{ background:#7c3aed; }

@media (max-width:860px){ .v-inner{ grid-template-columns:1fr; }
  .v-prev{ border-right:0; border-bottom:1px solid #e2e8f0; height:220px; min-height:0; } }
</style>
</head>
<body>
<div class="topbar">
  <a href="../../../index.html">Home</a>
  <span class="sep">/</span>
  <span class="muted">Chinese Modules</span>
  <span class="sep">/</span>
  <span class="current"><span class="num">2.4</span> Versions &amp; Iteration</span>
</div>

<div class="wrap">

  <header>
    <div class="eyebrow">Chinese Modules</div>
    <h1>Versions &amp; Iteration</h1>
    <p class="sub">產品設計的版本線。基準是<strong>現行產品實際的樣子</strong>——每一版的設計稿都對照 dahua-dash 的程式碼畫出來，再往上迭代。</p>
    <div class="note">
      <b>一版 = 一個資料夾。</b> 要改就複製最新那個資料夾，在複製品裡改，改完它就是新的一版。編號最大的資料夾就是進行中的沙盒。
      流程見 <a href="../VERSIONING-WORKFLOW.md" style="color:inherit">VERSIONING-WORKFLOW.md</a>。
      這條線與 <a href="../teacher-redesign-versions.html" style="color:inherit">Redesign v0–v12</a> 那條探索性版本線互不相干。
    </div>
  </header>

  <h2 class="sec">版本</h2>
  <div id="list"></div>
</div>

<script>
const VERSIONS = [
  {
    id:'v2-review-skip',
    title:'v2 — To Review 增加 Skip',
    date:'2026-08-20',
    status:'draft',
    desc:'To Review 目前只有「批改完送出」一個出口，沒批的會一直留著（截圖上最舊的一筆 59 天前）。在面板標頭加一顆 Skip review，打開一個從右側滑出的多選清單，勾完一次跳過；skip 掉的併進 Reviewed 分頁、掛灰色 Skipped 章，學生端那一筆也進 History → Reviewed。',
    source:'https://dahua-dash-dev.web.app/school/teacher-dashboard/',
    spec:'v2-review-skip/spec.html',
    pages:[['Skip review · 右側抽屜','v2-review-skip/skip-review-drawer.html?skip=1&noblur=1'],['學生端 · History','v2-review-skip/student.html?screen=hist&hist=reviewed&open=global-warming'],['基準（現行產品）','v2-review-skip/teacher-dashboard.html']],
    changes:[
      ['老師','標頭一顆 Skip review，打開是可多選的清單','只列未批改的、最舊的排最上面，Select all 與「Older than 30 days」一鍵勾。做成右側抽屜，跟批改抽屜同一種開法。'],
      ['老師','skip 完併進 Reviewed，掛灰色 Skipped 章','不加第三個分頁。打開來補批就會轉成真的 review，所以不必另做 undo。'],
      ['老師','兩顆按鈕都叫 Skip review','這一側沒有任何地方只寫 Skip，不會跟左欄的 Skip assignment 撞名。'],
      ['老師','紅色只留給 Skip 按鈕','勾選中的列改淺灰、checkbox 與天數改綠。紅色只代表「按下去不可逆」。'],
      ['學生','skip 掉的進 History → Reviewed','狀態章跟真的批過的一樣，「等待老師批改」收掉；老師回饋卡只寫 No teacher comment。'],
    ],
  },
  {
    id:'v1-practice-hierarchy',
    title:'v1 — Practice 練習層級優化',
    date:'2026-08-19',
    status:'draft',
    desc:'把藏在建立流程第 2 步的第二層全部攤平成八張同層卡片，八個名稱依「素材 + 練法」重新定義成一套系統。',
    source:'https://dahua-dash-dev.web.app/dashboard/practice/',
    spec:'v1-practice-hierarchy/spec.html',
    pages:[['提案 A','v1-practice-hierarchy/choose-practice-type-a.html'],['提案 B','v1-practice-hierarchy/choose-practice-type-b.html'],['提案 C','v1-practice-hierarchy/choose-practice-type-c.html'],['鎖定狀態','v1-practice-hierarchy/locked-state.html?s=nobank']],
    changes:[
      ['老師','第二層攤平成八張同層卡片','Vocabulary 和 Sentence Patterns 原本各有兩個子項目，藏在建立流程的第 2 步。現在全部升到選擇畫面，六張變八張，選一次就決定完。'],
      ['老師','八個名稱全部重新定義成「素材 + 練法」','攤平後剛好是四種素材（課文／生詞／教學點／題庫）各兩個練法。兩個 Mirroring、兩個 Quiz 同名是刻意的——它們本來就是同一個練法，差別只在素材。'],
      ['老師','題庫依賴寫進名字','Multiple Choice → Question Bank Quiz，QA Practice → Question Bank QA。原本要點下去才知道這兩個需要題庫。'],
    ],
  },
];

document.getElementById('list').innerHTML = VERSIONS.map(v => {
  const prev = v.pages[0]
    ? `<iframe src="${v.pages[0][1]}" title="${v.title} preview" loading="lazy"></iframe>`
    : '<div class="none">尚無設計檔</div>';
  const TAG = { logged:['logged','已登記'], draft:['draft','進行中 · 沙盒'], done:['done','已定稿'] };
  const [cls,label] = TAG[v.status] || TAG.logged;
  const tag = `<span class="tag ${cls}">${label}</span>`;
  const rows = v.changes.length
    ? v.changes.map(c => `<tr><td><span class="side side-${c[0]}">${c[0]}</span></td><td><b>${c[1]}</b><br>${c[2]}</td></tr>`).join('')
    : '<tr><td colspan="2" class="muted">還沒有改動。</td></tr>';
  const acts = v.pages.map((p,i) =>
      `<a class="${i ? '' : 'primary'}" href="${p[1]}" target="_blank" rel="noopener">開啟 ${p[0]}</a>`).join('')
    + `<a class="${v.pages.length ? '' : 'primary'}" href="${v.source}" target="_blank" rel="noopener">現行產品 ↗</a>`
    + (v.spec ? `<a href="${v.spec}">Spec</a>` : '')
    + `<a href="${v.id}/ITERATION.md">ITERATION.md</a>`;

  return `<div class="v"><div class="v-inner">
    <div class="v-prev">${prev}</div>
    <div class="v-info">
      ${tag}
      <div class="v-name">${v.title}</div>
      <div class="v-date">${v.date}</div>
      <div class="v-desc">${v.desc}</div>
      <table><thead><tr><th style="width:64px">端</th><th>改了什麼</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="acts">${acts}</div>
    </div>
  </div></div>`;
}).join('');
</script>
</body>
</html>
