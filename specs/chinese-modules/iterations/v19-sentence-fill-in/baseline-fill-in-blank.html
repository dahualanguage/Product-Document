     src/sections/questionsBank/view/generate/questions/multi-choice-questions.js   第三步：區塊頭（Generate More 藍鈕）、分類標題（28px quiz 方塊 + N questions）、題幹 TextField label Question n、選項 Grid 6/6 Paper

<script>
/* 假資料：跟 v14 基準同一份。只有「我的一天」題庫有一題 usage */
const ARTICLE = ['我每天七点起床。','我早饭吃面包。','我八点上课。','下午我去图书馆看书。','我十一点睡觉。'];
const PINYIN  = ['wǒ měi tiān qī diǎn qǐ chuáng.','wǒ zǎo fàn chī miàn bāo.','wǒ bā diǎn shàng kè.','xià wǔ wǒ qù tú shū guǎn kàn shū.','wǒ shí yī diǎn shuì jiào.'];
const Q = { category:'usage', question:'我八点＿＿＿。', choice:{ A:'起床', B:'上课', C:'睡觉', D:'看书' }, answer:'B' };
const qs = new URLSearchParams(location.search);
const view = ['generate','questions','student'].includes(qs.get('view')) ? qs.get('view') : 'generate';
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SHELL = (inner) => `
<aside class="side">
  <div class="logo"><img src="../../assets/dh_single.png" alt="Dahua.ai"><b>Dahua<i>.ai</i></b></div>
  <nav class="nav">
    <div class="grp"><div class="sh blank">&nbsp;</div><a href="#"><span class="mi">space_dashboard</span>Dashboard</a></div>
    <div class="grp"><div class="sh">content</div><a href="#"><span class="mi">folder</span>Projects</a><a href="#" class="on"><span class="mi">quiz</span>Question Banks</a></div>
    <div class="grp"><div class="sh">practice</div><a href="#"><span class="mi">assignment</span>Practice List</a><a href="#"><span class="mi">sports_esports</span>Word Game</a></div>
    <div class="grp"><div class="sh">overview</div><a href="#"><span class="mi">people</span>Students</a><a href="#"><span class="mi">school</span>Classes</a><a href="#"><span class="mi">emoji_events</span>Leaderboard</a><a href="#"><span class="mi">groups</span>Program</a></div>
  </nav>
  <div class="report"><a href="#">Report Issue</a></div>
</aside>
<div class="mainwrap"><div class="hdr"><div class="acct"><div class="av">L</div></div></div><div class="main"><div class="container">${inner}</div></div></div>`;

/* BulkQuestionTypeSection：三個區塊；Multi-Choice 的 Fill in blank 填 2、其餘 0 */
const SECTION = (title, c, cats, counts, existing) => {
  const total = cats.reduce((s, k) => s + (counts[k.key] || 0), 0);
  const ex = cats.reduce((s, k) => s + (existing[k.key] || 0), 0);
  return `<div class="sec ${total ? 'has' : ''}" style="--sbg:${c.bg};--sbd:${c.bd};--sc:${c.c}">
    <div class="shd"><span class="ic"><span class="mi">${c.icon}</span></span><span class="t">${title}</span>
      ${ex ? `<span class="gen">${ex} generated</span>` : ''}${total ? `<span class="new">+${total} new</span>` : ''}<span class="mi">keyboard_arrow_up</span></div>
    <div class="body">${cats.map(k => `<div class="crow">
      <span class="cic"><span class="mi">${k.icon}</span></span>
      <div class="meta"><b>${k.label}</b><span>${k.desc}</span></div>
      ${existing[k.key] ? `<span class="ex">${existing[k.key]} generated</span>` : ''}
      <div class="cnt"><button ${counts[k.key] ? '' : 'disabled'} aria-label="Decrease"><span class="mi">remove</span></button><b>${counts[k.key] || 0}</b><button ${counts[k.key] >= 10 ? 'disabled' : ''} aria-label="Increase"><span class="mi">add</span></button></div>
    </div>`).join('')}</div></div>`;
};
const TF_CATS = [
  { key:'comprehension', label:'Comprehension', desc:'Based on example sentences', icon:'chat_bubble_outline' },
  { key:'pinyin', label:'Pinyin', desc:'Identify correct pinyin', icon:'translate' },
  { key:'meaning', label:'Meaning', desc:'Match with correct meaning', icon:'swap_horiz' },
];
const MC_CATS = [
  { key:'comprehension', label:'Comprehension', desc:'Based on example sentences', icon:'chat_bubble_outline' },
  { key:'usage', label:'Fill in blank', desc:'Select the correct word', icon:'edit_note' },
  { key:'pinyin', label:'Pinyin', desc:'Identify correct pinyin', icon:'translate' },
  { key:'meaning', label:'Meaning', desc:'Match with correct meaning', icon:'swap_horiz' },
];
const QA_CATS = [
  { key:'shortAnswer', label:'Content Base', desc:'Answer based on the content', icon:'question_answer' },
  { key:'extension', label:'Extension', desc:'Higher-order thinking questions', icon:'psychology' },
];
const TF_C = { bg:'#F0FDF4', bd:'#A7F3D0', c:'#10B981', icon:'check_circle' };
const MC_C = { bg:'#EFF6FF', bd:'#BFDBFE', c:'#3B82F6', icon:'list_alt' };
const QA_C = { bg:'#FAF5FF', bd:'#E9D5FF', c:'#8B5CF6', icon:'help_outline' };

const WIZ = (i) => `<div class="wizhd"><span class="ic"><span class="mi">quiz</span></span><div><div class="t">Questions Bank</div><div class="s">Generate questions in 3 simple steps.</div></div></div>
  <div class="wizsteps">${['Create','Generate','View & Edit'].map((t, k) => `<span class="${k === i ? 'on' : ''}">${k + 1} · ${t}</span>`).join('')}</div>`;

const GENERATE = () => `
  ${WIZ(1)}
  <div class="stephd"><span class="num">2</span><span class="h6">Generate Questions</span></div>
  <div class="lbl">Project</div>
  <div class="projbox">我的一天 <span class="tag lang">zh-CN</span><span class="tag lvl">HSK 2</span></div>
  <div class="lbl">Questions Bank Name</div>
  <div class="namerow"><div class="tf">我的一天</div><button class="btn contained" disabled>Save</button></div>
  <hr class="plain">
  <div class="divr" style="margin-bottom:16px">Project Content</div>
  <div class="ctpaper">${ARTICLE.join('')}</div>
  <hr class="plain">
  <div class="lbl" style="margin-bottom:4px">Question Types</div>
  <div class="body2" style="color:var(--text2);margin-bottom:16px">Select and set the number of questions for each type.</div>
  ${SECTION('True & False', TF_C, TF_CATS, {}, { comprehension:4 })}
  ${SECTION('Multi-Choice', MC_C, MC_CATS, { usage:2 }, { comprehension:3, usage:1, pinyin:1, meaning:1 })}
  ${SECTION('Q&A', QA_C, QA_CATS, {}, {})}
  <div class="actions"><button class="btn outlined">View Questions</button><button class="btn contained"><span class="mi" style="font-size:18px">auto_awesome</span>Generate</button></div>`;

const QUESTIONS = () => `
  ${WIZ(2)}
  <div class="stephd"><span class="num">3</span><span class="h6">View &amp; Edit Questions</span></div>
  <div class="sec" style="--sbg:#EFF6FF;--sbd:#BFDBFE;--sc:#3B82F6;border-color:#BFDBFE">
    <div class="shd" style="cursor:default"><span class="ic"><span class="mi">list_alt</span></span><span class="t">Multi-Choice</span><button class="btn contained sm" style="background:#3B82F6;box-shadow:none"><span class="mi" style="font-size:14px">auto_awesome</span>Generate More</button></div>
    <div class="body" style="padding:16px 20px">
      <div class="cathd"><span class="ic"><span class="mi">quiz</span></span><b>Fill in blank</b><span>1 question</span></div>
      <div class="qcard">
        <div class="acts"><button aria-label="Delete Question"><span class="mi">delete</span></button></div>
        <div class="qtf"><label>Question 1</label>${esc(Q.question)}</div>
        <div class="opts">${Object.entries(Q.choice).map(([k, v]) => `<div class="opt ${k === Q.answer ? 'ok' : ''}"><span class="k">${k}:</span><span class="v">${esc(v)}</span>${k === Q.answer ? '<span class="chk"><span class="mi">check</span></span>' : ''}</div>`).join('')}</div>
      </div>
      <div class="cap" style="padding:0 16px">（這個題庫其他分類的題目省略；只畫 Fill in blank 這一類）</div>
    </div>
  </div>`;

const STUDENT = () => {
  const picked = qs.get('picked');
  const cls = (k) => {
    if (!picked) return '';
    if (k === Q.answer) return 'right';
    if (k === picked) return 'wrong';
    return 'dim';
  };
  const icon = (k) => { if (!picked) return ''; if (k === Q.answer) return '<span class="mi">check_circle</span>'; if (k === picked) return '<span class="mi">cancel</span>'; return ''; };
  return `<div class="stu">
    <div class="top"><div class="bar"><i style="width:${Math.round(5 / 6 * 100)}%"></i></div><span class="n"><b>5</b> / <em>6</em></span></div>
    <div class="scroll"><div class="lg">
      <div class="card pc"><div class="in">
        <div class="ph"><span class="t">Project Content</span><button class="ib" aria-label="Play"><span class="mi">volume_up</span></button></div>
        <div class="swrow"><span class="sw"><span class="tr"></span>Pinyin</span><span class="sw"><span class="tr"></span>Translation</span></div>
        <div class="sent">${ARTICLE.map(esc).join('')}</div>
      </div></div>
      <div>
        <div class="card"><div class="in">
          <div class="chips"><span class="chip type">Multi-Choice</span><span class="chip cat">Fill in blank</span></div>
          <div class="stem">${esc(Q.question)}</div>
          <div class="olist">${Object.entries(Q.choice).map(([k, v]) => `<div class="orow ${cls(k)}"><span class="l">${k}</span><span class="v">${esc(v)}</span>${icon(k)}</div>`).join('')}</div>
        </div></div>
        <div class="navrow"><button class="btn outl"><span class="mi" style="font-size:18px">arrow_back</span>Previous</button><button class="btn contained" ${picked ? '' : 'disabled'}>Next<span class="mi" style="font-size:18px">arrow_forward</span></button></div>
      </div>
    </div></div>
  </div>`;
};

const app = document.getElementById('app');
if (view === 'generate') app.innerHTML = SHELL(GENERATE());
else if (view === 'questions') app.innerHTML = SHELL(QUESTIONS());
else app.innerHTML = STUDENT();
document.querySelectorAll('.baseline a[id]').forEach((a) => { if (a.getAttribute('href') === location.search) a.classList.add('cur'); });
if (!location.search) document.getElementById('l0').classList.add('cur');
</script>
</body>
</html>
