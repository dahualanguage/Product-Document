*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --primary:#00CB61; --primary-dark:#00A749; --primary-lighter:#BBF1D0;
  --text:#212B36; --text2:#637381; --text3:#919EAB;
  --divider:rgba(145,158,171,.2); --hover:rgba(145,158,171,.08);
  --grey100:#F9FAFB; --grey200:#F4F6F8; --grey300:#DFE3E8;
  --success:#22C55E; --success-lighter:#D3FCD2; --success-dark:#118D57;
  --warning:#FFAB00; --warning-lighter:#FFF5CC; --warning-dark:#B76E00;
  --error:#FF5630; --error-lighter:#FFE9D5; --error-dark:#B71D18;
  --info:#508AFC; --info-lighter:#DCECFE; --info-dark:#193592;
  --shadow-card:0 0 2px 0 rgba(145,158,171,.2), 0 12px 24px -4px rgba(145,158,171,.12);
  --z1:0 1px 2px 0 rgba(145,158,171,.16);
  --z3:0 3px 5px -1px rgba(145,158,171,.2), 0 6px 10px 0 rgba(145,158,171,.14);
}
body{ font-family:'Public Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f4f7fb; color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased; padding-bottom:48px; }
.mi{ font-family:'Material Icons Round'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; white-space:nowrap; direction:ltr; -webkit-font-feature-settings:'liga'; -webkit-font-smoothing:antialiased; user-select:none; }
button{ font-family:inherit; cursor:pointer; }
:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

<script>
(function(){
  const M = window.V23; const esc = M.esc;
  const qs = new URLSearchParams(location.search);
  const typeKey = M.PRACTICES[qs.get('type')] ? qs.get('type') : 'vocab';
  const P = { ...M.PRACTICES[typeKey], ...(qs.get('name') ? { name: qs.get('name') } : {}) };   // v24 基準的 Student Submissions／Result 帶 name 進來
  const S = {
    stu: qs.get('unsub') === '1' ? 'noah' : (qs.get('stu') || M.firstSubmitted()),
    empty: qs.get('empty') === '1',
    canEdit: qs.get('noedit') !== '1',
    ai: qs.get('ai') === '1', rt: qs.get('rt') === '1', wrong: qs.get('wrong') === '1',
    tab: qs.get('tab') === 'feedback' ? 'feedback' : 'conversation',
    edit: qs.get('edit') === '1',
    collapsed: new Set((qs.get('grp') || '').split(',').filter(Boolean)),
    comment: '',
  };
  if (S.empty) { M.GROUPS.forEach((g) => g.students.forEach((s) => { s.base = null; })); S.stu = null; }   // 沒人交：產品 findFirstSubmitted 回 null，左欄沒有選中

  /* ---------- 左欄 ---------- */
  const groupLabel = (g) => [g.className, g.due].filter(Boolean).join(' · ');
  const renderRow = (s) => {
    const submitted = s.base != null; const score = M.scoreOf(s);
    const right = submitted
      ? `<span class="rt">${s.old ? `<span class="oldchip">v${s.old} · Old version</span>` : ''}${M.lateOf(s) != null ? `<span class="latechip">Late · ×${M.lateOf(s)}%</span>` : ''}<span class="scorechip">${score}</span></span>`
      : '<span class="rt"><span class="dash">–</span></span>';
    return `<button class="srow ${s.id === S.stu ? 'sel' : ''}" data-stu="${s.id}"><span class="nm ${submitted ? '' : 'dis'}">${esc(s.name)}</span>${right}</button>`;
  };
  const renderGroup = (g) => {
    const open = !S.collapsed.has(g.key); const rows = M.sortedStudents(g);
    const n = rows.filter((s) => s.base != null).length;
    return `<div><button class="grp-hd" data-grp="${g.key}"><span class="lf"><span class="mi">${open ? 'keyboard_arrow_up' : 'keyboard_arrow_down'}</span><b>${esc(groupLabel(g))}</b></span><span class="cntchip">${n}/${rows.length}</span></button>
      ${open ? `<div class="grp-bd">${rows.map(renderRow).join('')}</div>` : ''}</div>`;
  };
  const renderLeft = () => {
    const sum = M.summary();
    return `<div class="lp">
      <div class="sumrow">
        <div class="sumcard"><div class="v" style="color:var(--primary)">${sum.submitted}</div><div class="l">Submitted</div></div>
        <div class="sumcard"><div class="v" style="color:var(--success)">${sum.avg}</div><div class="l">Avg Score</div></div>
        <div class="sumcard"><div class="v" style="color:var(--warning)">${sum.perfect}</div><div class="l">Perfect</div></div>
      </div>
      <div class="roster">${M.GROUPS.filter((g) => !(g.left && S.empty)).map(renderGroup).join('')}</div>
    </div>`;
  };

  /* ---------- 右欄共用 ---------- */
  const overrideCtl = (h) => {
    const canOverride = S.canEdit && !h.student.group.left && M.OVERRIDABLE.has(P.practiceType);
    const v2 = P.engine === 'V2';
    return `<div class="soc"><div class="l1"><b>${h.score}/100</b>
      ${h.late != null ? `<span class="latechip">Late · ×${h.late}%</span>` : ''}
      ${h.override != null ? '<span class="adjchip">Adjusted</span>' : ''}
      ${canOverride ? '<button class="iconbtn" data-act="edit" aria-label="edit score" title="Edit score"><span class="mi">edit</span></button>' : ''}</div>
      ${v2 ? '' : `<div>${M.svgStars(h.stars, 18)}</div>`}</div>`;
  };
  const commentBox = (h) => {
    if (!S.canEdit || h.student.group.left) return '';
    const val = S.comment || h.comment || '';
    return `<div class="tcbox"><h3>📝 Teacher Comment</h3>
      <textarea placeholder="Leave your comment for the student here..." maxlength="2000" data-comment>${esc(val)}</textarea>
      <div class="help">${val.length} / 2000 characters</div>
      <div class="ft"><button class="btn contained" ${val.trim() ? '' : 'disabled'}>${h.comment ? 'Update Comment' : 'Send Comment'}</button></div></div>`;
  };
  const playBtn = () => '<button class="play36" aria-label="Play student recording"><span class="mi">play_arrow</span></button>';
  const retakeList = (total, engine, opts = {}) => {
    if (!total || total < 1) return '';
    const open = opts.open;
    const rows = []; for (let i = 1; i <= total; i += 1) {
      const last = i === total; const unscored = opts.unscoredAt === i;
      const sc = unscored ? '<span class="ns">Not scored · too short</span>'
        : engine === 'V2' ? `<span class="sc">${Math.max(40, opts.base - (total - i) * 9)}<small> / 100</small></span>`
        : M.svgStars(Math.max(1, opts.base - (total - i) * 0.5), 18);
      rows.push(`<div class="row ${last ? 'sel' : ''}"><button class="pick" ${unscored ? 'disabled' : ''} aria-pressed="${last}"><span class="an">Attempt ${i}</span>${sc}</button><span class="pp">${playBtn()}</span></div>`);
    }
    return `<hr class="divider"><div class="rt">${opts.notes ? `<div class="notes">${opts.notes}</div>` : ''}
      <button class="tgl" data-act="rt"><span class="mi">${open ? 'keyboard_arrow_up' : 'keyboard_arrow_down'}</span>${open ? 'Hide recordings' : `View all ${total} recording${total === 1 ? '' : 's'}`}</button>
      ${open ? `<div class="rows">${rows.join('')}</div>` : ''}</div>`;
  };
  const rubricRows = (r) => [['Fluency', r.fluency], ['Accuracy', r.accuracy], ['Pronunciation', r.pronunciation], ['Vocabulary', r.vocabulary]]
    .filter(([, v]) => v).map(([l, v]) => { const c = v >= 85 ? '#10B981' : v >= 70 ? '#F59E0B' : '#EF4444';
      return `<div class="rubrow"><div class="t"><span>${l}</span><span>${v}%</span></div><div class="bar"><i style="width:${v}%;background:${c}"></i></div></div>`; }).join('');

  /* ---------- 句卡 ---------- */
  const graded = (words) => `<div class="graded">${words.map((w) => `<div class="gw"><span class="py">${w.pinyin}</span><span class="zh" style="color:${M.STATUS[w.status]}">${w.word}</span>${M.svgStatus(w.status, 14)}</div>`).join('')}</div>`;
  const fbSection = (sec, kind) => {
    if (!sec) return '';
    const cfg = kind === 'pron' ? { icon: 'record_voice_over', label: 'Pronunciation Feedback', color: '#2563EB', bg: '#EFF6FF', bd: '#BFDBFE', nbg: '#DBEAFE' } : { icon: 'graphic_eq', label: 'Tone Feedback', color: '#059669', bg: '#F0FDF4', bd: '#D1FAE5', nbg: '#DCFCE7' };
    const items = sec.items || [];
    return `<div class="fbsec" style="border-color:${cfg.bd}"><div class="hd" style="background:${cfg.bg};border-color:${cfg.bd};color:${cfg.color}"><span class="mi">${cfg.icon}</span><b>${cfg.label}</b>${items.length ? `<span class="n" style="background:${cfg.nbg};color:${cfg.color}">${items.length} word${items.length > 1 ? 's' : ''}</span>` : ''}</div>
      <div class="bd">${sec.summary ? `<div class="sum">${esc(sec.summary)}</div>` : ''}${sec.summary && items.length ? '<hr class="divider">' : ''}
      ${items.map((it) => `<div class="fbitem"><div class="w">${M.svgStatus(it.color === 'red' ? 'incorrect' : 'warning', 16)}<u class="${it.color}">${it.word}（${it.pinyin}）</u></div><p>${esc(it.issue)}</p><p class="tip">💡 <b>Tip:</b> ${esc(it.tip)}</p></div>`).join('')}</div></div>`;
  };
  const v1Card = (c, i, h) => {
    const aiOpen = S.ai && c.fb && h.cards.findIndex((x) => x.fb) === i;
    const rtOpen = S.rt && c.retakes > 1 && h.cards.findIndex((x) => x.retakes > 1) === i;
    const inter = c.interaction;
    return `<div class="scard ${c.autoPass ? 'ap' : ''}">
      <div class="sc-top"><span class="numchip">#${i + 1}</span>${graded(c.words)}</div>
      <hr class="divider">
      <div class="sc-bot"><div class="lf">${M.svgStars(c.overall, 24)}
        ${c.autoPass ? `<span class="apchip" title="Original: ${c.overall} stars | Attempts: ${c.attempts}">Auto Pass</span>` : ''}
        ${inter ? `<span class="tog ${inter.pinyin ? 'on' : 'off'}">Pinyin: ${inter.pinyin ? 'ON' : 'OFF'}</span><span class="tog ${inter.translation ? 'on' : 'off'}">Translation: ${inter.translation ? 'ON' : 'OFF'}</span>` : ''}</div>
        <div class="acts">${c.fb ? '<button class="aibtn" data-act="ai"><span class="mi">psychology</span>AI Feedback</button>' : ''}<span class="audred"><span class="mi">play_arrow</span>Student recording</span></div></div>
      ${aiOpen ? `<hr class="divider"><div class="ai-bd">
        <div class="fbsecs">${fbSection(c.fb.pron, 'pron')}${fbSection(c.fb.tone, 'tone')}</div>
        <div><div class="legend"><span><i style="background:#22C55E"></i>Good</span><span><i style="background:#F59E0B"></i>Needs Work</span><span><i style="background:#EF4444"></i>Incorrect</span></div>
          <div class="wordrow">${c.words.map((w) => `<div class="wbox" style="border-color:${w.status === 'correct' ? 'transparent' : M.STATUS[w.status]}"><span class="py">${w.pinyin}</span><span class="zh" style="color:${M.STATUS[w.status]}">${w.word}</span>${M.svgStatus(w.status, 14)}</div>`).join('')}</div></div>
        <div class="pitchbox">${M.svgPitch(c.words.map((w) => ({ word: w.word, color: w.status === 'correct' ? 'green' : w.status === 'warning' ? 'yellow' : 'red' })), 640, 150)}</div>
      </div>` : ''}
      ${retakeList(c.retakes > 1 ? c.retakes : 0, 'V1', { open: rtOpen, base: c.overall, unscoredAt: c.retakes === 5 ? 2 : 0, notes: c.autoPass ? null : null })}
    </div>`;
  };
  const wordFeedback = (c) => {
    const order = ['red', 'grey', 'yellow'];
    const sel = order.map((col) => c.cols.findIndex((x) => x.color === col)).find((i) => i >= 0);
    if (sel == null) return { sel: -1, html: '' };
    const col = c.cols[sel]; const color = M.ROW[col.color]; const t = c.tone;
    let right;
    if (col.color === 'grey') right = `<div class="nodet"><span class="ic"><span class="mi" style="font-size:24px">mic_off</span></span><div><b>Word not detected</b><span>Try saying it clearly.</span></div></div>`;
    else if (t) right = `<div class="tonecard"><div class="t">Tone</div><div class="two">
        ${t.heard != null ? `<div class="one"><span class="lb">Your tone</span><span class="pz" style="color:#9ca3af">${M.applyTone(t.pinyin, t.heard)}</span>${M.svgTone(t.heard, '#9ca3af')}<span class="tl" style="color:#9ca3af">Tone ${t.heard} · ${M.TONE_LABELS[t.heard]}</span></div><div class="vd"></div>` : ''}
        <div class="one"><span class="lb">Target tone</span><span class="pz" style="color:#EF4444">${M.applyTone(t.pinyin, t.expected)}</span>${M.svgTone(t.expected, '#EF4444')}<span class="tl" style="color:#EF4444">Tone ${t.expected} · ${M.TONE_LABELS[t.expected]}</span></div></div>
        ${t.heard == null ? '<div class="hint">Listen and try to match the tone.</div>' : ''}</div>`;
    else right = '<div class="plain">Listen again and compare.</div>';
    return { sel, html: `<div class="wfb"><div class="lf"><span class="zh" style="color:${color}">${col.word}</span><span class="py">${col.pinyin}</span></div><div class="rt2">${right}</div></div>` };
  };
  const v2Card = (c, i, h) => {
    const rtOpen = S.rt && c.retakes > 1 && h.cards.findIndex((x) => x.retakes > 1) === i;
    const reds = c.cols.filter((x) => x.color === 'red').length, yels = c.cols.filter((x) => x.color === 'yellow').length, greys = c.cols.filter((x) => x.color === 'grey').length;
    const parts = [];
    if (reds) parts.push(`<span class="part"><i style="background:#EF4444"><span class="mi">close</span></i><b style="color:#EF4444">${reds}</b> word${reds > 1 ? 's' : ''} to correct</span>`);
    if (yels) parts.push(`<span class="part"><i style="background:#F59E0B"><span class="mi">priority_high</span></i><b style="color:#F59E0B">${yels}</b> word${yels > 1 ? 's' : ''} to review</span>`);
    if (greys) parts.push(`<span class="part"><i style="background:#9ca3af"><span class="mi">mic_off</span></i><b style="color:#9ca3af">${greys}</b> word${greys > 1 ? 's' : ''} not detected</span>`);
    const resTxt = { perfect: 'Perfect!', ok: 'Good job!', retry: 'Try again!' }[c.result];
    const wf = wordFeedback(c);
    return `<div class="v2card">
      <div class="v2-hd"><span class="lf"><span class="darkchip">#${i + 1}</span><span class="txt">${c.content}</span></span>${playBtn()}</div>
      <div class="v2-bd"><div class="v2panel">
        <div class="v2-top"><div class="lf"><span class="res ${c.result}">${resTxt}</span>${parts.join('')}</div><div><span class="big ${c.result}">${c.overall}</span><span class="per">/ 100</span></div></div>
        <div class="v2-chart"><div class="chartbox">
          <div class="cols">${c.cols.map((col, k) => `<div class="col ${k === wf.sel ? 'sel' : wf.sel >= 0 ? 'dim' : ''}" style="color:${M.ROW[col.color]};${k === wf.sel ? `background:${M.ROW[col.color]}18` : ''}"><span class="py">${col.pinyin}</span><span class="zh">${col.word}</span><span class="ic">${M.svgRow(col.color, 14)}</span></div>`).join('')}</div>
          ${M.svgPitch(c.cols, 640, 160, wf.sel)}
          <div class="clegend">${wf.sel >= 0 ? '<span><span class="mi">north_west</span><b>Tap a word for details.</b></span>' : ''}<span><i class="solid"></i>Your recording</span><span><i class="dash"></i>Model pronunciation</span></div>
        </div>${wf.html}</div>
      </div></div>
      ${retakeList(c.retakes > 1 ? c.retakes : 0, 'V2', { open: rtOpen, base: c.overall })}
    </div>`;
  };
  const sentencePanel = (h) => `<div class="panel">
    <div class="phd"><h2>${esc(h.student.name)}</h2>${overrideCtl(h)}</div>
    <div><div class="caption" style="margin-bottom:8px">Score breakdown</div><hr class="divider" style="margin-bottom:16px"><div class="rub">${rubricRows(h.rubric)}</div></div>
    <div class="cards">${h.cards.map((c, i) => (c.engine === 'V2' ? v2Card(c, i, h) : v1Card(c, i, h))).join('')}</div>

  /* ---------- MC／Scramble ---------- */
  const tier = (score) => (score >= 80 ? 'var(--success)' : score >= 60 ? 'var(--warning)' : 'var(--error)');
  const tierBg = (score) => (score >= 80 ? 'rgba(34,197,94,.08)' : score >= 60 ? 'rgba(255,171,0,.08)' : 'rgba(255,86,48,.08)');
  const scoreCard = (h, sub) => `<div class="sumbig"><div class="ring" style="border-color:${tier(h.score)};color:${tier(h.score)};background:${tierBg(h.score)}">${h.score}</div><div><h3>${esc(h.student.name)}</h3><div class="sub">${sub}${h.late != null ? `<span class="latechip">Late · ×${h.late}%</span>` : ''}</div></div></div>`;
  const filterHd = (title, all, wrong) => `<div class="qhd"><h3>${title}</h3><div class="tbg"><button class="${S.wrong ? '' : 'on'}" data-act="all">All (${all})</button><button class="err ${S.wrong ? 'on' : ''}" data-act="wrong">Wrong (${wrong})</button></div></div>`;
  const mcPanel = (h) => {
    const wrong = h.mc.answers.filter((a) => !a.isCorrect);
    const shown = S.wrong ? wrong : h.mc.answers;
    return `<div class="panel">
      ${scoreCard(h, `${h.mc.totalCount} questions · ${wrong.length} wrong`)}
      ${filterHd('Question Details', h.mc.answers.length, wrong.length)}
      <div class="cards">${shown.map((a) => { const q = h.questions[a.questionIndex]; const tc = M.MC_TYPE_COLORS[q.type] || '#666'; const ok = a.isCorrect;
        return `<div class="qcard ${ok ? 'ok' : 'bad'}"><div class="qc-top"><span class="lf"><span class="qnum ${ok ? 'ok' : 'bad'}">Q${a.questionIndex + 1}</span><span class="tchip" style="background:${tc}1F;color:${tc}">${M.MC_TYPE_LABELS[q.type] || q.type}</span><span class="catchip">${M.MC_CATEGORY_LABELS[q.cat] || q.cat}</span></span><span class="mi" style="color:${ok ? 'var(--success)' : 'var(--error)'}">${ok ? 'check_circle' : 'cancel'}</span></div>
          ${q.q ? `<div class="qtext">${esc(q.q)}</div>` : ''}
          ${ok ? `<div class="ans ok"><span class="mi">check</span><span>Correct: <b>${a.correct}. ${esc(q.choice[a.correct])}</b></span></div>`
               : `<div class="ans bad"><span class="mi">close</span><span>Student answer: <b>${a.selected}. ${esc(q.choice[a.selected])}</b></span></div><div class="ans ok"><span class="mi">check</span><span>Correct answer: <b>${a.correct}. ${esc(q.choice[a.correct])}</b></span></div>`}</div>`; }).join('')}</div></div>`;
  };
  const scramblePanel = (h) => {
    const wrong = h.sc.answers.filter((a) => !a.isCorrect);
    const shown = S.wrong ? wrong : h.sc.answers;
    const chips = (ws, cls) => `<div class="wchips">${ws.map((w) => `<span class="wchip ${cls}">${w}</span>`).join('')}</div>`;
    return `<div class="panel">
      ${scoreCard(h, `${h.sc.totalCount} sentences · ${wrong.length} wrong`)}
      ${filterHd('Sentence Details', h.sc.answers.length, wrong.length)}
      <div class="cards">${shown.map((a) => `<div class="qcard ${a.isCorrect ? 'ok' : 'bad'}"><div class="qc-top"><span class="qnum ${a.isCorrect ? 'ok' : 'bad'}">Sentence ${a.questionIndex + 1}</span><span class="mi" style="color:${a.isCorrect ? 'var(--success)' : 'var(--error)'}">${a.isCorrect ? 'check_circle' : 'cancel'}</span></div>
        <div><span class="ordlbl">Correct order</span>${chips(a.correctOrder, 'ok')}</div>
        ${a.isCorrect ? '' : `<div style="margin-top:12px"><span class="ordlbl">Student order</span>${chips(a.submittedOrder, 'bad')}</div>`}</div>`).join('')}</div></div>`;
  };

  /* ---------- Follow Pattern ---------- */
  const fpPanel = (h) => {
    const isB = h.review.practiceSubType === 'SENTENCE_BUILDING';
    const statusOf = (q) => (q.stale ? ['Question changed', 'warning'] : !q.attemptCount ? ['Not answered', 'default'] : q.passed ? ['Passed', 'success'] : ['Not passed', 'error']);
    const critStyle = (st, key) => (st === 'PENDING' ? ['#94A3B8', 'remove_circle_outline', M.CRITERIA.PENDING[key]] : st === 'PASS' ? ['#16A34A', 'check_circle', M.CRITERIA.PASS[key]] : ['#D97706', 'info', M.CRITERIA.FAIL[key]]);
    const rtOpen = S.rt;
    return `<div class="panel">
      <div class="phd"><h2>${esc(h.student.name)}</h2>${overrideCtl(h)}</div>
      <div class="cards">${h.review.questions.map((q, i) => { const [sl, sc] = statusOf(q); const answered = q.attemptCount > 0;
        return `<div class="fpcard"><div class="fp-hd"><span class="lf"><span class="q">Q${i + 1}</span><span class="stchip ${sc}">${sl}</span></span>${answered ? `<span class="rt">${M.svgGradStars(q.stars, 14)}<span class="att">${q.attemptCount} ${q.attemptCount === 1 ? 'attempt' : 'attempts'}</span></span>` : ''}</div>
          <div class="fp-bd"><div class="qq">${esc(q.question)}</div>
            ${q.reference ? `<div class="refbox"><div class="lbl11">${isB ? 'Teaching Point' : 'Pattern'}</div><div class="v">${esc(q.reference)}</div></div>` : ''}
            <hr class="divider">
            ${answered ? `<div class="ansbox"><div class="lbl11">Student answer</div><div class="row">${q.s3 ? playBtn() : ''}<div><div class="a">${esc(q.answer || q.transcript)}</div>${q.transcript && q.answer && q.transcript !== q.answer ? `<div class="heard">Heard as: ${esc(q.transcript)}</div>` : ''}</div></div></div>
              ${q.criteria.length ? `<div class="crits">${q.criteria.map((c) => { const [col, ic, lb] = critStyle(c.status, c.criterion); return `<div class="crit"><span class="mi" style="color:${col}">${ic}</span><div><b style="color:${col}">${lb}</b>${c.reason ? `<span>${esc(c.reason)}</span>` : ''}</div></div>`; }).join('')}</div>` : ''}
              ${q.correction ? `<div class="corrbox"><div class="lbl11">Correction</div><div class="v">${esc(q.correction)}</div></div>` : ''}
              ${q.feedback ? `<div class="fpfb">${esc(q.feedback)}</div>` : ''}`
            : '<div class="noans">The student did not answer this question.</div>'}
          </div>
          ${q.repeat ? `<hr class="divider"><div class="rep"><div class="lbl11">Repeat practice · ${q.repeat.source === 'PATTERN' ? 'from pattern' : 'from answer'}</div><div class="s">${q.repeat.sentence}</div><div class="tr">${esc(q.repeat.translation)}</div><div class="sm">${q.repeat.text}</div></div>${retakeList(q.repeat.count, 'V2', { open: rtOpen && i === 1, base: 88 })}` : ''}
        </div>`; }).join('')}</div>
      ${commentBox(h)}</div>`;
  };

  /* ---------- QA ---------- */
  const qaPanel = (h) => {

      ? `<div class="turn t"><div class="line"><div class="tbub">${t.content}</div><button class="playib"><span class="mi">play_arrow</span></button></div></div>`
      : `<div class="turn s"><div class="line"><button class="playib"><span class="mi">play_arrow</span></button><div class="sbub ${bub(t.overall)}">${M.svgStars(t.overall, 24)}${graded(t.words.map(([word, pinyin, status]) => ({ word, pinyin, status })))}</div></div>

    return `<div class="panel">

      <div class="qacard"><div class="tabs"><button class="tab ${S.tab === 'conversation' ? 'on' : ''}" data-tab="conversation">Conversation</button><button class="tab ${S.tab === 'feedback' ? 'on' : ''}" data-tab="feedback">AI Feedback</button></div>
        <div class="qabd">${S.tab === 'conversation' ? convo : fb}</div></div>

  /* ---------- 右欄 ---------- */
  const renderRight = () => {
    const s = M.studentById(S.stu);
    if (!s || S.empty) return `<div class="empty">${S.empty || !M.allStudents().some((x) => x.base != null) ? 'No submissions yet' : 'Select a student to view results'}</div>`;

  const dialog = () => {

    const h = M.historyFor(P, s);
    return `<div class="scrim" data-act="close"><div class="dlg" onclick="event.stopPropagation()"><h3>Edit Score</h3><div class="bd"><div class="fldo"><label>Score (0-100)</label><input type="number" min="0" max="100" value="${h.override != null ? h.override : ''}"></div></div>
      <div class="ft">${h.override != null ? '<button class="btn text warn">Revert to system</button>' : ''}<button class="btn text" data-act="close">Cancel</button><button class="btn contained">Save</button></div></div></div>`;
  };

  const render = () => {
    document.getElementById('app').innerHTML = `
      <a class="back" href="${qs.get('back') === 'dashboard' ? '../v25-teacher-dashboard/teacher-dashboard-baseline.html' : `../v24-practice-list-ended/practice-list-baseline.html?view=${qs.get('view') === 'list' ? 'list' : 'card'}`}" style="text-decoration:none"><span class="mi">arrow_back</span>Back</a>
      <div class="ttl"><h1>${esc(P.name)}</h1><span class="typechip" style="background:${P.tag.wash};color:${P.tag.label}">${P.label}</span></div>
      <div class="shell">${renderLeft()}<div class="rp">${renderRight()}</div></div>${dialog()}`;

  };

  document.getElementById('app').addEventListener('click', (e) => {
    const row = e.target.closest('[data-stu]'); if (row) { S.stu = row.dataset.stu; S.ai = false; S.rt = false; S.edit = false; S.comment = ''; render(); return; }
    const g = e.target.closest('[data-grp]'); if (g) { const k = g.dataset.grp; if (S.collapsed.has(k)) S.collapsed.delete(k); else S.collapsed.add(k); render(); return; }
    const tab = e.target.closest('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; render(); return; }

  });
  document.getElementById('app').addEventListener('input', (e) => {
    const ta = e.target.closest('[data-comment]'); if (!ta) return;
    S.comment = ta.value;

    box.querySelector('.btn').disabled = !ta.value.trim();
  });
  render();
