<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redesign v9 — Teacher · Slides (DAHUA AI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
<link rel="stylesheet" href="assets/teacher-shell.css" />
<style>
  .deck{ display:grid; grid-template-columns:210px minmax(0,1fr); height:calc(100vh - 75px); }

  /* ---------- thumbnail rail ---------- */
  .thumbs{ border-right:1px solid var(--line); background:#fff; overflow-y:auto; padding:12px 10px 20px; }
  .thumbs .grp{ font-size:10.5px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; color:var(--faint);
    padding:10px 4px 6px; }
  .th{ display:flex; gap:9px; align-items:flex-start; width:100%; padding:5px; border:none; background:none;
    cursor:pointer; border-radius:9px; text-align:left; transition:.13s; }
  .th:hover{ background:#f5f8fb; }
  .th .no{ font-size:10.5px; font-weight:800; color:var(--faint); width:15px; flex:none; padding-top:12px; text-align:right; }
  .th .mini{ flex:1; aspect-ratio:16/9; border:1.5px solid var(--line); border-radius:6px; background:#fff;
    display:grid; place-items:center; overflow:hidden; padding:4px; }
  .th.on .mini{ border-color:var(--emerald); box-shadow:0 0 0 2px var(--emerald-l2); }
  .th.on .no{ color:var(--emerald-d); }
  .th .mini .mt{ font-size:8.5px; font-weight:700; color:var(--slate-2); line-height:1.25; text-align:center;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .th .mini.cover{ background:linear-gradient(140deg,#059669,#065f46); border-color:#047857; }
  .th .mini.cover .mt{ color:#fff; font-size:11px; }
  .th .mini.vocab{ background:#FFFBEB; border-color:#FDE68A; }
  .th .mini.trans{ background:#EFF6FF; border-color:#BFDBFE; }

  /* ---------- stage ---------- */
  .stage{ display:flex; flex-direction:column; min-width:0; background:#eef1f6; }
  .stage-top{ display:flex; align-items:center; gap:9px; padding:11px 18px; border-bottom:1px solid var(--line);
    background:rgba(244,247,251,.9); backdrop-filter:blur(8px); }
  .stage-top .pname{ font-size:13.5px; font-weight:800; color:var(--ink); }
  .stage-top .ptype{ margin-left:2px; }
  .stage-top .tools{ margin-left:auto; display:flex; gap:7px; position:relative; }
  .tbtn{ width:36px; height:36px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer;
    display:grid; place-items:center; color:var(--slate-2); transition:.14s; }
  .tbtn:hover{ border-color:#cbd5e1; color:var(--ink); }
  .tbtn.on{ background:var(--emerald-l); border-color:var(--emerald-ring); color:var(--emerald-d); }
  .tbtn .material-icons-round{ font-size:19px; }

  .settings{ position:absolute; top:44px; right:0; width:224px; background:#fff; border:1px solid var(--line);
    border-radius:13px; box-shadow:var(--sh-lg); z-index:40; display:none; overflow:hidden; }
  .settings.on{ display:block; }
  .settings .sh{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-bottom:1px solid var(--line-2); }
  .settings .sh b{ font-size:12.5px; font-weight:800; color:var(--slate); }
  .settings .sh button{ border:none; background:none; cursor:pointer; color:var(--faint); display:grid; place-items:center; }
  .srow{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; }
  .srow + .srow{ border-top:1px solid var(--line-2); }
  .srow span{ font-size:12.5px; font-weight:700; color:var(--slate-2); }
  .sw{ appearance:none; -webkit-appearance:none; width:34px; height:19px; border-radius:999px; background:#cbd5e1;
    position:relative; cursor:pointer; transition:.16s; border:none; flex:none; }
  .sw::after{ content:""; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:#fff; transition:.16s; }
  .sw:checked{ background:var(--emerald); }
  .sw:checked::after{ transform:translateX(15px); }

  .canvas-wrap{ flex:1; display:grid; place-items:center; padding:26px 30px; min-height:0; }
  .slide{ width:min(100%,880px); aspect-ratio:16/9; background:#fff; border-radius:16px; box-shadow:var(--sh-lg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:38px 46px; overflow:hidden;
    position:relative; }

  /* per-word pinyin — the annotation sits above the characters */
  .sent{ display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; gap:2px 4px; }
  .sent + .sent{ margin-top:26px; }
  .wd{ display:flex; flex-direction:column; align-items:center; }
  .wd .py{ font-size:13px; font-weight:600; color:var(--emerald-d); line-height:1.5; height:20px; }
  .wd .hz{ font-size:38px; font-weight:600; color:var(--ink); line-height:1.35; letter-spacing:1px; }
  .slide.small .wd .hz{ font-size:27px; }
  .slide.small .wd .py{ font-size:11px; height:17px; }
  .tr{ margin-top:14px; font-size:16px; font-weight:600; color:var(--muted); text-align:center; }
  .sent-tr{ margin-top:7px; font-size:14.5px; font-weight:600; color:var(--muted); text-align:center; }

  .slide.cover{ background:linear-gradient(140deg,#059669,#065f46); color:#fff; }
  .slide.cover .ct{ font-size:64px; font-weight:700; letter-spacing:4px; }
  .slide.cover .cp{ font-size:19px; font-weight:600; opacity:.85; margin-top:8px; letter-spacing:3px; }
  .slide.cover .cs{ margin-top:22px; font-size:14px; font-weight:700; opacity:.72; letter-spacing:.5px; }

  .slide .stag{ position:absolute; top:16px; left:20px; font-size:10.5px; font-weight:800; letter-spacing:.7px;
    text-transform:uppercase; color:var(--faint); }
  .slide.cover .stag{ color:rgba(255,255,255,.6); }

  /* vocab slide */
  .voc{ display:flex; align-items:center; gap:38px; width:100%; justify-content:center; }
  .voc .vimg{ width:210px; height:210px; border-radius:18px; background:#F1F5F9; border:1px solid var(--line);
    display:grid; place-items:center; color:#b6c2d1; flex:none; }
  .voc .vimg .material-icons-round{ font-size:52px; }
  .voc .vt{ min-width:0; }
  .voc .vt .py{ font-size:17px; font-weight:600; color:var(--emerald-d); }
  .voc .vt .hz{ font-size:60px; font-weight:600; color:var(--ink); letter-spacing:3px; line-height:1.25; }
  .voc .vt .pos{ display:inline-block; margin-top:6px; font-size:12px; font-weight:800; color:var(--muted);
    background:#f1f5f9; padding:2px 10px; border-radius:999px; letter-spacing:.3px; }
  .voc .vt .en{ margin-top:9px; font-size:19px; font-weight:600; color:var(--slate); }
  .exwrap{ text-align:center; }
  .exwrap .eyebrow{ font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase;
    color:var(--faint); margin-bottom:18px; display:block; }

  /* fullText slide */
  .ftext{ font-size:23px; font-weight:600; color:var(--ink); line-height:2.1; text-align:center; letter-spacing:1px; }
  .ttext{ font-size:17px; font-weight:600; color:var(--slate); line-height:1.95; text-align:center; max-width:640px; }

  /* navigator */
  .nav-bar{ display:flex; align-items:center; justify-content:center; gap:14px; padding:12px 18px 18px; }
  .nbtn{ width:38px; height:38px; border:1px solid var(--line); border-radius:11px; background:#fff; cursor:pointer;
    display:grid; place-items:center; color:var(--slate-2); transition:.14s; }
  .nbtn:hover:not(:disabled){ border-color:#cbd5e1; color:var(--ink); box-shadow:var(--sh-sm); }
  .nbtn:disabled{ opacity:.4; cursor:not-allowed; }
  .counter{ font-size:13px; font-weight:800; color:var(--slate); min-width:74px; text-align:center; font-variant-numeric:tabular-nums; }
  .counter small{ color:var(--faint); font-weight:700; }
  .hintkeys{ font-size:11.5px; font-weight:700; color:var(--faint); }
  .hintkeys kbd{ background:#fff; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px;
    padding:1px 5px; font-family:inherit; font-size:10.5px; font-weight:800; color:var(--slate-2); }

  /* segment editor */
  .segpanel{ border-top:1px solid var(--line); background:#fff; padding:14px 18px 18px; display:none; }
  .segpanel.on{ display:block; }
  .segpanel .sh{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .segpanel .sh b{ font-size:13px; font-weight:800; color:var(--ink); }
  .segpanel .sh span{ font-size:12px; font-weight:600; color:var(--muted); }
  .segline{ display:flex; flex-wrap:wrap; align-items:center; gap:3px; padding:9px 11px; border:1px solid var(--line);
    border-radius:10px; background:#fbfdff; }
  .segline + .segline{ margin-top:7px; }
  .segline .sw2{ font-size:19px; font-weight:600; color:var(--ink); padding:1px 2px; border-radius:4px; }
  .cut{ width:16px; height:26px; border:none; background:none; cursor:pointer; border-radius:4px; color:#cbd5e1;
    display:grid; place-items:center; font-size:14px; line-height:1; transition:.12s; }
  .cut:hover{ color:var(--emerald); background:var(--emerald-l); }
  .cut.on{ color:var(--emerald-d); background:var(--emerald-l2); }

  /* fullscreen */
  body.fs .rail-hide, body.fs .side, body.fs .thumbs, body.fs .stage-top, body.fs .segpanel{ display:none !important; }
  body.fs .app{ grid-template-columns:1fr; }
  body.fs .deck{ grid-template-columns:1fr; height:100vh; }
  body.fs .stage{ background:#0f172a; }
  body.fs .canvas-wrap{ padding:20px; }
  body.fs .slide{ width:min(100%,1180px); }
  body.fs .nav-bar{ padding-bottom:22px; }
  body.fs .counter{ color:#e2e8f0; }
  body.fs .nbtn{ background:#1e293b; border-color:#334155; color:#cbd5e1; }
  body.fs .hintkeys{ color:#64748b; }
  body.fs .hintkeys kbd{ background:#1e293b; border-color:#334155; color:#cbd5e1; }
  .fs-exit{ display:none; position:fixed; top:16px; right:18px; z-index:60; }
  body.fs .fs-exit{ display:inline-flex; }

  @media (max-width:900px){
    .deck{ grid-template-columns:1fr; height:auto; }
    .thumbs{ display:none; }
    .canvas-wrap{ padding:16px 14px; }
    .slide{ padding:22px 20px; border-radius:12px; }
    .wd .hz{ font-size:24px; } .wd .py{ font-size:10.5px; height:16px; }
    .slide.cover .ct{ font-size:38px; }
    .voc{ flex-direction:column; gap:16px; }
    .voc .vimg{ width:120px; height:120px; }
    .voc .vt .hz{ font-size:38px; }
    .ftext{ font-size:16px; line-height:1.9; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition-duration:.001ms !important; } }
</style>
</head>
<body>

<div class="app">
  <aside class="side rail-hide" id="side" data-current="projects"></aside>

  <div class="main">
    <div class="pagebar rail-hide">
      <button class="navtoggle" data-navtoggle aria-label="Open menu" aria-expanded="false"><span class="material-icons-round">menu</span></button>
      <a class="tbtn" href="teacher-projects.html" aria-label="Back to Projects"><span class="material-icons-round">arrow_back</span></a>
      <div class="hdr-ic"><span class="material-icons-round">slideshow</span></div>
      <div class="dt"><b>Slides</b><span>食物 — What we eat</span></div>
      <div class="pb-acts">
        <a class="btn-ghost" href="teacher-handout.html"><span class="material-icons-round" style="font-size:17px">description</span> Handout</a>
        <div class="ava">LW</div>
      </div>
    </div>

    <div class="deck">
      <aside class="thumbs" id="thumbs"></aside>

      <div class="stage">
        <div class="stage-top">
          <span class="pname">食物 — What we eat</span>
          <span class="pill line ptype" id="slideKind">Cover</span>
          <span class="tools">
            <button class="tbtn" id="segBtn" title="Edit Segments"><span class="material-icons-round">content_cut</span></button>
            <button class="tbtn" id="setBtn" title="Settings"><span class="material-icons-round">settings</span></button>
            <button class="tbtn" id="fsBtn" title="Fullscreen (F)"><span class="material-icons-round">fullscreen</span></button>

            <div class="settings" id="settings">
              <div class="sh"><b>Settings</b><button id="setClose" aria-label="Close"><span class="material-icons-round" style="font-size:17px">close</span></button></div>
              <label class="srow"><span>Pinyin</span><input class="sw" type="checkbox" id="optPinyin" checked /></label>
              <label class="srow" id="rowVocabPy"><span>Vocab Pinyin</span><input class="sw" type="checkbox" id="optVocabPy" /></label>
              <label class="srow"><span>Translation</span><input class="sw" type="checkbox" id="optTrans" checked /></label>
            </div>
          </span>
        </div>

        <div class="canvas-wrap"><div class="slide" id="slide"></div></div>

        <div class="nav-bar">
          <button class="nbtn" id="prev" aria-label="Previous slide"><span class="material-icons-round">chevron_left</span></button>
          <span class="counter" id="counter"></span>
          <button class="nbtn" id="next" aria-label="Next slide"><span class="material-icons-round">chevron_right</span></button>
          <span class="hintkeys"><kbd>←</kbd><kbd>→</kbd> move · <kbd>F</kbd> fullscreen</span>
        </div>

        <div class="segpanel" id="segpanel">
          <div class="sh"><span class="material-icons-round" style="font-size:19px;color:var(--emerald)">content_cut</span>
            <b>Segment editor</b><span>Click between two words to split or join the line. Content slides follow these cuts.</span></div>
          <div id="segbody"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<button class="btnp fs-exit" id="fsExit"><span class="material-icons-round">fullscreen_exit</span> Exit</button>
<div class="toast" id="toast"></div>

<script src="assets/teacher-nav.js"></script>
<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s);};
  var tt; function say(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2200);}
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  /* ---------------- source project ---------------- */
  var TOPIC={ han:'食物', py:'shíwù', en:'What we eat', level:'HSK 1' };

  /* each sentence = [word, pinyin] pairs + a translation */
  var SENTENCES=[
    { w:[['我','wǒ'],['喜欢','xǐhuan'],['吃','chī'],['米饭','mǐfàn'],['。','']], t:'I like eating rice.' },
    { w:[['你','nǐ'],['饿','è'],['了','le'],['吗','ma'],['？','']], t:'Are you hungry?' },
    { w:[['这个','zhège'],['苹果','píngguǒ'],['很','hěn'],['好吃','hǎochī'],['。','']], t:'This apple is delicious.' },
    { w:[['我','wǒ'],['想','xiǎng'],['喝','hē'],['牛奶','niúnǎi'],['。','']], t:'I want to drink milk.' },
    { w:[['早饭','zǎofàn'],['你','nǐ'],['吃','chī'],['什么','shénme'],['？','']], t:'What do you eat for breakfast?' },
    { w:[['我','wǒ'],['不','bù'],['喜欢','xǐhuan'],['吃','chī'],['面条','miàntiáo'],['。','']], t:'I don’t like eating noodles.' }
  ];

  var VOCAB=[
    { w:'米饭', p:'mǐfàn',   pos:'noun', en:'cooked rice',
      ex:[{w:[['我','wǒ'],['要','yào'],['一碗','yì wǎn'],['米饭','mǐfàn'],['。','']],t:'I would like a bowl of rice.'}] },
    { w:'面条', p:'miàntiáo', pos:'noun', en:'noodles',
      ex:[{w:[['他','tā'],['爱','ài'],['吃','chī'],['面条','miàntiáo'],['。','']],t:'He loves eating noodles.'}] },
    { w:'鸡蛋', p:'jīdàn',    pos:'noun', en:'egg',
      ex:[{w:[['早饭','zǎofàn'],['有','yǒu'],['鸡蛋','jīdàn'],['。','']],t:'There are eggs for breakfast.'}] },
    { w:'牛奶', p:'niúnǎi',   pos:'noun', en:'milk',
      ex:[{w:[['我','wǒ'],['每天','měitiān'],['喝','hē'],['牛奶','niúnǎi'],['。','']],t:'I drink milk every day.'}] },
    { w:'苹果', p:'píngguǒ',  pos:'noun', en:'apple',
      ex:[{w:[['这个','zhège'],['苹果','píngguǒ'],['很','hěn'],['甜','tián'],['。','']],t:'This apple is very sweet.'}] },
    { w:'好吃', p:'hǎochī',   pos:'adjective', en:'tasty, delicious',
      ex:[{w:[['妈妈','māma'],['做','zuò'],['的','de'],['菜','cài'],['很','hěn'],['好吃','hǎochī'],['。','']],t:'Mum’s cooking is delicious.'}] },
    { w:'饿',   p:'è',        pos:'adjective', en:'hungry',
      ex:[{w:[['我','wǒ'],['有点儿','yǒudiǎnr'],['饿','è'],['。','']],t:'I am a little hungry.'}] },
    { w:'喝',   p:'hē',       pos:'verb', en:'to drink',
      ex:[{w:[['你','nǐ'],['想','xiǎng'],['喝','hē'],['什么','shénme'],['？','']],t:'What would you like to drink?'}] }
  ];

  /* ---------------- deck builder — same five slide types as the app ------- */
  var state={ i:0, pinyin:true, vocabPy:false, trans:true, segs:[[0,1],[2,3],[4,5]] };

  function buildDeck(){
    var d=[];
    d.push({ kind:'Cover', type:'cover' });
    state.segs.forEach(function(g,gi){
      d.push({ kind:'Content', type:'content', sents:g.map(function(si){return SENTENCES[si];}), n:gi+1 });
    });
    d.push({ kind:'Full text', type:'fullText' });
    d.push({ kind:'Translation', type:'translation' });
    VOCAB.forEach(function(v,vi){
      d.push({ kind:'Vocabulary', type:'vocab', v:v, variant:'image', vi:vi });
      (v.ex||[]).forEach(function(ex,ei){
        d.push({ kind:'Vocabulary', type:'vocab', v:v, variant:'example', ex:ex, vi:vi, ei:ei });
      });
    });
    return d;
  }
  var DECK=buildDeck();

  /* ---------------- rendering ---------------- */
  function words(list,opts){
    opts=opts||{};
    var showPy = opts.forceNoPy ? false : state.pinyin;
    return list.map(function(p){
      return '<span class="wd">'+
        (showPy?'<span class="py">'+esc(p[1])+'</span>':'')+
        '<span class="hz">'+esc(p[0])+'</span></span>';
    }).join('');
  }

  function slideHtml(s){
    if(s.type==='cover'){
      return '<span class="stag">Cover</span>'+
        '<div style="text-align:center"><div class="ct">'+esc(TOPIC.han)+'</div>'+
        (state.pinyin?'<div class="cp">'+esc(TOPIC.py)+'</div>':'')+
        '<div class="cs">'+esc(TOPIC.en)+' · '+esc(TOPIC.level)+'</div></div>';
    }
    if(s.type==='content'){
      var many=s.sents.length>1;
      return '<span class="stag">Reading '+s.n+'</span>'+
        s.sents.map(function(x){
          return '<div class="sent">'+words(x.w)+'</div>'+
            (state.trans?'<div class="sent-tr">'+esc(x.t)+'</div>':'');
        }).join('');
    }
    if(s.type==='fullText'){
      return '<span class="stag">Full text</span>'+
        '<div class="ftext">'+SENTENCES.map(function(x){
          return x.w.map(function(p){return esc(p[0]);}).join('');
        }).join('')+'</div>';
    }
    if(s.type==='translation'){
      return '<span class="stag">Translation</span>'+
        '<div class="ttext">'+SENTENCES.map(function(x){return esc(x.t);}).join(' ')+'</div>';
    }
    // vocab
    var v=s.v;
    // "Vocab Pinyin" shows pinyin on vocabulary even when the global pinyin is off
    var vpy = state.pinyin || state.vocabPy;
    if(s.variant==='image'){
      return '<span class="stag">Vocabulary '+(s.vi+1)+' / '+VOCAB.length+'</span>'+
        '<div class="voc"><span class="vimg"><span class="material-icons-round">image</span></span>'+
        '<span class="vt">'+(vpy?'<span class="py">'+esc(v.p)+'</span>':'')+
        '<div class="hz">'+esc(v.w)+'</div><span class="pos">'+esc(v.pos)+'</span>'+
        (state.trans?'<div class="en">'+esc(v.en)+'</div>':'')+'</span></div>';
    }
    return '<span class="stag">Vocabulary '+(s.vi+1)+' · example</span>'+
      '<div class="exwrap"><span class="eyebrow">'+esc(v.w)+' · '+esc(v.p)+'</span>'+
      '<div class="sent">'+words(s.ex.w,{forceNoPy:!vpy && !state.pinyin})+'</div>'+
      (state.trans?'<div class="sent-tr">'+esc(s.ex.t)+'</div>':'')+'</div>';
  }

  function thumbHtml(s,i){
    var cls = s.type==='cover'?'cover':(s.type==='vocab'?'vocab':(s.type==='translation'?'trans':''));
    var label;
    if(s.type==='cover') label=TOPIC.han;
    else if(s.type==='content') label=s.sents.map(function(x){return x.w.map(function(p){return p[0];}).join('');}).join(' ');
    else if(s.type==='fullText') label='Full text';
    else if(s.type==='translation') label='Translation';
    else label=s.v.w+(s.variant==='example'?' · ex':'');
    return '<button class="th'+(i===state.i?' on':'')+'" data-i="'+i+'">'+
      '<span class="no">'+(i+1)+'</span>'+
      '<span class="mini '+cls+'"><span class="mt">'+esc(label)+'</span></span></button>';
  }

  function render(){
    var s=DECK[state.i];
    var el=$('#slide');
    el.className='slide '+(s.type==='cover'?'cover':'')+(s.type==='content'&&s.sents.length>1?' small':'');
    el.innerHTML=slideHtml(s);
    $('#slideKind').textContent=s.kind;
    $('#counter').innerHTML=(state.i+1)+' <small>/ '+DECK.length+'</small>';
    $('#prev').disabled=state.i===0;
    $('#next').disabled=state.i===DECK.length-1;
    $('#thumbs').innerHTML='<div class="grp">'+DECK.length+' slides</div>'+DECK.map(thumbHtml).join('');
    var on=$('#thumbs .th.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest'});
    $('#rowVocabPy').style.display = state.pinyin ? '' : 'none';
  }

  function goTo(i){ state.i=Math.max(0,Math.min(DECK.length-1,i)); render(); }
  function rebuild(){ var keep=state.i; DECK=buildDeck(); state.i=Math.min(keep,DECK.length-1); render(); renderSegs(); }

  /* ---------------- segment editor ---------------- */
  function renderSegs(){
    $('#segbody').innerHTML=state.segs.map(function(g,gi){
      return '<div class="segline">'+g.map(function(si,k){
        return (k?'<button class="cut on" data-join="'+gi+'" data-k="'+k+'" title="Join into the previous line">|</button>':'')+
          '<span class="sw2">'+esc(SENTENCES[si].w.map(function(p){return p[0];}).join(''))+'</span>';
      }).join('')+
      (gi<state.segs.length-1?'<button class="cut" data-merge="'+gi+'" title="Merge with the next line">↓</button>':'')+
      '</div>';
    }).join('');
  }
  $('#segbody').addEventListener('click',function(e){
    var j=e.target.closest('[data-join]'), m=e.target.closest('[data-merge]');
    if(j){
      var gi=+j.dataset.join, k=+j.dataset.k, g=state.segs[gi];
      state.segs.splice(gi,1,g.slice(0,k),g.slice(k));
      rebuild(); say('Split into two slides');
      return;
    }
    if(m){
      var i=+m.dataset.merge;
      state.segs.splice(i,2,state.segs[i].concat(state.segs[i+1]));
      rebuild(); say('Merged into one slide');
    }
  });

  /* ---------------- controls ---------------- */
  $('#thumbs').addEventListener('click',function(e){ var b=e.target.closest('[data-i]'); if(b) goTo(+b.dataset.i); });
  $('#prev').addEventListener('click',function(){ goTo(state.i-1); });
  $('#next').addEventListener('click',function(){ goTo(state.i+1); });

  $('#setBtn').addEventListener('click',function(e){ e.stopPropagation(); $('#settings').classList.toggle('on'); });
  $('#setClose').addEventListener('click',function(){ $('#settings').classList.remove('on'); });
  document.addEventListener('click',function(e){ if(!e.target.closest('#settings')&&!e.target.closest('#setBtn')) $('#settings').classList.remove('on'); });

  $('#optPinyin').addEventListener('change',function(){ state.pinyin=this.checked; render(); });
  $('#optVocabPy').addEventListener('change',function(){ state.vocabPy=this.checked; render(); });
  $('#optTrans').addEventListener('change',function(){ state.trans=this.checked; render(); });

  $('#segBtn').addEventListener('click',function(){
    var on=$('#segpanel').classList.toggle('on');
    this.classList.toggle('on',on);
    this.title = on ? 'Close Segment Editor' : 'Edit Segments';
    if(on) renderSegs();
  });

  function setFs(on){
    document.body.classList.toggle('fs',on);
    $('#fsBtn').title = on ? 'Exit Fullscreen (F)' : 'Fullscreen (F)';
    $('#fsBtn').querySelector('.material-icons-round').textContent = on ? 'fullscreen_exit' : 'fullscreen';
  }
  $('#fsBtn').addEventListener('click',function(){ setFs(!document.body.classList.contains('fs')); });
  $('#fsExit').addEventListener('click',function(){ setFs(false); });

  document.addEventListener('keydown',function(e){
    var tag=e.target&&e.target.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
    if(e.key==='ArrowRight'){ goTo(state.i+1); }
    else if(e.key==='ArrowLeft'){ goTo(state.i-1); }
    else if(e.key==='f'||e.key==='F'){ setFs(!document.body.classList.contains('fs')); }
    else if(e.key==='Escape'){ if(document.body.classList.contains('fs')) setFs(false); else $('#settings').classList.remove('on'); }
  });

  render(); renderSegs();
})();
</script>
</body>
</html>
