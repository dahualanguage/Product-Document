<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redesign v9 — Teacher · Planning (DAHUA AI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
<link rel="stylesheet" href="assets/teacher-shell.css" />
<style>
  .body{ display:flex; align-items:stretch; }

  /* ---------- history ---------- */
  .hist{ width:262px; flex:none; background:#fff; border-right:1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:76px; height:calc(100vh - 76px); }
  .hist.off{ display:none; }
  .hist-h{ padding:14px 13px 8px; }
  .hist-new{ width:100%; display:flex; align-items:center; justify-content:center; gap:6px; min-height:38px;
    border:1px dashed var(--line); border-radius:10px; background:#fff; cursor:pointer; font:inherit;
    font-size:13px; font-weight:700; color:var(--emerald-dd); transition:.14s; }
  .hist-new .material-icons-round{ font-size:17px; }
  .hist-new:hover{ border-style:solid; border-color:var(--emerald-ring); background:var(--emerald-l); }
  .hist-l{ flex:1; overflow-y:auto; padding:2px 9px 18px; }
  .hist-g{ font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    color:var(--faint); padding:13px 7px 5px; }
  .hist-i{ display:block; width:100%; text-align:left; border:none; background:none; cursor:pointer;
    font:inherit; padding:8px 9px; border-radius:9px; transition:.14s; }
  .hist-i b{ display:block; font-size:13px; font-weight:700; color:var(--ink); line-height:1.4;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-i span{ display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-top:1px; }
  .hist-i:hover{ background:#f4f7fb; }
  .hist-i.on{ background:var(--emerald-l); }
  .hist-i.on b{ color:var(--emerald-dd); }
  .hist-i.on span{ color:var(--emerald-d); }
  .histtoggle{ display:inline-grid; }

  /* ---------- live preview ---------- */
  .prev{ width:312px; flex:none; background:#fff; border-left:1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:76px; height:calc(100vh - 76px); }
  .prev.off{ display:none; }
  .prev-h{ display:flex; align-items:center; gap:8px; padding:15px 16px 13px; border-bottom:1px solid var(--line-2); }
  .prev-h .material-icons-round{ font-size:18px; color:var(--emerald); }
  .prev-h b{ font-size:13px; font-weight:800; color:var(--ink); }
  .prev-x{ margin-left:auto; border:none; background:none; cursor:pointer; color:var(--faint);
    display:grid; place-items:center; padding:3px; border-radius:7px; transition:.14s; }
  .prev-x .material-icons-round{ font-size:17px; color:inherit; }
  .prev-x:hover{ color:var(--ink); background:#f1f5f9; }
  .prev-lbl{ font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    color:var(--faint); margin-bottom:10px; }
  .prev-empty{ font-size:12.5px; font-weight:600; color:var(--faint); line-height:1.6; padding:6px 2px; }
  .navtoggle[aria-expanded="true"]{ color:var(--emerald-dd); background:var(--emerald-l); }
  .prev-b{ flex:1; overflow-y:auto; padding:14px 16px 20px; }
  .prev-b .stu{ padding:0; border:none; background:none; }
  .prev-b .stu-s{ padding:9px 11px; gap:9px; }
  .prev-b .stu-s .pl{ font-size:13px; margin-top:7px; }
  .prev-b .wd .hz{ font-size:15px; }
  .prev-b .rtr{ font-size:11px; }

  .prev-set{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line-2); }
  .prev-r{ padding:8px 9px; border-radius:8px; }
  .prev-r + .prev-r{ margin-top:2px; }
  .prev-r .k{ display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  .prev-r .v{ font-size:12px; font-weight:700; color:var(--ink); }
  .seg{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .seg button{ font:inherit; font-size:11px; font-weight:700; color:var(--slate-2); cursor:pointer;
    border:1px solid var(--line); background:#fff; border-radius:6px; padding:4px 9px; transition:.14s; }
  .seg button:hover{ border-color:var(--emerald-ring); }
  .seg button.on{ border-color:var(--emerald); background:var(--emerald-l); color:var(--emerald-dd); }
  .segnum{ width:52px; font:inherit; font-size:12px; font-weight:800; color:var(--ink); text-align:center;
    border:1px solid var(--line); border-radius:6px; padding:4px 6px; background:#fff; -moz-appearance:textfield; }
  .segnum::-webkit-outer-spin-button,.segnum::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .segnum:focus{ outline:none; border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l); }
  .segu{ font-size:11px; font-weight:700; color:var(--muted); }
  .prev-r .v.pending{ color:var(--faint); font-weight:600; }
  .prev-r.now{ background:var(--emerald-l); }
  .prev-r.now .k{ color:var(--emerald-d); }
  .prev-r.now .v{ color:var(--emerald-dd); }

  .canvas{
    flex:1; min-width:0;
    min-height:calc(100vh - 76px); padding:34px 30px 70px;
    background:
      radial-gradient(circle at 1px 1px, #dde4ec 1px, transparent 0) 0 0 / 22px 22px,
      var(--bg);
    display:flex; flex-direction:column; align-items:center;
  }
  .canvas-in{ width:min(720px,100%); }
  .canvas.wide .canvas-in{ width:min(880px,100%); }

  /* ---------- prompt ---------- */
  .prompt{ background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:var(--sh-lg); overflow:hidden; }
  .prompt-h{ display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line-2); }
  .prompt-h h1{ font-size:16px; font-weight:800; color:var(--ink); letter-spacing:-.2px; }
  .ai-badge{ margin-left:auto; font-size:10.5px; font-weight:800; letter-spacing:.6px; color:var(--emerald-d);
    background:var(--emerald-l); border:1px solid var(--emerald-l2); border-radius:7px; padding:3px 8px; }
  .prompt-b{ padding:16px 20px 6px; }
  .prompt-field{ background:#f8fafc; border:1px solid transparent; border-radius:12px; padding:14px 16px; transition:.16s; }
  .prompt-field:focus-within{ background:#fff; border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l2); }
  .prompt-field textarea{ width:100%; min-height:92px; border:none; background:none; resize:none; font:inherit;
    font-size:16px; font-weight:600; color:var(--ink); line-height:1.55; outline:none; }
  .prompt-field textarea::placeholder{ color:#9fb0c2; font-weight:500; }
  .prompt-f{ display:flex; align-items:center; gap:12px; padding:12px 20px 14px; }
  .prompt-f .hint{ font-size:11.5px; font-weight:600; color:var(--faint); }
  .make{ margin-left:auto; }
  .make:disabled{ background:#e2e8f0; color:#94a3b8; box-shadow:none; cursor:not-allowed; transform:none; filter:none; }
  .kbd{ font-size:11px; font-weight:800; opacity:.75; }

  .orline{ display:flex; align-items:center; gap:14px; margin:26px 0 16px; color:var(--faint);
    font-size:11.5px; font-weight:800; letter-spacing:.4px; }
  .orline::before,.orline::after{ content:""; height:1px; background:var(--line); flex:1; }

  /* ---------- entry blocks ---------- */
  .block{ background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:14px; }
  .block-h{ display:flex; align-items:center; gap:9px; padding:13px 18px; border-bottom:1px solid var(--line-2); }
  .block-h b{ font-size:13.5px; font-weight:800; color:var(--ink); }
  .block-h span.note{ font-size:12px; font-weight:600; color:var(--muted); }
  .block-h .material-icons-round{ font-size:18px; color:var(--faint); }

  /* flagship */
  .flag{ display:flex; align-items:center; gap:14px; width:100%; padding:16px 18px; border:none; background:none;
    cursor:pointer; text-align:left; transition:.14s; }
  .flag:hover{ background:#f7fbf9; }
  .flag .fi{ width:44px; height:44px; border-radius:13px; flex:none; display:grid; place-items:center; color:#fff;
    background:linear-gradient(145deg,#10b981,#047857); box-shadow:0 8px 18px -9px rgba(5,150,105,.8); }
  .flag .fi .material-icons-round{ font-size:23px; }
  .flag .ft{ min-width:0; flex:1; }
  .flag .ft b{ display:block; font-size:15px; font-weight:800; color:var(--ink); }
  .flag .ft span{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-top:2px; }
  .flag .chev{ color:var(--faint); flex:none; }
  .chain{ display:flex; align-items:center; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .chain i{ font-style:normal; font-size:10.5px; font-weight:800; letter-spacing:.3px; color:var(--emerald-d);
    background:var(--emerald-l); border-radius:5px; padding:2px 7px; }
  .chain u{ text-decoration:none; color:var(--faint); font-size:11px; }

  /* sample grid */
  .sgrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:14px 18px 18px; }
  .sample{ display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid var(--line);
    border-radius:11px; background:#fff; cursor:pointer; font:inherit; text-align:left; transition:.14s; }
  .sample:hover:not(:disabled){ border-color:#cbd5e1; box-shadow:var(--sh-sm); transform:translateY(-1px); }
  .sample:disabled{ opacity:.42; cursor:not-allowed; }
  .sample .si{ width:30px; height:30px; border-radius:8px; flex:none; display:grid; place-items:center; }
  .sample .si .material-icons-round{ font-size:17px; }
  .sample .st{ min-width:0; }
  .sample .st b{ display:block; font-size:13px; font-weight:700; color:var(--ink); line-height:1.25; }
  .sample .st span{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; margin-top:1px; }

  .needs{ padding:0 18px 14px; font-size:11.5px; font-weight:700; color:var(--amber); display:none; }
  .needs.on{ display:block; }

  /* two-up rows */
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:14px 18px 18px; }
  .opt{ display:flex; align-items:flex-start; gap:11px; padding:13px 14px; border:1px solid var(--line);
    border-radius:12px; background:#fff; cursor:pointer; font:inherit; text-align:left; transition:.14s; }
  .opt:hover:not(:disabled){ border-color:#cbd5e1; box-shadow:var(--sh-sm); transform:translateY(-1px); }
  .opt:disabled{ opacity:.42; cursor:not-allowed; }
  .opt .oi{ width:32px; height:32px; border-radius:9px; flex:none; display:grid; place-items:center; }
  .opt .oi .material-icons-round{ font-size:18px; }
  .opt .ot b{ display:block; font-size:13.5px; font-weight:800; color:var(--ink); }
  .opt .ot span{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; margin-top:2px; line-height:1.45; }
  .block.solo .duo{ grid-template-columns:1fr; }

  /* recent */
  .recent{ margin-top:26px; }
  .recent .rh{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .recent .rh b{ font-size:13px; font-weight:800; color:var(--slate); }
  .recent .rh span{ font-size:12px; color:var(--faint); font-weight:600; }
  .rgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .rcard{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 13px; cursor:pointer;
    transition:.15s; text-align:left; }
  .rcard:hover{ box-shadow:var(--sh-md); transform:translateY(-1px); }
  .rcard b{ display:block; font-size:13px; font-weight:700; color:var(--ink); line-height:1.3; }
  .rcard .rm{ margin-top:7px; display:flex; align-items:center; gap:6px; }
  .rcard .rt{ font-size:11.5px; color:var(--faint); font-weight:600; }

  /* ---------- flow screens ---------- */
  .screen{ display:none; }
  .screen.on{ display:block; }
  .fbar{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .fbar .back{ border:1px solid var(--line); background:#fff; border-radius:10px; width:36px; height:36px;
    cursor:pointer; display:grid; place-items:center; color:var(--slate-2); flex:none; }
  .fbar .back:hover{ border-color:#cbd5e1; }
  .fbar .fq{ min-width:0; flex:1; }
  .fbar .fq b{ display:block; font-size:15px; font-weight:800; color:var(--ink); letter-spacing:-.2px; }
  .fbar .fq span{ font-size:12.5px; color:var(--muted); font-weight:600; }

  /* stage strip: which segment of the chain this path covers */
  .stages{ display:flex; align-items:center; gap:6px; padding:11px 16px; background:#fff; border:1px solid var(--line);
    border-radius:12px; margin-bottom:14px; flex-wrap:wrap; }
  .stages .lb{ font-size:10.5px; font-weight:800; letter-spacing:.5px; color:var(--faint); margin-right:3px; }
  .stg{ font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:999px; background:#eef2f7; color:var(--faint); }
  .stg.on{ background:var(--emerald-l); color:var(--emerald-d); }
  .stages .arrow{ color:#cbd5e1; font-size:14px; }

  /* teaching point checkpoint */
  .panel-w{ background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--sh-md); overflow:hidden; }
  .pw-h{ display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line-2); }
  .pw-h h3{ font-size:14.5px; font-weight:800; color:var(--ink); }
  .pw-h .badge{ font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:999px;
    background:var(--emerald-l); color:var(--emerald-d); }
  .pw-b{ padding:16px 18px; }
  .pw-f{ display:flex; align-items:center; gap:12px; padding:14px 18px; border-top:1px solid var(--line-2);
    background:#fcfdfe; flex-wrap:wrap; }
  .pw-f .sum{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .pw-f .acts{ margin-left:auto; display:flex; gap:9px; }

  .tps{ display:flex; flex-wrap:wrap; gap:7px; }
  .tp{ display:inline-flex; align-items:center; gap:6px; padding:5px 8px 5px 11px; border-radius:9px;
    border:1px solid var(--line); background:#fff; font-size:13.5px; font-weight:700; color:var(--ink); }
  .tp .ty{ font-size:10px; font-weight:800; padding:1px 6px; border-radius:5px; letter-spacing:.2px; }
  .tp .ty.gray{ background:#eef2f7; color:var(--muted); }
  .tp .ty.purple{ background:var(--mc-bg); color:var(--mc); }
  .tp .ty.blue{ background:var(--qa-bg); color:var(--qa); }
  .tp .x{ border:none; background:none; cursor:pointer; color:var(--faint); display:grid; place-items:center;
    width:18px; height:18px; border-radius:5px; padding:0; }
  .tp .x:hover{ background:var(--rose-bg); color:var(--rose); }
  .tp.miss{ border-style:dashed; border-color:#fbbf24; background:#fffbeb; }
  .tp-add{ display:flex; gap:8px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line-2); }
  .tp-add input{ flex:1; height:36px; border:1px solid var(--line); border-radius:9px; padding:0 12px; font:inherit;
    font-size:13.5px; font-weight:600; }
  .tp-add input:focus{ outline:none; border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l2); }
  .tp-add select{ height:36px; border:1px solid var(--line); border-radius:9px; padding:0 10px; font:inherit;
    font-size:12.5px; font-weight:700; color:var(--slate); background:#fff; }

  /* preview rows */
  .stage-t{ display:flex; align-items:center; gap:9px; padding:12px 18px; background:#fbfcfe;
    border-bottom:1px solid var(--line-2); }
  .stage-t .n{ width:20px; height:20px; border-radius:50%; background:var(--emerald); color:#fff; font-size:11px;
    font-weight:800; display:grid; place-items:center; flex:none; }
  .stage-t b{ font-size:12.5px; font-weight:800; color:var(--slate); letter-spacing:.2px; }
  .prow{ display:flex; align-items:flex-start; gap:13px; padding:15px 18px; flex-wrap:wrap; }
  .prow + .prow{ border-top:1px solid var(--line-2); }
  .prow.off{ opacity:.48; }
  .prow .pt2{ min-width:0; flex:1; }
  .prow .pt2 b{ display:block; font-size:14px; font-weight:800; color:var(--ink); }
  .prow .pt2 .pd{ font-size:12.5px; color:var(--muted); font-weight:600; margin-top:3px; }
  .prow .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .prow .ped{ flex:none; }
  .sw{ appearance:none; -webkit-appearance:none; width:36px; height:20px; border-radius:999px; background:#cbd5e1;
    position:relative; cursor:pointer; transition:.16s; flex:none; border:none; }
  .sw::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:#fff; transition:.16s; }
  .sw:checked{ background:var(--emerald); }
  .sw:checked::after{ transform:translateX(16px); }

  /* expandable row body —— the actual content that will be created */
  .prow{ position:relative; }
  .prow-x{ border:1px solid var(--line); background:#fff; border-radius:8px; width:28px; height:28px; cursor:pointer;
    display:grid; place-items:center; color:var(--faint); flex:none; transition:.14s; margin-left:8px; }
  .prow-x:hover{ border-color:#cbd5e1; color:var(--slate-2); }
  .prow-x .material-icons-round{ font-size:18px; transition:transform .18s; }
  .prow.open .prow-x .material-icons-round{ transform:rotate(180deg); }
  .prow-body{ display:none; width:100%; padding:13px 0 0 53px; }
  .prow.open .prow-body{ display:block; }
  .prow.off .prow-body{ display:none; }
  .cbox{ border:1px solid var(--line); border-radius:12px; background:#fbfdff; padding:14px 16px; margin-top:14px; }
  .cbox + .cbox{ margin-top:10px; }
  .cbox .clbl{ font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--faint);
    display:block; margin-bottom:9px; }

  /* per-word pinyin, same device as the slides page */
  .rline{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:1px 3px; }
  .rline + .rtr{ margin-top:2px; }
  .rtr{ font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:10px; }
  .rtr:last-child{ margin-bottom:0; }
  .wd{ display:flex; flex-direction:column; align-items:center; }
  .wd .py{ font-size:9.5px; font-weight:600; color:var(--emerald-d); line-height:1.4; height:14px; }
  .wd .hz{ font-size:17px; font-weight:600; color:var(--ink); line-height:1.45; letter-spacing:.5px; }

  .wcards{ display:flex; gap:8px; flex-wrap:wrap; }
  .wcard{ border:1px solid var(--line); border-radius:9px; background:#fff; padding:8px 11px; text-align:center; min-width:78px; }
  .wcard .py{ font-size:10px; font-weight:600; color:var(--emerald-d); }
  .wcard .hz{ font-size:19px; font-weight:600; color:var(--ink); line-height:1.3; }
  .wcard .en{ font-size:10.5px; font-weight:600; color:var(--muted); margin-top:2px; }

  .qitem{ font-size:13px; font-weight:600; color:var(--slate); }
  .qitem + .qitem{ margin-top:11px; padding-top:11px; border-top:1px solid var(--line-2); }
  .qitem .qq{ font-weight:700; color:var(--ink); }
  .qitem .qo{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .qitem .qo span{ font-size:11.5px; font-weight:700; color:var(--muted); background:#fff; border:1px solid var(--line);
    padding:2px 9px; border-radius:6px; }
  .qitem .qo span.right{ color:var(--emerald-d); border-color:var(--emerald-l2); background:var(--emerald-l); }

  .scram{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .scram b{ font-size:16px; font-weight:600; color:var(--ink); background:#fff; border:1px solid var(--line);
    border-radius:7px; padding:4px 10px; letter-spacing:.5px; }
  .scram .arrow{ color:var(--faint); font-size:13px; font-weight:700; }
  .scram .ans{ font-size:12px; font-weight:700; color:var(--emerald-d); }

  /* ---------- turns that carry a whole step ---------- */
  /* every step closes the same way —— hairline, then actions; primary on the right */
  .turn-acts,.qconfirm{ display:flex; align-items:center; justify-content:flex-end; gap:9px; flex-wrap:wrap;
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line-2); }
  .turn-acts .n,.qconfirm .n{ font-size:14px; font-weight:600; color:var(--ink);
    line-height:1.6; margin-right:auto; }
  .btnp.sm-act{ padding:9px 15px; font-size:13px; line-height:1.35; border-radius:10px;
    border:1px solid transparent; }
  .turn-acts .assign{ font-size:12.5px; font-weight:700; color:var(--slate-2); display:flex; align-items:center; gap:7px; }
  .done-box{ background:#fbfcfe; }
  .done-box b{ display:block; font-size:12.5px; color:var(--slate); margin-bottom:5px; }
  .pv-box{ padding:0; overflow:hidden; }
  .pv-box .covers{ border-radius:0; }
  .pv-box .prow{ padding:14px 15px; }
  .pv-box .prow-body{ padding-left:50px; }
  .done-turn .material-icons-round{ font-size:21px; color:var(--emerald); vertical-align:-4px; margin-right:7px; }
  .done-turn b{ font-size:15px; font-weight:800; color:var(--ink); }
  .done-turn > span:not(.turn-acts){ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-top:6px; }
  .done-turn .turn-acts .qopt{ text-decoration:none; }
  .msg .bub{ flex:1; min-width:0; }
  .msg.sys .bub{ max-width:100%; }

  /* ---------- chat ---------- */
  .chat{ min-height:300px; padding-bottom:4px; }
  .composer{ display:flex; align-items:flex-end; gap:10px; margin-top:14px; padding:10px 12px;
    background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--sh-sm); }
  .composer:focus-within{ border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l2); }
  .composer textarea{ flex:1; border:none; background:none; resize:none; font:inherit; font-size:14.5px;
    font-weight:600; color:var(--ink); line-height:1.5; outline:none; max-height:120px; padding:7px 4px; }
  .composer textarea::placeholder{ color:#9fb0c2; font-weight:500; }
  .composer .send{ width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; flex:none;
    display:grid; place-items:center; color:#fff; background:linear-gradient(145deg,#10b981,#059669); transition:.14s; }
  .composer .send:hover:not(:disabled){ filter:brightness(1.06); }
  .composer .send:disabled{ background:#e2e8f0; color:#94a3b8; cursor:not-allowed; }
  .composer .send .material-icons-round{ font-size:19px; }

  .qhint{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-top:5px; }
  .qopt.multi{ padding-left:11px; }
  /* the endpoint cards carry a miniature of the screen the student meets */
  /* 列距刻意大於欄距：每一行就是一種素材（課文／生詞／句型／理解） */
  .qopts.eps{ justify-content:flex-start; gap:16px 10px; }
  .qopt.multi.ep{ width:168px; padding:12px 13px 12px; display:flex; flex-direction:column; }
  /* 勾選框與標題同一列：標題換行時不會吊到勾選框底下 */
  .qopt.multi.ep .lbl{ display:flex; align-items:flex-start; gap:6px; }
  .qopt.multi.ep .lbl .material-icons-round{ margin:0; flex:none; line-height:1.35; }
  .qopt.multi.ep .t{ display:block; text-align:left; }
  .qopt.multi.ep .thumb{ display:block; margin-bottom:10px; }
  .qopt.multi.ep .thumb svg{ display:block; width:100%; height:auto; }
  .qopt.multi.ep.on .thumb{ filter:saturate(1.05); }
  /* the two material outputs get their own row —— the practices all start below */
  .qopts .qbreak{ flex-basis:100%; height:0; margin:0; }
  .qopt.multi.on{ border-color:var(--emerald); background:var(--emerald-l); color:var(--emerald-dd); }
  .qopt.multi .material-icons-round{ font-size:16px; margin-right:5px; vertical-align:-3px; color:var(--faint); }
  .qopt.multi.on .material-icons-round{ color:var(--emerald); }
  .qopt.go{ border-color:var(--emerald); color:var(--emerald-dd); background:var(--emerald-l); }
  .qopt.go:hover{ background:var(--emerald-l2); }
  .ready-turn{ border:1px solid var(--emerald-l2); background:#f7fdfa; border-radius:12px; padding:13px 15px; }
  .ready-turn .stages{ margin:0 0 11px; background:none; border:none; padding:0; }

  /* ---------- endpoint picker + funnel ---------- */
  .sample.on{ border-color:var(--emerald); box-shadow:inset 0 0 0 1px var(--emerald); background:#f7fdfa; }
  .sample .tick{ margin-left:auto; color:var(--emerald); flex:none; opacity:0; }
  .sample.on .tick{ opacity:1; }
  .sample .tick .material-icons-round{ font-size:18px; }
  .ep-foot{ display:flex; align-items:center; gap:12px; padding:13px 18px; border-top:1px solid var(--line-2); background:#fcfdfe; }
  .ep-sum{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .ep-foot .btnp{ margin-left:auto; }
  .ep-foot .btnp:disabled{ background:#e2e8f0; color:#94a3b8; box-shadow:none; cursor:not-allowed; transform:none; filter:none; }

  .slots{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 16px; background:#fff;
    border:1px solid var(--line); border-radius:12px; margin-bottom:14px; }
  .slots .sl{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .slots .sk{ font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--faint); }
  .slots .sep{ width:1px; align-self:stretch; background:var(--line-2); margin:0 4px; }
  .chip-f{ display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 11px; border-radius:999px;
    border:1px solid var(--emerald-l2); background:var(--emerald-l); font-size:12.5px; font-weight:700; color:var(--emerald-dd); }
  .chip-f button{ border:none; background:none; cursor:pointer; color:var(--emerald-d); display:grid; place-items:center;
    width:16px; height:16px; border-radius:50%; padding:0; }
  .chip-f button:hover{ background:rgba(6,95,70,.12); }
  .chip-f .material-icons-round{ font-size:13px; }
  .chip-empty{ font-size:12.5px; font-weight:700; color:var(--faint); font-style:italic; }

  .convo-toggle{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff;
    border-radius:999px; padding:5px 12px; cursor:pointer; font:inherit; font-size:12px; font-weight:700;
    color:var(--muted); margin-bottom:14px; }
  .convo-toggle:hover{ border-color:#cbd5e1; color:var(--slate); }
  .convo-toggle .material-icons-round{ font-size:15px; transition:transform .16s; }
  .convo-toggle.open .material-icons-round{ transform:rotate(90deg); }
  .ready-line{ font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.6; }
  .ready-line b{ font-weight:800; }
  .ready-next{ margin-top:7px; font-size:12.5px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .ready-next .material-icons-round{ font-size:16px; color:var(--faint); }
  #fnStages{ margin:0 0 14px; }

  /* every turn is its own window on the canvas */
  .msg{ display:flex; gap:11px; margin-bottom:18px; align-items:flex-start; }
  .msg .who{ width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-size:11px; font-weight:800; margin-top:4px; }
  .msg.you .who{ background:var(--line-2); color:var(--slate-2); }
  .msg.sys .who{ background:var(--emerald-l); color:var(--emerald-d); }
  .msg .bub{ flex:1; min-width:0; font-size:14px; font-weight:600; color:var(--ink); line-height:1.6;
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:var(--sh-md); }
  .msg.you{ flex-direction:row-reverse; }
  .msg.you .bub{ flex:0 1 auto; max-width:72%; background:var(--emerald-l); border-color:var(--emerald-l2);
    color:var(--emerald-dd); box-shadow:none; padding:11px 16px; }
  .msg:last-child{ margin-bottom:0; }
  .qopts{ display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-top:14px; }
  /* a one- or two-way answer hangs off the right; three or more sit centred */
  .qopts.mid,.turn-acts.mid,.qconfirm.mid{ justify-content:center; }
  /* one size for every clickable in a turn —— the primary below matches it exactly,
     so a row of mixed buttons always sits on one line */
  .qopt{ padding:9px 15px; line-height:1.35; border:1px solid var(--line); border-radius:10px; background:#fff;
    cursor:pointer; font:inherit; font-size:13px; font-weight:700; color:var(--ink); transition:.14s; text-align:left; }
  .qopt:hover{ border-color:var(--emerald-ring); background:#f7fdfa; }
  .qopt .sub{ display:block; font-size:11px; font-weight:600; color:var(--muted); margin-top:1px; }
  .cant{ padding:12px 14px; border-radius:10px; background:#fffbeb; border:1px solid #fde68a;
    font-size:12.5px; font-weight:700; color:#92400e; margin-bottom:14px; }

  .srow2{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .srow2 + .srow2{ border-top:1px solid var(--line-2); }
  .srow2 .sno{ width:20px; font-size:11px; font-weight:800; color:var(--faint); flex:none; text-align:right; }
  .srow2 .stx{ flex:1; font-size:15px; font-weight:600; color:var(--ink); letter-spacing:.5px; }
  .srow2 .sacts{ display:flex; gap:4px; flex:none; }
  .sbtn{ width:26px; height:26px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer;
    font:inherit; font-size:13px; color:var(--slate-2); display:grid; place-items:center; }
  .sbtn:hover:not(:disabled){ border-color:#cbd5e1; color:var(--ink); }
  .sbtn:disabled{ opacity:.35; cursor:not-allowed; }
  .sbtn.del:hover{ border-color:var(--rose); color:var(--rose); background:var(--rose-bg); }

  /* Back is a control on the message, not one of its answers —— it floats in
     the top corner so the text wraps beside it and the answer row stays clean */
  .bk{ float:right; margin:-3px -4px 8px 14px; display:inline-flex; align-items:center; gap:4px;
    border:none; background:none; cursor:pointer; font:inherit; font-size:12.5px; font-weight:700;
    color:var(--faint); padding:5px 7px; border-radius:8px; transition:.14s; }
  .bk .material-icons-round{ font-size:15px; }
  .bk:hover{ color:var(--emerald-dd); background:var(--emerald-l); }
  .bub > div,.bub > .qopts,.bub > .qconfirm,.bub > .turn-acts{ clear:right; }

  .numfield{ display:inline-flex; align-items:center; gap:7px; padding:0 12px 0 13px; border:1px solid var(--line);
    border-radius:10px; background:#fff; }
  .numfield input{ width:46px; border:none; outline:none; background:none; font:inherit; font-size:15px;
    font-weight:800; color:var(--ink); padding:8px 0; text-align:center; -moz-appearance:textfield; }
  .numfield input::-webkit-outer-spin-button,.numfield input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .numfield:focus-within{ border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l); }
  .numfield .unit{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .numfield.dt input{ width:auto; min-width:172px; text-align:left; font-size:13.5px; }
  .numfield.dt select{ border:none; outline:none; background:none; font:inherit; font-size:13.5px;
    font-weight:700; color:var(--ink); padding:8px 4px; cursor:pointer; }

  .srow2.stu{ cursor:pointer; border-radius:9px; padding:7px 9px; transition:.14s; }
  .srow2.stu:hover{ background:#f6f9fc; }
  .srow2.stu.on{ background:var(--emerald-l); }
  .srow2.stu .tick{ font-size:19px; color:var(--faint); flex:none; }
  .srow2.stu.on .tick{ color:var(--emerald); }
  .srow2.stu .av{ width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-size:11px; font-weight:800; color:var(--slate-2); background:#eef2f7; }
  .srow2.stu .stx{ font-size:13.5px; font-weight:700; letter-spacing:0; }
  .srow2.stu .stx .qhint{ font-weight:600; margin-top:1px; }
  .srow2.stu + .srow2.stu{ border-top:none; }

  .vrow{ display:flex; align-items:center; gap:11px; padding:8px 0; }
  .vrow + .vrow{ border-top:1px solid var(--line-2); }
  .vrow .sbtn{ width:30px; height:30px; border-radius:50%; flex:none; }
  .vrow .sbtn .material-icons-round{ font-size:17px; }
  .vrow .sbtn.on{ border-color:var(--emerald); background:var(--emerald-l); color:var(--emerald-dd); }
  .vrow .vnm{ flex:1; min-width:0; }
  .vrow .vnm b{ display:block; font-size:13.5px; font-weight:800; color:var(--ink); }
  .vrow .vnm span{ font-size:11.5px; font-weight:600; color:var(--muted); }
  .vrow .qopt{ flex:none; }

  /* what the student sees —— it sits inside the teacher's thread, so it stays
     flat and quiet rather than imitating the student app */
  .stu{ border:1px solid var(--line-2); border-radius:11px; background:#fff; padding:16px 18px; }
  .stu .rline{ justify-content:center; }
  .stu .rtr{ text-align:center; margin-bottom:0; }
  /* the sentence list —— one row per sentence, each with its own play */
  .stu.list{ padding:0; border:none; background:none; }
  .stu.list .rline{ justify-content:flex-start; }
  .stu.list .rtr{ text-align:left; margin-top:6px; }
  .stu-s{ display:flex; align-items:flex-start; gap:12px; background:#fff;
    border:1px solid var(--line-2); border-radius:10px; padding:11px 14px; }
  .stu-s + .stu-s{ margin-top:8px; }
  .stu-s .pl{ flex:none; margin-top:9px; color:var(--emerald); font-size:15px; }
  .stu-s .bd{ flex:1; min-width:0; }
  .stu-q{ font-size:15px; font-weight:700; color:var(--ink); text-align:center; line-height:1.55; }
  .stu-o{ display:flex; flex-direction:column; gap:7px; margin-top:13px; }
  .stu-o span{ font-size:13px; font-weight:600; color:var(--slate); border:1px solid var(--line);
    border-radius:9px; padding:9px 13px; background:#fff; }
  .stu-w{ display:flex; justify-content:center; gap:7px; flex-wrap:wrap; }
  .stu-w span{ font-size:17px; font-weight:600; color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:7px 12px; background:#fff; letter-spacing:.5px; }
  .stu-acts{ display:flex; justify-content:center; gap:9px; margin-top:15px; }
  .stu-b{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    color:var(--slate-2); border:1px solid var(--line); border-radius:9px; padding:7px 13px; background:#fff; }
  .stu-b .material-icons-round{ font-size:16px; }
  .stu-b.rec{ color:var(--emerald-dd); border-color:var(--emerald-l2); background:var(--emerald-l); }
  .stu-foot{ margin-top:14px; padding-top:11px; border-top:1px solid var(--line-2);
    font-size:11.5px; font-weight:600; color:var(--faint); text-align:center; }

  .gen-revise.qopt .sub.warn{ color:var(--amber); font-weight:700; }
  .qopt.gen-revise.on,.qopt.gen-revise:hover{ border-color:var(--amber); }
  .qopt.gen-summary.on,.qopt.gen-summary:hover{ border-color:#3b82f6; }

  .wcount{ font-size:11.5px; font-weight:700; color:var(--faint); text-align:right; margin-top:7px; }
  .wcount.over{ color:var(--amber); }

  .tpbar{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--slate);
    padding:9px 11px; border-radius:9px; background:var(--emerald-l); margin-bottom:13px; }
  .tpbar .material-icons-round{ font-size:17px; color:var(--emerald); }
  .tpbar b{ font-size:14px; font-weight:800; color:var(--emerald-dd); }
  .tpbar .rdy{ margin-left:auto; font-size:11.5px; font-weight:800; color:var(--emerald-d); }

  .wgrid{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:5px 4px; }
  .wgrid .pn{ font-size:15px; color:var(--muted); align-self:flex-end; padding-bottom:5px; }
  .wchip{ display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; font:inherit;
    border:1px solid transparent; border-radius:7px; padding:3px 6px 4px; background:var(--emerald-l);
    transition:.12s; }
  .wchip:hover:not(:disabled){ border-color:var(--emerald-ring); }
  .wchip:disabled{ cursor:default; }
  .wchip .wpy{ font-size:9.5px; font-weight:600; color:var(--emerald-d); line-height:1.3; }
  .wchip .whz{ font-size:15px; font-weight:600; color:var(--ink); letter-spacing:.5px; line-height:1.35; }
  .wchip.on{ background:var(--rose-bg); border-color:var(--rose); }
  .wchip.on .wpy{ color:var(--rose); }
  .wchip.an{ background:#e6f0ff; border-color:#3b82f6; }
  .wchip.an .wpy{ color:#1d4ed8; }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:13px; padding-top:11px; border-top:1px solid var(--line-2); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--muted); }
  .legend .sw{ width:11px; height:11px; border-radius:3px; border:1px solid; }
  .legend .sw.seg{ background:var(--emerald-l); border-color:var(--emerald-ring); }
  .legend .sw.sel{ background:var(--rose-bg); border-color:var(--rose); }
  .legend .sw.ana{ background:#e6f0ff; border-color:#3b82f6; }

  .tp-more{ margin-top:14px; padding-top:13px; border-top:1px solid var(--line-2); }
  .tp-more b{ font-size:13px; font-weight:800; color:var(--ink); }
  .tp-more .tp-add{ border-top:none; padding-top:0; margin-top:10px; }
  .tp-more .tp-add input{ min-width:0; }

  .ptabs{ display:flex; gap:16px; border-bottom:1px solid var(--line-2); margin-bottom:13px; }
  .ptabs button{ display:inline-flex; align-items:center; gap:6px; border:none; background:none; cursor:pointer;
    font:inherit; font-size:12.5px; font-weight:700; color:var(--muted); padding:0 2px 9px;
    border-bottom:2px solid transparent; margin-bottom:-1px; transition:.14s; }
  .ptabs button .material-icons-round{ font-size:16px; }
  .ptabs button.on{ color:var(--ink); border-bottom-color:var(--ink); }
  .ptabs button:hover{ color:var(--ink); }

  .drop{ border:1px dashed var(--line); border-radius:11px; background:#fbfdff; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    padding:26px 16px; text-align:center; transition:.14s; }
  .drop:hover{ border-color:var(--emerald-ring); background:var(--emerald-l); }
  .drop .material-icons-round{ font-size:26px; color:var(--faint); }
  .drop span:last-child{ font-size:12px; font-weight:600; color:var(--muted); }
  .files{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .file{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; color:var(--slate-2);
    border:1px solid var(--line); border-radius:7px; padding:4px 6px 4px 8px; background:#fff; }
  .file .material-icons-round{ font-size:14px; color:var(--faint); }
  .file button{ border:none; background:none; cursor:pointer; color:var(--faint); display:grid; place-items:center; padding:0; }
  .file button .material-icons-round{ font-size:13px; }
  .file button:hover{ color:var(--rose); }

  .fgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  .fld + .fld,.wl + .fld,.fld + .wl{ margin-top:14px; }
  .flbl{ display:block; font-size:11px; font-weight:800; letter-spacing:.3px; color:var(--slate-2); margin-bottom:6px; }
  .flbl em{ font-style:normal; font-weight:600; color:var(--faint); }
  .ftext{ width:100%; border:1px solid var(--line); border-radius:9px; background:#fff; font:inherit;
    font-size:13.5px; color:var(--ink); padding:9px 12px; }
  .ftext:focus{ outline:none; border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l); }
  .ctypes{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .ctypes .qopt{ padding:6px 11px; font-size:12px; }
  .wlrow{ display:flex; align-items:center; gap:10px; }
  .wlrow input[type=range]{ flex:1; accent-color:var(--emerald); }
  .wlmin,.wlmax{ font-size:11px; font-weight:700; color:var(--faint); }
  .wlnow{ text-align:center; font-size:13px; font-weight:800; color:var(--emerald-dd); margin-top:4px; }

  .more-note{ margin-top:9px; font-size:11.5px; font-weight:600; color:var(--faint); }

  /* passage step */
  .srow{ position:relative; padding-right:34px; }
  .srow + .srow{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line-2); }
  .srow-x{ position:absolute; right:0; top:2px; border:none; background:none; cursor:pointer; color:#cbd5e1;
    width:26px; height:26px; border-radius:7px; display:grid; place-items:center; }
  .srow-x:hover{ background:var(--rose-bg); color:var(--rose); }
  .srow-x .material-icons-round{ font-size:16px; }
  .txarea{ width:100%; min-height:170px; border:1px solid var(--line); border-radius:9px; padding:11px 13px;
    font:inherit; font-size:17px; font-weight:600; color:var(--ink); line-height:2; resize:vertical; letter-spacing:.5px; }
  .txarea:focus{ outline:none; border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l2); }
  .tp-warn{ margin-top:12px; font-size:11.5px; font-weight:700; color:#92400e; background:#fffbeb;
    border:1px solid #fde68a; border-radius:8px; padding:8px 11px; }

  .covers{ padding:14px 18px; border-bottom:1px solid var(--line-2); background:#fcfdfe; }
  .covers .ch{ display:flex; align-items:baseline; gap:9px; margin-bottom:9px; }
  .covers .ch b{ font-size:12px; font-weight:800; color:var(--slate); letter-spacing:.2px; }
  .covers .ch span{ font-size:11.5px; font-weight:700; color:var(--faint); }
  .covers .warn{ margin-top:9px; font-size:11.5px; font-weight:700; color:#92400e; background:#fffbeb;
    border:1px solid #fde68a; border-radius:8px; padding:7px 10px; }

<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s);};
  var $$=function(s){return [].slice.call(document.querySelectorAll(s));};
  var tt; function say(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2400);}
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  /* ================= teaching-point types (8, per TEACHING_POINT_TYPE_OPTIONS) ========= */

    WORD:{l:'Word',c:'gray'}, NOUN:{l:'Noun',c:'gray'}, VERB:{l:'Verb',c:'gray'}, ADJECTIVE:{l:'Adj',c:'gray'},

  };
  var WORDISH=['WORD','NOUN','VERB','ADJECTIVE'];
  var PATTERNISH=['GRAMMAR','PHRASE','MEASURE_WORD'];

  /* ================= the five practice types + the vocabulary MC mode ================= */
  var PT={
    MIRRORING:       {n:'Mirroring',      icon:'mic',         bg:'var(--mir-bg)', fg:'var(--mir)', pill:'mir', src:'text', covers:'all'},
    VOCABULARY:      {n:'Vocabulary',     icon:'bookmark',    bg:'var(--voc-bg)', fg:'var(--voc)', pill:'voc', src:'tp',   covers:WORDISH},
    SENTENCE_SCRAMBLE:{n:'Sentence Scramble',icon:'reorder',  bg:'#FCE7F3',       fg:'#BE185D',    pill:'',    src:'tp',   covers:PATTERNISH},
    QA:              {n:'QA',             icon:'chat_bubble', bg:'var(--qa-bg)',  fg:'var(--qa)',  pill:'qa',  src:'bank', covers:'byQaCat'},
    VOCABULARY_MC:   {n:'Vocabulary × MC',icon:'quiz',        bg:'var(--voc-bg)', fg:'var(--voc)', pill:'voc', src:'tp',   covers:WORDISH},
    MULTIPLE_CHOICE: {n:'Multiple Choice',icon:'quiz',      bg:'var(--mc-bg)',  fg:'var(--mc)',  pill:'mc',  src:'bank', covers:'byCat'}
  };
  /* A 課文選擇題 covers whatever its question-bank category actually drills.
     Comprehension tests the passage as a whole —— it does not drill any single
     teaching point, so it honestly contributes nothing to coverage. */
  /* QA also comes from the question bank —— Content Base answers the passage,

  var QA_CAT={ shortAnswer:{l:'Content Base', covers:[]}, extension:{l:'Extension', covers:[]} };
  var MC_CAT={

  /* ================= the 8+1 endpoints (spec §5.3) =================

  var EP={
    MIRRORING:        {t:'Content Mirroring',   s:'Say the passage back, line by line', needs:'text', kind:'practice'},
    VOCABULARY:       {t:'Vocabulary Mirroring',s:'Say the words back, one by one',    needs:'tp',   kind:'practice'},
    VOCABULARY_MC:    {t:'Vocabulary Quiz',     s:'Word meaning &amp; usage, in MC form', needs:'tp', kind:'practice'},

  }
  function pad2(n){ return (n<10?'0':'')+n; }

    'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
  function dtNice(v){

    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
  }

  /* Course Settings —— the four fields the real step 1 has. Standard and level

  var GEN_MODES=[
    ['create','Write it for me','Enter a topic —— we generate a graded article', ''],
    ['revise','Adapt my article','Give us your own —— we rewrite it to their level', '≈ 90 sec · for precision'],
    ['summary','Use my article as it is','Upload or paste, used directly, nothing rewritten', '']
  ];
  var CONTENT_TYPES=['Conversation','Article','Story','Announcement','Script','Speech','Debate Script'];

  var EP_PRACTICE=['MIRRORING','VOCABULARY','VOCABULARY_MC',
                   'SENTENCE_SCRAMBLE','SENTENCE_RESPONSE','SENTENCE_BUILDING',
                   'MULTIPLE_CHOICE','QA'];

  /* what a chosen set of practices needs the Project to already have */
  function missingFrom(proj, eps){
    var need=[];
    if(eps.some(function(k){return EP[k].needs==='bank';}) && !proj.bank) need.push('QB');
    if(eps.some(function(k){return EP[k].needs==='tp';}) && !(proj.tps&&proj.tps.length)) need.push('TP');
    return need;
  }
  function missingLabel(need){
    return need.map(function(n){ return n==='QB'?'a question bank':'teaching points'; }).join(' and ');
  }

  /* what a question bank is needed for */
  function makesQuestions(eps){ return eps.some(function(k){ return EP[k].needs==='bank'; }); }
  function needsBank(eps){ return eps.some(function(k){ return EP[k].needs==='bank'; }); }
  function needsTp(eps){ return eps.some(function(k){ return EP[k].needs==='tp'; }); }
  function hasPractice(eps){ return eps.some(function(k){ return EP[k].kind==='practice'; }); }

  /* ================= the actual content behind each row =================
     Planning claims "see it before you create it" —— that only means anything
     if the rows can show the real sentences, cards and questions. ============ */
  var TEXTS={
    '食物':{
      sents:[
        {w:[['我','wǒ'],['喜欢','xǐhuan'],['吃','chī'],['米饭','mǐfàn'],['。','']], t:'I like eating rice.'},
        {w:[['你','nǐ'],['饿','è'],['了','le'],['吗','ma'],['？','']], t:'Are you hungry?'},
        {w:[['这个','zhège'],['苹果','píngguǒ'],['很','hěn'],['好吃','hǎochī'],['。','']], t:'This apple is delicious.'},
        {w:[['我','wǒ'],['想','xiǎng'],['喝','hē'],['一','yì'],['碗','wǎn'],['牛奶','niúnǎi'],['。','']], t:'I want a bowl of milk.'},
        {w:[['早饭','zǎofàn'],['你','nǐ'],['吃','chī'],['鸡蛋','jīdàn'],['吗','ma'],['？','']], t:'Do you eat eggs for breakfast?'},
        {w:[['我','wǒ'],['不','bù'],['喜欢','xǐhuan'],['吃','chī'],['面条','miàntiáo'],['。','']], t:'I don’t like eating noodles.'}
      ],
      cards:[['米饭','mǐfàn','rice'],['面条','miàntiáo','noodles'],['鸡蛋','jīdàn','egg'],['牛奶','niúnǎi','milk'],
             ['苹果','píngguǒ','apple'],['好吃','hǎochī','tasty']],
      qs:[{q:'“我喜欢吃___。” 哪一个最合适？',o:['米饭','跑步','很好'],a:0},
          {q:'“这个苹果很好吃” 是什么意思？',o:['This apple is expensive','This apple is delicious','This apple is small'],a:1}],
      scram:[['我','喜欢','吃','米饭'],['吃','米饭','我','喜欢']],
      prompts:['你早饭吃什么？','你最喜欢吃什么水果？','你饿的时候吃什么？']
    },
    '天气':{
      sents:[
        {w:[['今天','jīntiān'],['很','hěn'],['冷','lěng'],['。','']], t:'It is very cold today.'},
        {w:[['外面','wàimiàn'],['在','zài'],['下雨','xiàyǔ'],['。','']], t:'It is raining outside.'},
        {w:[['太','tài'],['热','rè'],['了','le'],['！','']], t:'It is too hot!'},
        {w:[['外面','wàimiàn'],['刮风','guāfēng'],['了','le'],['。','']], t:'It has turned windy outside.'}
      ],
      cards:[['刮风','guāfēng','to be windy'],['下雨','xiàyǔ','to rain'],['冷','lěng','cold'],['热','rè','hot']],

      scram:[['今天','很','冷'],['冷','今天','很']],
      prompts:['今天天气怎么样？','你喜欢下雨天吗？']
    }
  };
  function textOf(topic){ return TEXTS[topic]||TEXTS['食物']; }

  function rubyLine(pairs){
    return '<div class="rline">'+pairs.map(function(p){
      return '<span class="wd"><span class="py">'+esc(p[1])+'</span><span class="hz">'+esc(p[0])+'</span></span>';
    }).join('')+'</div>';
  }

  /* what the expanded body of a row shows */
  function VOCAB_N(tps){ return tps.filter(function(x){return WORDISH.indexOf(x.ty)>-1;}).length; }
  function rowContent(r, topic, tps){
    var C=textOf(topic);
    var live = S.sents.length ? S.sents : C.sents;

      return '<div class="cbox"><span class="clbl">Article Content</span>'+

        '<div class="cbox"><span class="clbl">Teaching points it has to cover</span>'+
        '<div class="tps">'+tps.map(function(t){ var ty=TPT[t.ty];

        '<div class="more-note">Edited in the first step — go back if you want to change it again.</div></div>';
    }

        '<div class="more-note">The student hears the sentence, then puts the words back in order.</div></div>';
    }
    if(t==='QA'){
      return '<div class="cbox"><span class="clbl">The prompts, from the question bank</span>'+
        C.prompts.map(function(x,i){
          return '<div class="qitem"><span class="qq">'+(i+1)+'. '+esc(x)+'</span></div>'; }).join('')+
        '<div class="more-note">Spoken answers · AI asks one follow-up per answer. Generated as the bank’s Content Base questions.</div></div>';
    }
    return '';

  /* ================= projects ================= */

  /* ================= stages =================
     Project → Teaching points → Question bank → Questions → Practices.
     Which of them light up is derived from the chosen endpoints. ========== */
  var STAGE_LABELS=['Project','Teaching points','Question bank','Questions','Practices'];

  /* teaching points a model would pull out of a freshly written passage */
  var PROPOSED={
    '食物':[['米饭','WORD'],['面条','WORD'],['鸡蛋','WORD'],['牛奶','WORD'],['苹果','WORD'],['早饭','NOUN'],
            ['好吃','ADJECTIVE'],['饿','ADJECTIVE'],['喝','VERB'],['吃','VERB'],['了','GRAMMAR'],['碗','MEASURE_WORD']],
    '天气':[['刮风','VERB'],['下雨','VERB'],['冷','ADJECTIVE'],['热','ADJECTIVE'],['天气','NOUN'],['今天','NOUN'],
            ['太…了','GRAMMAR'],['度','MEASURE_WORD']]
  };
  function proposeTps(topic){
    return (PROPOSED[topic]||PROPOSED['食物']).map(function(t){ return {w:t[0], ty:t[1]}; });
  }

  /* ================= state ================= */
  var S={ mode:null, after:null, slide:false, ep:[], src:null, fixed:false, cls:null, q:null, topic:'食物',
          sents:[], tps:[], rows:[], qn:10, askQ:null, turns:[], thinking:false, pickMore:false, gen:null, std:null, lvl:null, tgt:null, nat:null,
              ctype:null, wlimit:150, pasted:'', provide:'image', imgs:0, pname:'', sched:{start:null,due:null,optional:null}, studs:[],
          mir:{ sentencesDone:false, audioMode:null, englishFirst:null, pinyin:null,
                translation:null, autoPass:null, speed:null, voice:null } };

  /* ================= reading a typed sentence =================
     A keyword matcher standing in for the real model. Its job is only to fill
     the two slots —— anything it cannot fill becomes a question. ============ */
  var UNSUPPORTED=[
    {re:/作文|寫作|写作|essay/i, name:'writing',     near:'QA', why:'目前沒有寫作類練習'},
    {re:/翻譯|翻译|translate/i,   name:'translation', near:'QA', why:'目前沒有翻譯練習'}
  ];
  var AMBIGUOUS={
    read:{re:/念|唸|朗讀|朗读/, ask:'Reading what — the words, or the sentences?',
      opts:[['VOCABULARY','Words','Vocabulary cards'],['MIRRORING','Sentences','Mirroring practice']]},
    makeSentence:{re:/造句/, ask:'“造句” — which one do you mean?',
      opts:[['SENTENCE_SCRAMBLE','Put words in order','Sentence Scramble'],['QA','Say one themselves','QA Practice']]},
    dictate:{re:/聽寫|听写|默寫|默写/, ask:'“聽寫” has no exact match. The closest two:',
      opts:[['VOCABULARY','Vocabulary cards','recognise and recall the words'],['MIRRORING','Mirroring','say them out loud']]}
  };

  function parse(q){
    var out={ep:[], src:null, cls:null, ambiguous:null, unsupported:null};
    var m=q.match(/([0-9]+[A-Za-z])\s*班?/); if(m) out.cls=m[1].toUpperCase();
    UNSUPPORTED.forEach(function(u){ if(!out.unsupported && u.re.test(q)) out.unsupported=u; });
    Object.keys(AMBIGUOUS).forEach(function(k){
      if(!out.ambiguous && AMBIGUOUS[k].re.test(q) && !/單字|单字|生詞|生词|句子/.test(q)) out.ambiguous=k;
    });
    // the endpoint names are printed on the options, so they get typed back at us
    Object.keys(EP).forEach(function(k){
      var n=EP[k].t.replace(/&amp;/g,'&');
      if(new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(q) && out.ep.indexOf(k)<0) out.ep.push(k);
    });
    if(/單字|单字|生詞|生词|詞卡|词卡/.test(q) && /念|唸|背|記/.test(q)) out.ep.push('VOCABULARY');
    if(/句型|語序|语序|重組|重组/.test(q)) out.ep.push('SENTENCE_SCRAMBLE');
    if(/選擇題|选择题|出題|出题|幾題|几题|十題|十题/.test(q)) out.ep.push('MULTIPLE_CHOICE');
    if(/問答|问答|口說|口试|口試/.test(q)) out.ep.push('QA');
    if(/講義|讲义|handout/i.test(q)) out.ep.push('HANDOUT');
    if(/投影片|簡報|slide/i.test(q)) out.ep.push('SLIDE');
    if(/從頭|从头|完整|一口氣|一口气|全部做完|整課|整课/.test(q))
      out.ep=['VOCABULARY','SENTENCE_SCRAMBLE','MULTIPLE_CHOICE'];

    var hit=null;
    PROJECTS.forEach(function(pj){ if(!hit && q.indexOf(pj.topic)>-1) hit=pj; });
    if(/新建|新的|重新寫|重新写|還沒有|还没有|沒有課文|没有课文/.test(q)) out.src={kind:'write'};
    else if(hit) out.src={kind:'existing', sk:hit.sk};
    return out;
  }

  /* ================= what a run produces ================= */
  function tpsCoveredBy(type, tps, cat){
    var c=PT[type].covers;
    if(c==='byCat')   c=MC_CAT[cat||'comprehension'].covers;
    if(c==='byQaCat') c=QA_CAT[cat||'shortAnswer'].covers;
    if(c==='all') return tps.map(function(t){return t.w;});
    return tps.filter(function(t){ return c.indexOf(t.ty)>-1; }).map(function(t){return t.w;});
  }
  function detailFor(t,tps,cat){
    var w=tps.filter(function(x){return WORDISH.indexOf(x.ty)>-1;}).length;
    var p=tps.filter(function(x){return PATTERNISH.indexOf(x.ty)>-1;}).length;
    if(t==='MIRRORING') return (S.sents.length||6)+' sentences · pinyin shown · pronunciation scored';
    if(t==='VOCABULARY') return w+' cards · audio, pinyin and meaning';
    if(t==='SENTENCE_SCRAMBLE') return (p||1)*3+' sentences · listen, then rearrange';
    if(t==='QA') return 'QA × '+QA_CAT[cat||'shortAnswer'].l+' × 5 · AI asks one follow-up each';
    if(t==='VOCABULARY_MC') return w+' questions · image, pinyin and meaning';
    return 'Multiple Choice × '+MC_CAT[cat||'comprehension'].l+' × 10';
  }
  function srcLabel(t,topic){
    var s=PT[t].src;
    if(s==='text') return 'from the content';
    if(s==='bank') return 'Bank: '+topic+' — Exit questions';
    return 'from teaching points';
  }

  /* what the teacher typed at Review & Edit wins; the topic is only a fallback */
  function projName(){ return (S.pname||'').trim() || S.topic || 'New project'; }

  function composeRows(){
    var existing = S.src && S.src.kind==='existing' && S.src.sk;
    var tps=tpsForPath(), rows=[];
    var topic = existing ? S.proj.topic : S.topic;
    var name  = existing ? S.proj.name  : projName();

    if(!existing){
      rows.push({stage:'Project', kind:'text', on:true, open:true,
        n:name, d:tps.length+' teaching points · '+(S.sents.length||6)+' sentences at HSK 1',
        chips:['new'], covers:tps.map(function(t){return t.w;})});
    }
    if(needsBank(S.ep)){
      var hasBank = existing && S.proj.bank;
      rows.push({stage:'Question bank', kind:'bank', on:true,
        n: hasBank ? S.proj.bank : (topic+' — Exit questions'),
        d:'Multiple Choice × Comprehension × 10'+(S.ep.indexOf('QA')>-1?' · QA × Content Base × 5':''),
        chips:[hasBank?'existing bank':'new'], covers:[]});
    }
    if(S.after==='handout'){
      rows.push({stage:'Teaching material', kind:'handout', on:true, ep:'HANDOUT',
        n:topic+' · Handout', d:'A4 · Reading with Pinyin, Full Reading, Translation, Teaching Points',
        chips:['from the Project'], covers:[]});
    }
    S.ep.forEach(function(k){
      var cat = k==='MULTIPLE_CHOICE' ? 'comprehension' : (k==='QA' ? 'shortAnswer' : null);
      rows.push({stage:'Practices', kind:'practice', type:k, cat:cat, on:true,
        n:topic+' · '+PT[k].n, d:detailFor(k,tps,cat),
        chips:[srcLabel(k,topic)], covers:tpsCoveredBy(k,tps,cat)});
    });
    return rows;
  }

  /* ================= the conversation =================
     Everything is a turn in one thread —— the questions, the passage, the
     teaching points, what gets created. Turns append; nothing is replaced.
     Only the newest turn carries controls; older ones are read-only. ======= */
  var pick=[];
  var editing=false;

  function epIcon(k){
    var ic=PT[k];
    if(ic) return ic;
    return {icon:(k==='HANDOUT'?'print':k==='SLIDE'?'slideshow':'edit_note'), bg:'var(--emerald-l)', fg:'var(--emerald-d)'};
  }

  function nextQuestion(){
    if(S.unsupported) return null;
    if(S.askAmb){
      var a=AMBIGUOUS[S.askAmb];
      return {key:'amb', ask:a.ask, opts:a.opts.map(function(o){ return {t:o[1], s:o[2], v:o[0]}; })};
    }

    /* 今天要做什麼呢？ */
    /* 一張清單問完要做什麼 */
    if(!S.mode) return practicesQ();

    /* “make practices” was picked after the content was written —— the same
       list, minus the two material outputs, which already exist */
    if(S.pickMore && !S.ep.length){
      return {key:'more', multi:true, ask:'Which practices?',
        opts:EP_PRACTICE.map(function(k){
          return {t:EP[k].t, v:k, thumb:THUMB[k]}; })};
    }

    /* 從要現有 Project 建立嗎？ */
    if(!S.src){
      return {key:'src', ask:'Build them from a Project you already have?', opts:[
        {t:'Yes', s:'pick one next', v:'yes'},
        {t:'Start a new one', s:'we write the content together', v:'new'}
      ]};
    }
    /* 提供現有 Project 清單 */
    if(S.src.kind==='existing' && !S.src.sk){
      return {key:'pickproj', ask:'Which one?',
        opts:PROJECTS.map(function(p){ return {t:p.name, s:p.level+' · '+(p.bank?'has a question bank':'no question bank yet'), v:p.sk}; })};
    }
    /* 檢查現有 Project 是否滿足所選練習需要的 QB / Teaching Point */
    if(S.src.kind==='existing' && !S.fixed){
      var proj=PROJECTS.filter(function(p){return p.sk===S.src.sk;})[0];
      var need=missingFrom(proj, S.ep);
      if(need.length){
        var who=S.ep.filter(function(k){
          return (need.indexOf('QB')>-1 && EP[k].needs==='bank') || (need.indexOf('TP')>-1 && EP[k].needs==='tp');
        }).map(function(k){return EP[k].t;}).join('、');
        return {key:'fill', ask:'“'+proj.name+'” has no '+missingLabel(need)+' yet, and '+who+' needs '+
          (need.length>1?'them':'it')+'.', hint:'It can be made as part of this run.',
          opts:[{t:'Add '+missingLabel(need), s:'and carry on', v:'fill'}]};
      }
    }
    return null;
  }

  /* Everything the product can make, in one list —— no “is it a Project or a
     Practice” question in front of it. Just the content is exclusive; picking it
     clears the rest (and the rest clears it). */
  /* the two material outputs lead —— they are what a lesson starts from,
     and the six practices all need one of them to exist first */
  /* 一家一行：素材產出＋課文跟讀 3 · 生詞 2 · 句型 3 · 理解 2 */
  var ENDPOINTS=['HANDOUT','SLIDE','MIRRORING']
    .concat(EP_PRACTICE.filter(function(k){ return k!=='MIRRORING'; }));
  var ROW_END={ MIRRORING:1, VOCABULARY_MC:1, SENTENCE_BUILDING:1 };

  /* A tiny abstract of what the student actually sees —— the same shapes the
     student-view step draws in full, so the card and the preview agree. */
  function thumb(inner){
    return '<span class="thumb"><svg viewBox="0 0 136 56" role="img" aria-hidden="true">'+
      '<rect x=".5" y=".5" width="135" height="55" rx="7" fill="#f8fafc" stroke="#e6ecf3"/>'+inner+'</svg></span>';
  }
  var PLAY='<circle cx="17" cy="CY" r="7" fill="#10b981"/><path d="M15 CY-3 l5 3 -5 3z" fill="#fff"/>';
  /* 說一句話的綠色麥克風膠囊 —— 跟 v1 提案 C 同一個手勢 */
  var SPEAK='<rect x="40" y="35" width="56" height="15" rx="7.5" fill="#d1fae5" stroke="#10b981"/>'+
            '<rect x="55" y="39" width="3.5" height="6" rx="1.75" fill="#10b981"/>'+
            '<rect x="63" y="41" width="20" height="3" rx="1.5" fill="#10b981"/>';
  var THUMB={
    /* two sentence rows, each with its own play —— pinyin thin, hanzi solid */
    MIRRORING: thumb(
      PLAY.replace(/CY-3/g,'15').replace(/CY/g,'18')+
      '<rect x="30" y="13" width="72" height="3" rx="1.5" fill="#cbd5e1"/>'+
      '<rect x="30" y="19.5" width="88" height="5" rx="2" fill="#94a3b8"/>'+
      PLAY.replace(/CY-3/g,'37').replace(/CY/g,'40')+
      '<rect x="30" y="35" width="56" height="3" rx="1.5" fill="#cbd5e1"/>'+
      '<rect x="30" y="41.5" width="78" height="5" rx="2" fill="#94a3b8"/>'),
    /* one word card, and a mic to say it */
    VOCABULARY: thumb(
      '<rect x="44" y="9" width="48" height="21" rx="5" fill="#fff" stroke="#cbd5e1"/>'+
      '<rect x="55" y="16.5" width="26" height="6" rx="2" fill="#94a3b8"/>'+
      '<circle cx="68" cy="42" r="8.5" fill="#d1fae5" stroke="#10b981"/>'+
      '<rect x="66" y="37.5" width="4" height="6.5" rx="2" fill="#10b981"/>'+
      '<path d="M63.5 42a4.5 4.5 0 0 0 9 0" stroke="#10b981" fill="none" stroke-width="1.4"/>'),
    /* the same word, but answered by picking */
    VOCABULARY_MC: thumb(
      '<rect x="48" y="8" width="40" height="7" rx="3" fill="#94a3b8"/>'+
      '<rect x="26" y="21" width="84" height="8" rx="4" fill="#fff" stroke="#cbd5e1"/>'+
      '<rect x="26" y="32" width="84" height="8" rx="4" fill="#d1fae5" stroke="#10b981"/>'+
      '<rect x="26" y="43" width="84" height="8" rx="4" fill="#fff" stroke="#cbd5e1"/>'),
    /* loose word blocks, and the slot they belong in */
    /* 句型挖空，用說的補起來 */
    SENTENCE_RESPONSE: thumb(
      '<rect x="18" y="10" width="70" height="5" rx="2.5" fill="#94a3b8"/>'+
      '<rect x="18" y="22" width="24" height="4" rx="2" fill="#cbd5e1"/>'+
      '<rect x="46" y="20" width="24" height="8" rx="3" fill="none" stroke="#10b981" stroke-dasharray="3 3"/>'+
      '<rect x="74" y="22" width="16" height="4" rx="2" fill="#cbd5e1"/>'+SPEAK),
    /* 給一個教學點，整句自己造出來 */
    SENTENCE_BUILDING: thumb(
      '<rect x="36" y="7" width="64" height="14" rx="7" fill="#fff" stroke="#cbd5e1"/>'+
      '<rect x="46" y="11.5" width="44" height="5" rx="2.5" fill="#94a3b8"/>'+
      '<rect x="18" y="30" width="100" height="16" rx="8" fill="#d1fae5" stroke="#10b981"/>'+
      '<rect x="29" y="35" width="3.5" height="6" rx="1.75" fill="#10b981"/>'+
      '<rect x="37" y="36.5" width="66" height="3" rx="1.5" fill="#10b981"/>'),
    SENTENCE_SCRAMBLE: thumb(
      '<rect x="17" y="12" width="23" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/>'+
      '<rect x="45" y="9" width="27" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/>'+
      '<rect x="77" y="13" width="21" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/>'+
      '<rect x="103" y="10" width="16" height="12" rx="3" fill="#fff" stroke="#cbd5e1"/>'+
      '<rect x="17" y="34" width="102" height="13" rx="3" fill="none" stroke="#cbd5e1" stroke-dasharray="3 3"/>'),
    /* a prompt, answered out loud */
    QA: thumb(
      '<rect x="18" y="12" width="86" height="5" rx="2.5" fill="#94a3b8"/>'+
      '<rect x="18" y="22" width="54" height="4" rx="2" fill="#cbd5e1"/>'+
      '<rect x="40" y="35" width="56" height="15" rx="7.5" fill="#d1fae5" stroke="#10b981"/>'+
      '<rect x="55" y="39" width="3.5" height="6" rx="1.75" fill="#10b981"/>'+
      '<rect x="63" y="41" width="20" height="3" rx="1.5" fill="#10b981"/>'),
    /* a question, and one of the options chosen */
    MULTIPLE_CHOICE: thumb(
      '<rect x="16" y="9" width="86" height="5" rx="2.5" fill="#94a3b8"/>'+
      '<rect x="16" y="20" width="104" height="8" rx="4" fill="#fff" stroke="#cbd5e1"/>'+
      '<rect x="16" y="31" width="104" height="8" rx="4" fill="#d1fae5" stroke="#10b981"/>'+
      '<rect x="16" y="42" width="104" height="8" rx="4" fill="#fff" stroke="#cbd5e1"/>'),
    /* not a screen at all —— a sheet of paper */
    HANDOUT: thumb(
      '<rect x="40" y="5" width="56" height="46" rx="3" fill="#fff" stroke="#cbd5e1"/>'+
      '<rect x="48" y="12" width="28" height="4.5" rx="2" fill="#94a3b8"/>'+
      '<rect x="48" y="22" width="40" height="2.5" rx="1.25" fill="#cbd5e1"/>'+
      '<rect x="48" y="28" width="34" height="2.5" rx="1.25" fill="#cbd5e1"/>'+
      '<rect x="48" y="34" width="40" height="2.5" rx="1.25" fill="#cbd5e1"/>'+
      '<rect x="48" y="40" width="22" height="2.5" rx="1.25" fill="#cbd5e1"/>'),
    /* the text on its own —— nothing to do yet */
    SLIDE: thumb(
      '<rect x="18" y="12" width="72" height="5" rx="2.5" fill="#94a3b8"/>'+
      '<rect x="18" y="23" width="100" height="3" rx="1.5" fill="#cbd5e1"/>'+
      '<rect x="18" y="30" width="92" height="3" rx="1.5" fill="#cbd5e1"/>'+
      '<rect x="18" y="37" width="100" height="3" rx="1.5" fill="#cbd5e1"/>'+
      '<rect x="18" y="44" width="64" height="3" rx="1.5" fill="#cbd5e1"/>')
  };
  function applyPicks(ks){
    S.ep=ks.filter(function(k){ return EP_PRACTICE.indexOf(k)>-1; });
    S.slide = ks.indexOf('SLIDE')>-1;
    S.after = ks.indexOf('HANDOUT')>-1 ? 'handout' : null;
    S.mode = S.ep.length ? 'practice' : 'project';
  }

  function practicesQ(){
    return {key:'practices', multi:true, ask:'What do you want to make?',
      opts:ENDPOINTS.map(function(k){
        return {t:EP[k].t, v:k, thumb:THUMB[k]}; })};
  }

  /* ---------------- turn bodies ---------------- */
  /* the opening line of a run —— what it is doing and how far it goes */
  function runIntro(){
    if(!S.mode) return '';
    var existing = S.src && S.src.kind==='existing' && S.src.sk;
    var proj = existing ? (PROJECTS.filter(function(p){return p.sk===S.src.sk;})[0]||{}).name : null;
    var made = S.ep.map(function(k){return EP[k].t;});
    if(S.after==='handout') made.unshift('Handout');
    if(S.slide) made.unshift('Slide');
    var line = existing
      ? 'Using <b>'+esc(proj)+'</b> · creating <b>'+esc(made.join('、'))+'</b>'
      : (made.length ? 'Writing <b>new content</b> · creating <b>'+esc(made.join('、'))+'</b>'
                     : 'Writing <b>new content</b>');
    if(needsBank(S.ep)){
      var hasBank = existing && (PROJECTS.filter(function(p){return p.sk===S.src.sk;})[0]||{}).bank;
      line += hasBank ? '<br/>Its question bank already exists, so nothing new is written there.'
                      : '<br/>A question bank is needed for that, so one gets created too.';
    }
    return '<div class="ready-turn"><div class="ready-line">'+line+'</div></div>';
  }

  function passageBody(live){
    var head=runIntro()+'Review the content and make any adjustments.';
    if(!live){
      return head+'<div class="cbox done-box"><b>'+S.sents.length+' sentences</b> · '+
        esc(S.sents.map(function(x){return x.w.map(function(p){return p[0];}).join('');}).join(''))+'</div>';
    }
    var chars=S.sents.reduce(function(n,x){ return n+x.w.map(function(q){return q[0];}).join('').length; },0);
    var nameFld='<div class="fld"><span class="flbl">Project name</span>'+
      '<input class="ftext" id="cfName" type="text" value="'+esc(S.pname||S.topic||'')+'" aria-label="Project name"></div>';
    var counter='<div class="wcount'+(chars>S.wlimit?' over':'')+'">'+chars+' / '+S.wlimit+'</div>';
    var body = editing
      ? '<div class="cbox"><span class="clbl">One sentence per line</span>'+
        '<textarea id="txArea" class="txarea">'+esc(S.sents.map(function(x){return x.w.map(function(p){return p[0];}).join('');}).join('\n'))+'</textarea>'+
        '<div class="more-note">Pinyin is regenerated for any line you change.</div></div>'
      : '<div class="cbox"><span class="clbl">Article Content</span>'+S.sents.map(function(x,i){
          return '<div class="srow">'+
            (x.edited
              ? '<div class="rline"><span class="wd"><span class="hz">'+esc(x.w.map(function(p){return p[0];}).join(''))+'</span></span></div>'+
                '<div class="rtr" style="color:var(--amber)">Pinyin regenerates on save</div>'
              : rubyLine(x.w)+'<div class="rtr">'+esc(x.t)+'</div>')+
            '<button class="srow-x" data-dels="'+i+'" aria-label="Remove this sentence"><span class="material-icons-round">close</span></button></div>';
        }).join('')+'</div>';
    if(!live) return head+nameFld.replace('<input','<input disabled')+body+counter;
    return head+nameFld+body+counter+'<div class="turn-acts">'+
      '<button class="qopt" data-txedit="1">'+(editing?'Done editing':'Edit')+'</button>'+
      '<button class="btnp sm-act" data-go="tps">Looks right</button></div>';
  }

  /* Building a Project the way the product builds one: settings, then the
     points to teach, and only then the text —— the text is written FOR those
     points, it is not mined for them afterwards. */
  /* What the teacher last typed, kept outside the snapshot on purpose: Back
     undoes the answer, but the field should still show it so they can adjust
     rather than retype. S.topic stays the authoritative answer. */
  var DRAFT={ topic:'', std:'HSK', lvl:'Level 1', tgt:TARGET_LANGS[0], nat:NATIVE_LANGS[0],
              ctype:'Article', wlimit:150, pasted:'' };

  /* Which of the three ways the text comes into being —— the left rail of the
     real Generate Content step, asked on its own because it changes what the
     next message contains. */
  function genBody(live){
    var head='How should the content come about? <span class="qhint">Its own step in the product ——'+
      ' it decides whether we write it or work from yours.</span>';
    if(!live) return head;
    return head+'<span class="qopts">'+GEN_MODES.map(function(m){
      return '<button class="qopt gen-'+m[0]+'" data-gen="'+m[0]+'">'+esc(m[1])+
        '<span class="sub">'+esc(m[2])+'</span>'+
        (m[3]?'<span class="sub warn">'+esc(m[3])+'</span>':'')+'</button>'; }).join('')+'</span>';
  }

  /* Course Settings —— four fields, one message, same as the real step 1 */
  function courseBody(live){
    var head='Course settings. <span class="qhint">The standard, the level, and which languages this is between.</span>';
    var sel=function(id,lbl,list,cur){
      return '<div class="fld"><span class="flbl">'+lbl+'</span><span class="numfield dt"><select id="'+id+'">'+
        list.map(function(v){ return '<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>'; }).join('')+
        '</select></span></div>';
    };
    if(!live){
      return head+'<div class="cbox done-box"><b style="font-size:13.5px">'+
        esc([S.std,S.lvl,S.tgt,S.nat].filter(Boolean).join(' · '))+'</b></div>';
    }
    return head+'<div class="cbox"><div class="fgrid">'+
      sel('cfStd','Test Type',STANDARDS,S.std||DRAFT.std)+
      sel('cfLvl','Level',LEVELS,S.lvl||DRAFT.lvl)+
      sel('cfTgt','Target Language',TARGET_LANGS,S.tgt||DRAFT.tgt)+
      sel('cfNat','Student’s Native Language',NATIVE_LANGS,S.nat||DRAFT.nat)+
      '</div></div><div class="turn-acts"><button class="btnp sm-act" data-coursego="1">Save &amp; continue</button></div>';
  }

  function tpChips(live){
    return '<div class="tps">'+S.tps.map(function(t,i){
      var ty=TPT[t.ty];
      return '<span class="tp">'+esc(t.w)+'<span class="ty '+ty.c+'">'+ty.l+'</span>'+
        (live?'<button class="x" data-del="'+i+'" aria-label="Remove '+esc(t.w)+'"><span class="material-icons-round" style="font-size:14px">close</span></button>':'')+
        '</span>'; }).join('')+'</div>';
  }
  function tpAdder(){
    return '<div class="tp-add"><input id="tpNew" placeholder="Type a word and press Enter" />'+
      '<select id="tpNewTy">'+Object.keys(TPT).map(function(k){ return '<option value="'+k+'">'+TPT[k].l+'</option>'; }).join('')+'</select>'+
      '<button class="qopt" data-tpadd="1">Add</button></div>';
  }

  /* Generate Content —— step 2. Create and Revise share Content Type, Word
     Limit and Teaching Points; they differ only in what they are given to work
     from. Summary has none of those —— it just takes the file. */
  function provideBlock(withTabs){
    var img=S.provide==='image';
    var out='';
    if(withTabs){
      out+='<div class="ptabs">'+
        '<button class="'+(img?'on':'')+'" data-provide="image"><span class="material-icons-round">image</span>Upload Image</button>'+
        '<button class="'+(img?'':'on')+'" data-provide="text"><span class="material-icons-round">edit_note</span>Paste Text</button>'+
      '</div>';
    }
    if(img){
      out+='<div class="drop" data-drop="1" role="button" tabindex="0">'+
        '<span class="material-icons-round">add_photo_alternate</span>'+
        '<span>Drop or click to upload images (PNG, JPEG, max 10)</span></div>';
      if(S.imgs) out+='<div class="files">'+Array.apply(null,{length:S.imgs}).map(function(_,k){
        return '<span class="file"><span class="material-icons-round">image</span>page-'+(k+1)+'.jpg'+
          '<button data-rmimg="'+k+'" aria-label="Remove"><span class="material-icons-round">close</span></button></span>';
      }).join('')+'</div>';
    } else {
      out+='<textarea id="cfPaste" class="txarea" placeholder="Paste the article here…">'+esc(S.pasted||DRAFT.pasted)+'</textarea>';
    }
    return out;
  }
  function ctypeBlock(n){
    return '<span class="clbl">'+n+' · Content type</span><div class="ctypes">'+CONTENT_TYPES.map(function(c){
      return '<button class="qopt'+((S.ctype||DRAFT.ctype)===c?' go':'')+'" data-ctype="'+esc(c)+'">'+esc(c)+'</button>';
    }).join('')+'</div>';
  }
  function wlimitBlock(n){
    return '<div class="wl"><span class="clbl">'+n+' · Word limit</span>'+
      '<div class="wlrow"><span class="wlmin">100</span>'+
      '<input id="cfWl" type="range" min="100" max="800" step="50" value="'+(S.wlimit||DRAFT.wlimit)+'">'+
      '<span class="wlmax">800</span></div><div class="wlnow" id="cfWlNow">'+(S.wlimit||DRAFT.wlimit)+'</div></div>';
  }
  function tpBlock(n){
    return '<div class="fld"><span class="flbl">'+n+' · Teaching points <em>(optional)</em></span>'+
      (S.tps.length?tpChips(true):'')+tpAdder()+'</div>';
  }

  function makeBody(live){
    var m=S.gen;
    var head = m==='create'
      ? 'What should it be? <span class="qhint">Teaching points are optional —— the content gets written around them when you give any.</span>'
      : m==='revise'
        ? 'Give us the article. <span class="qhint">Images or text. We rewrite it to '+esc(S.lvl||'their level')+' —— takes about 90 seconds.</span>'
        : 'Upload or paste your content. <span class="qhint">It gets used as it is —— nothing is rewritten, and there is nothing to set.</span>';
    if(!live){
      var said = m==='create' ? [S.ctype, S.wlimit+' words', S.topic].filter(Boolean).join(' · ')
        : (S.imgs ? S.imgs+' image'+(S.imgs===1?'':'s') : (S.pasted||'').slice(0,50)+'…');
      return head+'<div class="cbox done-box"><b style="font-size:13.5px">'+esc(said)+'</b></div>';
    }
    var body='<div class="cbox">';
    if(m==='summary'){
      body+=provideBlock(false);
    } else if(m==='revise'){
      body+='<span class="clbl">1 · Provide your article</span>'+provideBlock(true)+
            ctypeBlock(2)+wlimitBlock(3)+tpBlock(4);
    } else {
      body+=ctypeBlock(1)+wlimitBlock(2)+
        '<div class="fld"><span class="flbl">3 · Topic</span>'+
        '<input class="ftext" id="cfTopic" type="text" maxlength="100" value="'+esc(S.topic||DRAFT.topic)+
        '" placeholder="e.g. 全球暖化" aria-label="Topic"></div>'+tpBlock(4);
    }
    body+='</div>';
    var acts='<button class="qopt" data-genreset="1">Reset</button>';
    if(m==='revise')  acts+='<button class="qopt" data-skipreview="1">Skip to review</button>';
    if(m==='summary') acts+='<button class="qopt" data-skiptext="1">Skip to enter text manually</button>';
    if(m==='create')  acts+='<button class="qopt" data-tpsuggest="1">Suggest teaching points</button>';
    return head+body+'<div class="turn-acts">'+acts+
      '<button class="btnp sm-act" data-makego="1">'+(m==='summary'?'Use this':'Generate content')+'</button></div>';
  }


  function materialBody(live){
    var proj=S.proj||{};
    var tps=(proj.tps||[]).map(function(t){ return {w:t[0], ty:t[1]}; });
    var sents=textOf(proj.topic||S.topic).sents;
    var head=runIntro();
    var body='<div class="cbox"><span class="clbl">Article Content</span>'+
      sents.map(function(x){ return rubyLine(x.w)+'<div class="rtr">'+esc(x.t)+'</div>'; }).join('')+'</div>'+
      // same rule as the bank —— only shown when a chosen practice draws on it
      (needsTp(S.ep)
        ? '<div class="cbox"><span class="clbl">Teaching points · '+tps.length+'</span><div class="tps">'+
          tps.map(function(t){ var ty=TPT[t.ty];
            return '<span class="tp" style="font-size:12.5px;padding:3px 9px">'+esc(t.w)+
              '<span class="ty '+ty.c+'">'+ty.l+'</span></span>'; }).join('')+'</div></div>'
        : '')+
      // only worth showing when one of the chosen practices actually draws on it
      (needsBank(S.ep)
        ? '<div class="cbox"><span class="clbl">Question bank</span>'+
          (proj.bank? '<b style="font-size:13.5px">'+esc(proj.bank)+'</b>' +
                      '<div class="more-note">Multiple Choice · Comprehension / Fill in blank / Pinyin / Meaning</div>'
                    : '<span class="chip-empty">none yet</span>')+'</div>'
        : '');
    if(!live) return head+body;
    return head+body+'<div class="turn-acts"><span class="n">Need any changes?</span>'+
      '<button class="qopt" data-go="amend">Yes, let me change it</button>'+
      '<button class="btnp sm-act" data-go="noamend">No, carry on</button></div>';
  }

  /* ============ Mirroring 的設定，逐題問 ============
     選項取自 dahua-dash：SPEED_OPTIONS / PINYIN_PREFERENCES /
     TRANSLATION_PREFERENCES / VOICE_OPTIONS。 =========================== */
  var MIR_STEPS=['sentences','audiomode','englishfirst','pinyin','translation','autopass','speed','voice'];
  function nextMir(){
    var m=S.mir;
    if(!m.sentencesDone)      return 'sentences';
    if(m.audioMode===null)    return 'audiomode';
    if(m.englishFirst===null) return 'englishfirst';
    if(m.pinyin===null)       return 'pinyin';
    if(m.translation===null)  return 'translation';
    if(m.autoPass===null)     return 'autopass';
    if(m.speed===null)        return 'speed';
    if(m.voice===null)        return 'voice';
    return null;
  }
  /* one question, one answer */
  function askOne(name, head, opts, chosen){
    return function(live){
      if(!live) return head;
      return head+'<span class="qopts">'+opts.map(function(o){
        return '<button class="qopt" data-set="'+name+'" data-val="'+esc(String(o[0]))+'">'+esc(o[1])+'</button>';
      }).join('')+'</span>';
    };
  }

  function sentencesBody(live){
    var head='These become the sentences students record. Do you want to change how they are split, ordered, or drop any?';
    var list='<div class="cbox"><span class="clbl">Current sentences · '+S.sents.length+'</span>'+
      S.sents.map(function(x,i){
        var txt=x.w.map(function(p){return p[0];}).join('');
        return '<div class="srow2"><span class="sno">'+(i+1)+'</span><span class="stx">'+esc(txt)+'</span>'+
          (live?'<span class="sacts">'+
            '<button class="sbtn" data-mv="'+i+'" data-dir="-1" aria-label="Move up"'+(i?'':' disabled')+'>↑</button>'+
            '<button class="sbtn" data-mv="'+i+'" data-dir="1" aria-label="Move down"'+(i<S.sents.length-1?'':' disabled')+'>↓</button>'+
            '<button class="sbtn" data-split="'+i+'" aria-label="Split here" title="Split at the comma">⁄</button>'+
            '<button class="sbtn del" data-dels="'+i+'" aria-label="Delete">✕</button></span>':'')+
          '</div>';
      }).join('')+'</div>';
    if(!live) return head+list;
    return head+list+'<div class="turn-acts"><button class="btnp sm-act" data-go="sentdone">They’re fine</button></div>';
  }

  function audiomodeBody(live){
    var head='Should students be able to turn the on-screen support off while they practise? <span class="qhint">Audio Mode lets them control display support while listening and practicing.</span>';
    if(!live) return head;
    return head+'<span class="qopts">'+
      '<button class="qopt" data-set="audioMode" data-val="off">No, keep it as I set it</button>'+
      '<button class="qopt" data-set="audioMode" data-val="on">Yes, let them control it</button></span>';
  }

  function englishfirstBody(live){
    var head='Should they hear the English meaning first? <span class="qhint">Students hear the English meaning, then repeat the Chinese sentence.</span>';
    if(!live) return head;
    return head+'<span class="qopts">'+
      '<button class="qopt" data-set="englishFirst" data-val="on">Yes, English first</button>'+
      '<button class="qopt" data-set="englishFirst" data-val="off">No, Chinese only</button></span>';
  }

  var pinyinBody=askOne('pinyin','Should they see the pinyin?',
    [['PINYIN','Show it'],['NO_PINYIN','Hide it'],['STUDENT_CHOICE','Let them choose']]);
