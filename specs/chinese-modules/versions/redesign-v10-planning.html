<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redesign v9 — Teacher · Planning (DAHUA AI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
<link rel="stylesheet" href="assets-v10/teacher-shell.css" />
<style>
  .body{ display:flex; align-items:stretch; }

  /* ---------- history ---------- */
  .hist{ width:262px; flex:none; background:#fff; border-right:1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:76px; height:calc(100vh - 76px); }
  .hist.off{ display:none; }
  .hist-h{ padding:14px 13px 8px; }
  .hist-new{ width:100%; display:flex; align-items:center; justify-content:center; gap:6px; min-height:38px;
    border:1px dashed var(--line); border-radius:10px; background:#fff; cursor:pointer; font:inherit;
    font-size:13px; font-weight:700; color:var(--emerald-dd); transition:.14s; }
  .hist-new .material-icons-round{ font-size:17px; }
  .hist-new:hover{ border-style:solid; border-color:var(--emerald-ring); background:var(--emerald-l); }
  .hist-l{ flex:1; overflow-y:auto; padding:2px 9px 18px; }
  .hist-g{ font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    color:var(--faint); padding:13px 7px 5px; }
  .hist-i{ display:block; width:100%; text-align:left; border:none; background:none; cursor:pointer;
    font:inherit; padding:8px 9px; border-radius:9px; transition:.14s; }
  .hist-i b{ display:block; font-size:13px; font-weight:700; color:var(--ink); line-height:1.4;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-i span{ display:block; font-size:11.5px; font-weight:600; color:var(--muted); margin-top:1px; }
  .hist-i:hover{ background:#f4f7fb; }
  .hist-i.on{ background:var(--emerald-l); }
  .hist-i.on b{ color:var(--emerald-dd); }
  .hist-i.on span{ color:var(--emerald-d); }
  .histtoggle{ display:inline-grid; }

  .canvas{
    flex:1; min-width:0;
    min-height:calc(100vh - 76px); padding:34px 30px 70px;
    background:
      radial-gradient(circle at 1px 1px, #dde4ec 1px, transparent 0) 0 0 / 22px 22px,
      var(--bg);
    display:flex; flex-direction:column; align-items:center;
  }
  .canvas-in{ width:min(720px,100%); }
  .canvas.wide .canvas-in{ width:min(880px,100%); }

  /* ---------- prompt ---------- */
  .prompt{ background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:var(--sh-lg); overflow:hidden; }
  .prompt-h{ display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line-2); }
  .prompt-h h1{ font-size:16px; font-weight:800; color:var(--ink); letter-spacing:-.2px; }
  .ai-badge{ margin-left:auto; font-size:10.5px; font-weight:800; letter-spacing:.6px; color:var(--emerald-d);
    background:var(--emerald-l); border:1px solid var(--emerald-l2); border-radius:7px; padding:3px 8px; }
  .prompt-b{ padding:16px 20px 6px; }
  .prompt-field{ background:#f8fafc; border:1px solid transparent; border-radius:12px; padding:14px 16px; transition:.16s; }
  .prompt-field:focus-within{ background:#fff; border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l2); }
  .prompt-field textarea{ width:100%; min-height:92px; border:none; background:none; resize:none; font:inherit;
    font-size:16px; font-weight:600; color:var(--ink); line-height:1.55; outline:none; }
  .prompt-field textarea::placeholder{ color:#9fb0c2; font-weight:500; }
  .prompt-f{ display:flex; align-items:center; gap:12px; padding:12px 20px 14px; }
  .prompt-f .hint{ font-size:11.5px; font-weight:600; color:var(--faint); }
  .make{ margin-left:auto; }
  .make:disabled{ background:#e2e8f0; color:#94a3b8; box-shadow:none; cursor:not-allowed; transform:none; filter:none; }
  .kbd{ font-size:11px; font-weight:800; opacity:.75; }

  .orline{ display:flex; align-items:center; gap:14px; margin:26px 0 16px; color:var(--faint);
    font-size:11.5px; font-weight:800; letter-spacing:.4px; }
  .orline::before,.orline::after{ content:""; height:1px; background:var(--line); flex:1; }

  /* ---------- entry blocks ---------- */
  .block{ background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:14px; }
  .block-h{ display:flex; align-items:center; gap:9px; padding:13px 18px; border-bottom:1px solid var(--line-2); }
  .block-h b{ font-size:13.5px; font-weight:800; color:var(--ink); }
  .block-h span.note{ font-size:12px; font-weight:600; color:var(--muted); }
  .block-h .material-icons-round{ font-size:18px; color:var(--faint); }

  /* flagship */
  .flag{ display:flex; align-items:center; gap:14px; width:100%; padding:16px 18px; border:none; background:none;
    cursor:pointer; text-align:left; transition:.14s; }
  .flag:hover{ background:#f7fbf9; }
  .flag .fi{ width:44px; height:44px; border-radius:13px; flex:none; display:grid; place-items:center; color:#fff;
    background:linear-gradient(145deg,#10b981,#047857); box-shadow:0 8px 18px -9px rgba(5,150,105,.8); }
  .flag .fi .material-icons-round{ font-size:23px; }
  .flag .ft{ min-width:0; flex:1; }
  .flag .ft b{ display:block; font-size:15px; font-weight:800; color:var(--ink); }
  .flag .ft span{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-top:2px; }
  .flag .chev{ color:var(--faint); flex:none; }
  .chain{ display:flex; align-items:center; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .chain i{ font-style:normal; font-size:10.5px; font-weight:800; letter-spacing:.3px; color:var(--emerald-d);
    background:var(--emerald-l); border-radius:5px; padding:2px 7px; }
  .chain u{ text-decoration:none; color:var(--faint); font-size:11px; }

  /* sample grid */
  .sgrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:14px 18px 18px; }
  .sample{ display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid var(--line);
    border-radius:11px; background:#fff; cursor:pointer; font:inherit; text-align:left; transition:.14s; }
  .sample:hover:not(:disabled){ border-color:#cbd5e1; box-shadow:var(--sh-sm); transform:translateY(-1px); }
  .sample:disabled{ opacity:.42; cursor:not-allowed; }
  .sample .si{ width:30px; height:30px; border-radius:8px; flex:none; display:grid; place-items:center; }
  .sample .si .material-icons-round{ font-size:17px; }
  .sample .st{ min-width:0; }
  .sample .st b{ display:block; font-size:13px; font-weight:700; color:var(--ink); line-height:1.25; }
  .sample .st span{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; margin-top:1px; }

  .needs{ padding:0 18px 14px; font-size:11.5px; font-weight:700; color:var(--amber); display:none; }
  .needs.on{ display:block; }

  /* two-up rows */
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:14px 18px 18px; }
  .opt{ display:flex; align-items:flex-start; gap:11px; padding:13px 14px; border:1px solid var(--line);
    border-radius:12px; background:#fff; cursor:pointer; font:inherit; text-align:left; transition:.14s; }
  .opt:hover:not(:disabled){ border-color:#cbd5e1; box-shadow:var(--sh-sm); transform:translateY(-1px); }
  .opt:disabled{ opacity:.42; cursor:not-allowed; }
  .opt .oi{ width:32px; height:32px; border-radius:9px; flex:none; display:grid; place-items:center; }
  .opt .oi .material-icons-round{ font-size:18px; }
  .opt .ot b{ display:block; font-size:13.5px; font-weight:800; color:var(--ink); }
  .opt .ot span{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; margin-top:2px; line-height:1.45; }
  .block.solo .duo{ grid-template-columns:1fr; }

  /* recent */
  .recent{ margin-top:26px; }
  .recent .rh{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .recent .rh b{ font-size:13px; font-weight:800; color:var(--slate); }
  .recent .rh span{ font-size:12px; color:var(--faint); font-weight:600; }
  .rgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .rcard{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 13px; cursor:pointer;
    transition:.15s; text-align:left; }
  .rcard:hover{ box-shadow:var(--sh-md); transform:translateY(-1px); }
  .rcard b{ display:block; font-size:13px; font-weight:700; color:var(--ink); line-height:1.3; }
  .rcard .rm{ margin-top:7px; display:flex; align-items:center; gap:6px; }
  .rcard .rt{ font-size:11.5px; color:var(--faint); font-weight:600; }

  /* ---------- flow screens ---------- */
  .screen{ display:none; }
  .screen.on{ display:block; }
  .fbar{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .fbar .back{ border:1px solid var(--line); background:#fff; border-radius:10px; width:36px; height:36px;
    cursor:pointer; display:grid; place-items:center; color:var(--slate-2); flex:none; }
  .fbar .back:hover{ border-color:#cbd5e1; }
  .fbar .fq{ min-width:0; flex:1; }
  .fbar .fq b{ display:block; font-size:15px; font-weight:800; color:var(--ink); letter-spacing:-.2px; }
  .fbar .fq span{ font-size:12.5px; color:var(--muted); font-weight:600; }

  /* stage strip: which segment of the chain this path covers */
  .stages{ display:flex; align-items:center; gap:6px; padding:11px 16px; background:#fff; border:1px solid var(--line);
    border-radius:12px; margin-bottom:14px; flex-wrap:wrap; }
  .stages .lb{ font-size:10.5px; font-weight:800; letter-spacing:.5px; color:var(--faint); margin-right:3px; }
  .stg{ font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:999px; background:#eef2f7; color:var(--faint); }
  .stg.on{ background:var(--emerald-l); color:var(--emerald-d); }
  .stages .arrow{ color:#cbd5e1; font-size:14px; }

  /* teaching point checkpoint */
  .panel-w{ background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:var(--sh-md); overflow:hidden; }
  .pw-h{ display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line-2); }
  .pw-h h3{ font-size:14.5px; font-weight:800; color:var(--ink); }
  .pw-h .badge{ font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:999px;
    background:var(--emerald-l); color:var(--emerald-d); }
  .pw-b{ padding:16px 18px; }
  .pw-f{ display:flex; align-items:center; gap:12px; padding:14px 18px; border-top:1px solid var(--line-2);
    background:#fcfdfe; flex-wrap:wrap; }
  .pw-f .sum{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .pw-f .acts{ margin-left:auto; display:flex; gap:9px; }

  .tps{ display:flex; flex-wrap:wrap; gap:7px; }
  .tp{ display:inline-flex; align-items:center; gap:6px; padding:5px 8px 5px 11px; border-radius:9px;
    border:1px solid var(--line); background:#fff; font-size:13.5px; font-weight:700; color:var(--ink); }
  .tp .ty{ font-size:10px; font-weight:800; padding:1px 6px; border-radius:5px; letter-spacing:.2px; }
  .tp .ty.gray{ background:#eef2f7; color:var(--muted); }
  .tp .ty.purple{ background:var(--mc-bg); color:var(--mc); }
  .tp .ty.blue{ background:var(--qa-bg); color:var(--qa); }
  .tp .x{ border:none; background:none; cursor:pointer; color:var(--faint); display:grid; place-items:center;
    width:18px; height:18px; border-radius:5px; padding:0; }
  .tp .x:hover{ background:var(--rose-bg); color:var(--rose); }
  .tp.miss{ border-style:dashed; border-color:#fbbf24; background:#fffbeb; }
  .tp-add{ display:flex; gap:8px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line-2); }
  .tp-add input{ flex:1; height:36px; border:1px solid var(--line); border-radius:9px; padding:0 12px; font:inherit;
    font-size:13.5px; font-weight:600; }
  .tp-add input:focus{ outline:none; border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l2); }
  .tp-add select{ height:36px; border:1px solid var(--line); border-radius:9px; padding:0 10px; font:inherit;
    font-size:12.5px; font-weight:700; color:var(--slate); background:#fff; }

  /* preview rows */
  .stage-t{ display:flex; align-items:center; gap:9px; padding:12px 18px; background:#fbfcfe;
    border-bottom:1px solid var(--line-2); }
  .stage-t .n{ width:20px; height:20px; border-radius:50%; background:var(--emerald); color:#fff; font-size:11px;
    font-weight:800; display:grid; place-items:center; flex:none; }
  .stage-t b{ font-size:12.5px; font-weight:800; color:var(--slate); letter-spacing:.2px; }
  .prow{ display:flex; align-items:flex-start; gap:13px; padding:15px 18px; flex-wrap:wrap; }
  .prow + .prow{ border-top:1px solid var(--line-2); }
  .prow.off{ opacity:.48; }
  .prow .pt2{ min-width:0; flex:1; }
  .prow .pt2 b{ display:block; font-size:14px; font-weight:800; color:var(--ink); }
  .prow .pt2 .pd{ font-size:12.5px; color:var(--muted); font-weight:600; margin-top:3px; }
  .prow .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .prow .ped{ flex:none; }
  .sw{ appearance:none; -webkit-appearance:none; width:36px; height:20px; border-radius:999px; background:#cbd5e1;
    position:relative; cursor:pointer; transition:.16s; flex:none; border:none; }
  .sw::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:#fff; transition:.16s; }
  .sw:checked{ background:var(--emerald); }
  .sw:checked::after{ transform:translateX(16px); }

  /* expandable row body —— the actual content that will be created */
  .prow{ position:relative; }
  .prow-x{ border:1px solid var(--line); background:#fff; border-radius:8px; width:28px; height:28px; cursor:pointer;
    display:grid; place-items:center; color:var(--faint); flex:none; transition:.14s; margin-left:8px; }
  .prow-x:hover{ border-color:#cbd5e1; color:var(--slate-2); }
  .prow-x .material-icons-round{ font-size:18px; transition:transform .18s; }
  .prow.open .prow-x .material-icons-round{ transform:rotate(180deg); }
  .prow-body{ display:none; width:100%; padding:13px 0 0 53px; }
  .prow.open .prow-body{ display:block; }
  .prow.off .prow-body{ display:none; }
  .cbox{ border:1px solid var(--line); border-radius:12px; background:#fbfdff; padding:14px 16px; margin-top:14px; }
  .cbox + .cbox{ margin-top:10px; }
  .cbox .clbl{ font-size:10.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--faint);
    display:block; margin-bottom:9px; }

  /* per-word pinyin, same device as the slides page */
  .rline{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:1px 3px; }
  .rline + .rtr{ margin-top:2px; }
  .rtr{ font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:10px; }
  .rtr:last-child{ margin-bottom:0; }
  .wd{ display:flex; flex-direction:column; align-items:center; }
  .wd .py{ font-size:9.5px; font-weight:600; color:var(--emerald-d); line-height:1.4; height:14px; }
  .wd .hz{ font-size:17px; font-weight:600; color:var(--ink); line-height:1.45; letter-spacing:.5px; }

  .wcards{ display:flex; gap:8px; flex-wrap:wrap; }
  .wcard{ border:1px solid var(--line); border-radius:9px; background:#fff; padding:8px 11px; text-align:center; min-width:78px; }
  .wcard .py{ font-size:10px; font-weight:600; color:var(--emerald-d); }
  .wcard .hz{ font-size:19px; font-weight:600; color:var(--ink); line-height:1.3; }
  .wcard .en{ font-size:10.5px; font-weight:600; color:var(--muted); margin-top:2px; }

  .qitem{ font-size:13px; font-weight:600; color:var(--slate); }
  .qitem + .qitem{ margin-top:11px; padding-top:11px; border-top:1px solid var(--line-2); }
  .qitem .qq{ font-weight:700; color:var(--ink); }
  .qitem .qo{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .qitem .qo span{ font-size:11.5px; font-weight:700; color:var(--muted); background:#fff; border:1px solid var(--line);
    padding:2px 9px; border-radius:6px; }
  .qitem .qo span.right{ color:var(--emerald-d); border-color:var(--emerald-l2); background:var(--emerald-l); }

  .scram{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .scram b{ font-size:16px; font-weight:600; color:var(--ink); background:#fff; border:1px solid var(--line);
    border-radius:7px; padding:4px 10px; letter-spacing:.5px; }
  .scram .arrow{ color:var(--faint); font-size:13px; font-weight:700; }
  .scram .ans{ font-size:12px; font-weight:700; color:var(--emerald-d); }

  /* ---------- turns that carry a whole step ---------- */
  /* every step closes the same way —— hairline, then actions; primary on the right */
  .turn-acts,.qconfirm{ display:flex; align-items:center; justify-content:flex-end; gap:9px; flex-wrap:wrap;
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line-2); }
  .turn-acts .n,.qconfirm .n{ font-size:14px; font-weight:600; color:var(--ink);
    line-height:1.6; margin-right:auto; }
  .btnp.sm-act{ padding:9px 15px; font-size:13px; line-height:1.35; border-radius:10px;
    border:1px solid transparent; }
  .turn-acts .assign{ font-size:12.5px; font-weight:700; color:var(--slate-2); display:flex; align-items:center; gap:7px; }
  .done-box{ background:#fbfcfe; }
  .done-box b{ display:block; font-size:12.5px; color:var(--slate); margin-bottom:5px; }
  .pv-box{ padding:0; overflow:hidden; }
  .pv-box .covers{ border-radius:0; }
  .pv-box .prow{ padding:14px 15px; }
  .pv-box .prow-body{ padding-left:50px; }
  .done-turn .material-icons-round{ font-size:21px; color:var(--emerald); vertical-align:-4px; margin-right:7px; }
  .done-turn b{ font-size:15px; font-weight:800; color:var(--ink); }
  .done-turn > span:not(.turn-acts){ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-top:6px; }
  .done-turn .turn-acts .qopt{ text-decoration:none; }
  .msg .bub{ flex:1; min-width:0; }
  .msg.sys .bub{ max-width:100%; }

  /* ---------- chat ---------- */
  .chat{ min-height:300px; padding-bottom:4px; }
  .composer{ display:flex; align-items:flex-end; gap:10px; margin-top:14px; padding:10px 12px;
    background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--sh-sm); }
  .composer:focus-within{ border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l2); }
  .composer textarea{ flex:1; border:none; background:none; resize:none; font:inherit; font-size:14.5px;
    font-weight:600; color:var(--ink); line-height:1.5; outline:none; max-height:120px; padding:7px 4px; }
  .composer textarea::placeholder{ color:#9fb0c2; font-weight:500; }
  .composer .send{ width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; flex:none;
    display:grid; place-items:center; color:#fff; background:linear-gradient(145deg,#10b981,#059669); transition:.14s; }
  .composer .send:hover:not(:disabled){ filter:brightness(1.06); }
  .composer .send:disabled{ background:#e2e8f0; color:#94a3b8; cursor:not-allowed; }
  .composer .send .material-icons-round{ font-size:19px; }

  .qhint{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-top:5px; }
  .qopt.multi{ padding-left:11px; }
  .qopt.multi.on{ border-color:var(--emerald); background:var(--emerald-l); color:var(--emerald-dd); }
  .qopt.multi .material-icons-round{ font-size:16px; margin-right:5px; vertical-align:-3px; color:var(--faint); }
  .qopt.multi.on .material-icons-round{ color:var(--emerald); }
  .qopt.go{ border-color:var(--emerald); color:var(--emerald-dd); background:var(--emerald-l); }
  .qopt.go:hover{ background:var(--emerald-l2); }
  .ready-turn{ border:1px solid var(--emerald-l2); background:#f7fdfa; border-radius:12px; padding:13px 15px; }
  .ready-turn .stages{ margin:0 0 11px; background:none; border:none; padding:0; }

  /* ---------- endpoint picker + funnel ---------- */
  .sample.on{ border-color:var(--emerald); box-shadow:inset 0 0 0 1px var(--emerald); background:#f7fdfa; }
  .sample .tick{ margin-left:auto; color:var(--emerald); flex:none; opacity:0; }
  .sample.on .tick{ opacity:1; }
  .sample .tick .material-icons-round{ font-size:18px; }
  .ep-foot{ display:flex; align-items:center; gap:12px; padding:13px 18px; border-top:1px solid var(--line-2); background:#fcfdfe; }
  .ep-sum{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .ep-foot .btnp{ margin-left:auto; }
  .ep-foot .btnp:disabled{ background:#e2e8f0; color:#94a3b8; box-shadow:none; cursor:not-allowed; transform:none; filter:none; }

  var UNSUPPORTED=[

  function parse(q){
    var out={ep:[], src:null, cls:null, ambiguous:null, unsupported:null};
    var m=q.match(/([0-9]+[A-Za-z])\s*班?/); if(m) out.cls=m[1].toUpperCase();
    UNSUPPORTED.forEach(function(u){ if(!out.unsupported && u.re.test(q)) out.unsupported=u; });
    Object.keys(AMBIGUOUS).forEach(function(k){
      if(!out.ambiguous && AMBIGUOUS[k].re.test(q) && !/單字|单字|生詞|生词|句子/.test(q)) out.ambiguous=k;
    });
    // the endpoint names are printed on the options, so they get typed back at us
    Object.keys(EP).forEach(function(k){
      var n=EP[k].t.replace(/&amp;/g,'&');
      if(new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(q) && out.ep.indexOf(k)<0) out.ep.push(k);
    });
    if(/單字|单字|生詞|生词|詞卡|词卡/.test(q) && /念|唸|背|記/.test(q)) out.ep.push('VOCABULARY');
    if(/句型|語序|语序|重組|重组/.test(q)) out.ep.push('SENTENCE_SCRAMBLE');
    if(/選擇題|选择题|出題|出题|幾題|几题|十題|十题/.test(q)) out.ep.push('MULTIPLE_CHOICE');
    if(/問答|问答|口說|口试|口試/.test(q)) out.ep.push('QA');
    if(/講義|讲义|handout/i.test(q)) out.ep.push('HANDOUT');
    if(/投影片|簡報|slide/i.test(q)) out.ep.push('SLIDE');
    if(/從頭|从头|完整|一口氣|一口气|全部做完|整課|整课/.test(q))
      out.ep=['VOCABULARY','SENTENCE_SCRAMBLE','MULTIPLE_CHOICE'];
    if(/寫一課|写一课|新課文|新课文/.test(q) && !out.ep.length) out.ep=['PROJECT_ONLY'];

    var hit=null;
    PROJECTS.forEach(function(pj){ if(!hit && q.indexOf(pj.topic)>-1) hit=pj; });
    if(/新建|新的|重新寫|重新写|還沒有|还没有|沒有課文|没有课文/.test(q)) out.src={kind:'write'};
    else if(hit) out.src={kind:'existing', sk:hit.sk};
    return out;
  }

  /* ================= what a run produces ================= */
  function tpsCoveredBy(type, tps, cat){
    var c=PT[type].covers;
    if(c==='byCat')   c=MC_CAT[cat||'comprehension'].covers;
    if(c==='byQaCat') c=QA_CAT[cat||'shortAnswer'].covers;
    if(c==='all') return tps.map(function(t){return t.w;});
    return tps.filter(function(t){ return c.indexOf(t.ty)>-1; }).map(function(t){return t.w;});
  }
  function detailFor(t,tps,cat){
    var w=tps.filter(function(x){return WORDISH.indexOf(x.ty)>-1;}).length;
    var p=tps.filter(function(x){return PATTERNISH.indexOf(x.ty)>-1;}).length;
    if(t==='MIRRORING') return (S.sents.length||6)+' sentences · pinyin shown · pronunciation scored';
    if(t==='VOCABULARY') return w+' cards · audio, pinyin and meaning';
    if(t==='SENTENCE_SCRAMBLE') return (p||1)*3+' sentences · listen, then rearrange';
    if(t==='QA') return 'QA × '+QA_CAT[cat||'shortAnswer'].l+' × 5 · AI asks one follow-up each';
    if(t==='VOCABULARY_MC') return w+' questions · image, pinyin and meaning';
    return 'Multiple Choice × '+MC_CAT[cat||'comprehension'].l+' × 10';
  }
  function srcLabel(t,topic){
    var s=PT[t].src;
    if(s==='text') return 'from the passage';
    if(s==='bank') return 'Bank: '+topic+' — Exit questions';
    return 'from teaching points';
  }

  function composeRows(){
    var existing = S.src && S.src.kind==='existing' && S.src.sk;
    var tps=tpsForPath(), rows=[];
    var topic = existing ? S.proj.topic : S.topic;
    var name  = existing ? S.proj.name  : (S.topic+' — new project');

    if(!existing){
      rows.push({stage:'Project', kind:'text', on:true, open:true,
        n:name, d:tps.length+' teaching points · '+(S.sents.length||6)+' sentences at HSK 1',
        chips:['new'], covers:tps.map(function(t){return t.w;})});
    }
    if(needsBank(S.ep)){
      var hasBank = existing && S.proj.bank;
      rows.push({stage:'Question bank', kind:'bank', on:true,
        n: hasBank ? S.proj.bank : (topic+' — Exit questions'),
        d:'Multiple Choice × Comprehension × 10'+(S.ep.indexOf('QA')>-1?' · QA × Content Base × 5':''),
        chips:[hasBank?'existing bank':'new'], covers:[]});
    }
    if(S.mode==='project' && S.after==='handout'){
      rows.push({stage:'Teaching material', kind:'handout', on:true, ep:'HANDOUT',
        n:topic+' · Handout', d:'A4 · Reading with Pinyin, Full Reading, Translation, Teaching Points',
        chips:['from the Project'], covers:[]});
    }
    S.ep.forEach(function(k){
      var cat = k==='MULTIPLE_CHOICE' ? 'comprehension' : (k==='QA' ? 'shortAnswer' : null);
      rows.push({stage:'Practices', kind:'practice', type:k, cat:cat, on:true,
        n:topic+' · '+PT[k].n, d:detailFor(k,tps,cat),
        chips:[srcLabel(k,topic)], covers:tpsCoveredBy(k,tps,cat)});
    });
    return rows;
  }

  /* ================= the conversation =================

  var pick=[];

  function nextQuestion(){
    if(S.unsupported) return null;
    if(S.askAmb){
      var a=AMBIGUOUS[S.askAmb];
      return {key:'amb', ask:a.ask, opts:a.opts.map(function(o){ return {t:o[1], s:o[2], v:o[0]}; })};
    }

    /* 今天要做什麼呢？ */
    if(!S.mode){
      return {key:'mode', ask:'What are we making today?', opts:[
        {t:'A Project',  s:'a new text with its teaching points', v:'project'},
        {t:'Practices',  s:'from a Project you have, or a new one', v:'practice'},
        {t:'Let me just say it', s:'type it and I’ll work out the rest', v:'say'}
      ]};
    }

    if(S.mode==='project'){
      /* 建立了要做哪些事 */
      if(!S.after){
        return {key:'after', ask:'And what do you want to do with it?', opts:[
          {t:'Just create it', s:'the Project on its own', v:'only'},
          {t:'Make a Handout', s:'a printable A4 worksheet from it', v:'handout'},
          {t:'Make Practices', s:'pick which ones next', v:'practice'}
        ]};
      }
      if(S.after==='practice' && !S.ep.length) return practicesQ();
      return null;
    }

    /* 建立 Practice */
    if(!S.ep.length) return practicesQ();

    /* 從要現有 Project 建立嗎？ */
    if(!S.src){
      return {key:'src', ask:'Build them from a Project you already have?', opts:[
        {t:'Yes', s:'pick one next', v:'yes'},
        {t:'Start a new one', s:'we write the text together', v:'new'}
      ]};
    }
    /* 提供現有 Project 清單 */
    if(S.src.kind==='existing' && !S.src.sk){
      return {key:'pickproj', ask:'Which one?',
        opts:PROJECTS.map(function(p){ return {t:p.name, s:p.level+' · '+(p.bank?'has a question bank':'no question bank yet'), v:p.sk}; })};
    }
    /* 檢查現有 Project 是否滿足所選練習需要的 QB / Teaching Point */
    if(S.src.kind==='existing' && !S.fixed){
      var proj=PROJECTS.filter(function(p){return p.sk===S.src.sk;})[0];
      var need=missingFrom(proj, S.ep);
      if(need.length){
        var who=S.ep.filter(function(k){
          return (need.indexOf('QB')>-1 && EP[k].needs==='bank') || (need.indexOf('TP')>-1 && EP[k].needs==='tp');
        }).map(function(k){return EP[k].t;}).join('、');
        return {key:'fill', ask:'“'+proj.name+'” has no '+missingLabel(need)+' yet, and '+who+' needs '+
          (need.length>1?'them':'it')+'.', hint:'It can be made as part of this run.',
          opts:[{t:'Add '+missingLabel(need), s:'and carry on', v:'fill'}]};
      }
    }
    return null;
  }

  function practicesQ(){

      opts:EP_PRACTICE.map(function(k){ return {t:EP[k].t, s:EP[k].s.replace(/&amp;/g,'&'), v:k}; })};

  /* ---------------- turn bodies ---------------- */
  /* the opening line of a run —— what it is doing and how far it goes */
  function runIntro(){
    if(!S.mode) return '';
    var existing = S.src && S.src.kind==='existing' && S.src.sk;
    var proj = existing ? (PROJECTS.filter(function(p){return p.sk===S.src.sk;})[0]||{}).name : null;
    var made = S.ep.map(function(k){return EP[k].t;});
    if(S.mode==='project' && S.after==='handout') made.unshift('Handout');
    var line = existing
      ? 'Using <b>'+esc(proj)+'</b> · creating <b>'+esc(made.join('、'))+'</b>'
      : (made.length ? 'Writing <b>a new Project</b> · creating <b>'+esc(made.join('、'))+'</b>'
                     : 'Writing <b>a new Project</b>');
    if(needsBank(S.ep)){
      var hasBank = existing && (PROJECTS.filter(function(p){return p.sk===S.src.sk;})[0]||{}).bank;
      line += hasBank ? '<br/>Its question bank already exists, so nothing new is written there.'
                      : '<br/>A question bank is needed for that, so one gets created too.';
    }
    if(S.mode==='project' && S.after==='only') line='Writing <b>a new Project</b> —— nothing else for now.';
    return '<div class="ready-turn"><div class="ready-line">'+line+'</div></div>';
  }

  function passageBody(live){
    var head=runIntro()+'Here’s the passage I wrote —— everything else is built from it, so check it first.';
    if(!live){
      return head+'<div class="cbox done-box"><b>'+S.sents.length+' sentences</b> · '+
        esc(S.sents.map(function(x){return x.w.map(function(p){return p[0];}).join('');}).join(''))+'</div>';
    }
    var body = editing
      ? '<div class="cbox"><span class="clbl">One sentence per line</span>'+
        '<textarea id="txArea" class="txarea">'+esc(S.sents.map(function(x){return x.w.map(function(p){return p[0];}).join('');}).join('\n'))+'</textarea>'+
        '<div class="more-note">Pinyin is regenerated for any line you change.</div></div>'
      : '<div class="cbox">'+S.sents.map(function(x,i){
          return '<div class="srow">'+
            (x.edited
              ? '<div class="rline"><span class="wd"><span class="hz">'+esc(x.w.map(function(p){return p[0];}).join(''))+'</span></span></div>'+
                '<div class="rtr" style="color:var(--amber)">Pinyin regenerates on save</div>'
              : rubyLine(x.w)+'<div class="rtr">'+esc(x.t)+'</div>')+
            '<button class="srow-x" data-dels="'+i+'" aria-label="Remove this sentence"><span class="material-icons-round">close</span></button></div>';
        }).join('')+'</div>';
    return head+body+'<div class="turn-acts">'+
      '<button class="qopt" data-txedit="1">'+(editing?'Done editing':'Edit')+'</button>'+
      '<button class="btnp sm-act" data-go="tps">Looks right</button></div>';
  }

  function tpsBody(live){
    var absent=S.tps.filter(function(t){ return !inPassage(t.w); });
    var head='These are the teaching points I pulled out of it. <b>At least one is required</b> —— Vocabulary, Sentence Scramble and QA are all built from them.';
    var chips='<div class="tps">'+S.tps.map(function(t,i){
      var ty=TPT[t.ty], gone=!inPassage(t.w);
      return '<span class="tp'+(gone?' miss':'')+'">'+esc(t.w)+'<span class="ty '+ty.c+'">'+ty.l+'</span>'+
        (live?'<button class="x" data-del="'+i+'" aria-label="Remove '+esc(t.w)+'"><span class="material-icons-round" style="font-size:14px">close</span></button>':'')+
        '</span>'; }).join('')+'</div>';
    if(!live) return head+'<div class="cbox done-box">'+chips+'</div>';
    return head+'<div class="cbox">'+chips+
      (absent.length?'<div class="tp-warn">'+absent.length+' of these no longer appear in the passage: '+
        absent.map(function(t){return esc(t.w);}).join('、')+'</div>':'')+
      '<div class="tp-add"><input id="tpNew" placeholder="Add a teaching point, e.g. 一边…一边…" />'+
      '<select id="tpNewTy">'+Object.keys(TPT).map(function(k){ return '<option value="'+k+'">'+TPT[k].l+'</option>'; }).join('')+'</select>'+
      '<button class="qopt" data-tpadd="1">Add</button></div></div>'+
      '<div class="turn-acts"><button class="qopt" data-tpredo="1">Re-read the passage</button>'+
      '<button class="btnp sm-act" data-go="preview"'+(S.tps.length?'':' disabled style="opacity:.5"')+'>Looks right</button></div>';
  }

  /* 帶出課文 + 列出目前有的 QB 或 Teaching Point */
  function materialBody(live){
    var proj=S.proj||{};
    var tps=(proj.tps||[]).map(function(t){ return {w:t[0], ty:t[1]}; });
    var sents=textOf(proj.topic||S.topic).sents;
    var head=runIntro();
    var body='<div class="cbox"><span class="clbl">Article Content</span>'+
      sents.map(function(x){ return rubyLine(x.w)+'<div class="rtr">'+esc(x.t)+'</div>'; }).join('')+'</div>'+
      // same rule as the bank —— only shown when a chosen practice draws on it
      (needsTp(S.ep)
        ? '<div class="cbox"><span class="clbl">Teaching points · '+tps.length+'</span><div class="tps">'+
          tps.map(function(t){ var ty=TPT[t.ty];
            return '<span class="tp" style="font-size:12.5px;padding:3px 9px">'+esc(t.w)+
              '<span class="ty '+ty.c+'">'+ty.l+'</span></span>'; }).join('')+'</div></div>'
        : '')+
      // only worth showing when one of the chosen practices actually draws on it
      (needsBank(S.ep)
        ? '<div class="cbox"><span class="clbl">Question bank</span>'+
          (proj.bank? '<b style="font-size:13.5px">'+esc(proj.bank)+'</b>' +
                      '<div class="more-note">Multiple Choice · Comprehension / Fill in blank / Pinyin / Meaning</div>'
                    : '<span class="chip-empty">none yet</span>')+'</div>'
        : '');
    if(!live) return head+body;
    return head+body+'<div class="turn-acts"><span class="n">Need any changes?</span>'+
      '<button class="qopt" data-go="amend">Yes, let me change it</button>'+
      '<button class="btnp sm-act" data-go="noamend">No, carry on</button></div>';
  }

  /* ============ Mirroring 的設定，逐題問 ============
     選項取自 dahua-dash：SPEED_OPTIONS / PINYIN_PREFERENCES /
     TRANSLATION_PREFERENCES / VOICE_OPTIONS。 =========================== */
  var MIR_STEPS=['sentences','audiomode','englishfirst','pinyin','translation','autopass','speed','voice'];
  function nextMir(){
    var m=S.mir;
    if(!m.sentencesDone)      return 'sentences';
    if(m.audioMode===null)    return 'audiomode';
    if(m.englishFirst===null) return 'englishfirst';
    if(m.pinyin===null)       return 'pinyin';
    if(m.translation===null)  return 'translation';
    if(m.autoPass===null)     return 'autopass';
    if(m.speed===null)        return 'speed';
    if(m.voice===null)        return 'voice';
    return null;
  }
  /* one question, one answer */
  function askOne(name, head, opts, chosen){
    return function(live){
      if(!live) return head;
      return head+'<span class="qopts">'+opts.map(function(o){
        return '<button class="qopt" data-set="'+name+'" data-val="'+esc(String(o[0]))+'">'+esc(o[1])+'</button>';
      }).join('')+'</span>';
    };
  }

  function sentencesBody(live){
    var head='These become the sentences students record. Do you want to change how they are split, ordered, or drop any?';
    var list='<div class="cbox"><span class="clbl">Current sentences · '+S.sents.length+'</span>'+
      S.sents.map(function(x,i){
        var txt=x.w.map(function(p){return p[0];}).join('');
        return '<div class="srow2"><span class="sno">'+(i+1)+'</span><span class="stx">'+esc(txt)+'</span>'+
          (live?'<span class="sacts">'+
            '<button class="sbtn" data-mv="'+i+'" data-dir="-1" aria-label="Move up"'+(i?'':' disabled')+'>↑</button>'+
            '<button class="sbtn" data-mv="'+i+'" data-dir="1" aria-label="Move down"'+(i<S.sents.length-1?'':' disabled')+'>↓</button>'+
            '<button class="sbtn" data-split="'+i+'" aria-label="Split here" title="Split at the comma">⁄</button>'+
            '<button class="sbtn del" data-dels="'+i+'" aria-label="Delete">✕</button></span>':'')+
          '</div>';
      }).join('')+'</div>';
    if(!live) return head+list;
    return head+list+'<div class="turn-acts"><button class="btnp sm-act" data-go="sentdone">They’re fine</button></div>';
  }

  function audiomodeBody(live){
    var head='Should students be able to turn the on-screen support off while they practise? <span class="qhint">Audio Mode lets them control display support while listening and practicing.</span>';
    if(!live) return head;
    return head+'<span class="qopts">'+
      '<button class="qopt" data-set="audioMode" data-val="off">No, keep it as I set it</button>'+
      '<button class="qopt" data-set="audioMode" data-val="on">Yes, let them control it</button></span>';
  }

  function englishfirstBody(live){
    var head='Should they hear the English meaning first? <span class="qhint">Students hear the English meaning, then repeat the Chinese sentence.</span>';
    if(!live) return head;
    return head+'<span class="qopts">'+
      '<button class="qopt" data-set="englishFirst" data-val="on">Yes, English first</button>'+
      '<button class="qopt" data-set="englishFirst" data-val="off">No, Chinese only</button></span>';
  }

  var pinyinBody=askOne('pinyin','Should they see the pinyin?',
    [['PINYIN','Show it'],['NO_PINYIN','Hide it'],['STUDENT_CHOICE','Let them choose']]);
  var translationBody=askOne('translation','Should they see the translation?',
    [['SHOW','Show it'],['HIDE','Hide it'],['STUDENT_CHOICE','Let them choose']]);

  function autopassBody(live){
    var head='How many tries on one sentence before they move on anyway? <span class="qhint">They move on automatically even if they have not passed it.</span>';
    if(!live) return head;
    return head+'<span class="qopts"><span class="numfield">'+
      '<input id="apN" type="number" min="1" max="20" value="3" aria-label="Number of tries">'+
      '<span class="unit">tries</span></span>'+
      '<button class="qopt go" data-apgo="1">Use this</button></span>';
  }

  var speedBody=askOne('speed','How fast should the audio play?',
    [['Slow','Slow'],['Normal','Normal'],['Fast','Fast']]);

  /* ── voice: audition before you pick ── */
  var VOICES=[['Xiaorou','Female · warm'],['Xiaoyi','Female · clear'],['Yunxi','Male · steady']];
  function voiceBody(live){
    var head='Which voice should read the sentences? <span class="qhint">Play a sample before you pick.</span>';
    if(!live) return head;
    return head+'<div class="cbox"><span class="clbl">Voices · '+VOICES.length+'</span>'+
      VOICES.map(function(v){
        return '<div class="vrow">'+
          '<button class="sbtn" data-play="'+esc(v[0])+'" aria-label="Play a sample of '+esc(v[0])+'">'+
            '<span class="material-icons-round">play_arrow</span></button>'+
          '<span class="vnm"><b>'+esc(v[0])+'</b><span>'+esc(v[1])+'</span></span>'+
          '<button class="qopt" data-set="voice" data-val="'+esc(v[0])+'" data-say="'+esc(v[0])+'">Use this voice</button>'+
        '</div>';
      }).join('')+'</div>';
  }

  /* 這次要出幾題 */
  function qcountBody(live){
    var head='How many questions this time?';
    if(!live) return head;
    return head+'<span class="qopts">'+[5,8,10].map(function(n){
      return '<button class="qopt" data-qn="'+n+'">'+n+'</button>'; }).join('')+
      '</span><span class="qhint">The generator writes up to 10 per category.</span>';
  }

  /* 列出題目 */
  function qlistBody(live){
    var topic=(S.proj&&S.proj.topic)||S.topic;
    var C=textOf(topic);
    var head='Here are the questions —— <b>'+S.qn+'</b> in total, Multiple Choice × Comprehension.';
    var body='<div class="cbox">'+C.qs.map(function(q,i){
      return '<div class="qitem"><span class="qq">'+(i+1)+'. '+esc(q.q)+'</span><span class="qo">'+
        q.o.map(function(o,j){ return '<span'+(j===q.a?' class="right"':'')+'>'+esc(o)+'</span>'; }).join('')+
        '</span></div>'; }).join('')+
      '<div class="more-note">The other '+Math.max(0,S.qn-C.qs.length)+' follow the same shape.</div></div>';
    if(!live) return head+body;
    return head+body+'<div class="turn-acts">'+
      '<button class="qopt" data-go="requestions">Write them again</button>'+
      '<button class="btnp sm-act" data-go="tryout">Looks right</button></div>';
  }

  /* 作業指派給誰？ */
  /* One item, exactly as a student meets it, with the answers just given
     already applied —— the payoff for having answered the settings. */
  function tryoutCard(kind){
    var C=textOf((S.proj&&S.proj.topic)||S.topic);
    if(kind==='MIRRORING'){
      var list=S.sents.length?S.sents:C.sents;
      var rows=list.map(function(x){
        var hz=x.w.map(function(p){return p[0];}).join('');
        var line=S.mir.pinyin==='NO_PINYIN'
          ? '<div class="rline"><span class="wd"><span class="hz">'+esc(hz)+'</span></span></div>'
          : rubyLine(x.w);
        return '<div class="stu-s"><span class="pl material-icons-round">play_arrow</span>'+
          '<span class="bd">'+line+
          (S.mir.translation==='HIDE' ? '' : '<div class="rtr">'+esc(x.t)+'</div>')+'</span></div>';
      }).join('');
      var foot=[S.mir.voice, (S.mir.speed||'Normal')+' speed',
        'moves on after '+S.mir.autoPass+(S.mir.autoPass===1?' try':' tries'),
        S.mir.englishFirst==='on' ? 'English meaning first' : null,
        S.mir.audioMode==='on' ? 'they can hide the support' : null,
        S.mir.pinyin==='STUDENT_CHOICE' ? 'pinyin is theirs to toggle' : null,
        S.mir.translation==='STUDENT_CHOICE' ? 'translation is theirs to toggle' : null
      ].filter(Boolean).join(' · ');
      return '<div class="stu list">'+rows+'<div class="stu-foot">'+esc(foot)+'</div></div>';
    }
    if(kind==='SENTENCE_SCRAMBLE'){
      return '<div class="stu"><div class="stu-q">Put these in order</div>'+
        '<div class="stu-acts"><span class="stu-b"><span class="material-icons-round">volume_up</span>Listen</span></div>'+
        '<div class="stu-w" style="margin-top:14px">'+C.scram[1].map(function(w){
          return '<span>'+esc(w)+'</span>'; }).join('')+'</div>'+
        '<div class="stu-foot">Drag them into place</div></div>';
    }
    if(kind==='QA'){
      return '<div class="stu"><div class="stu-q">'+esc(C.prompts[0])+'</div>'+
        '<div class="stu-acts"><span class="stu-b"><span class="material-icons-round">volume_up</span>Listen</span>'+
        '<span class="stu-b rec"><span class="material-icons-round">mic</span>Hold to answer</span></div>'+
        '<div class="stu-foot">Question 1 of '+S.qn+'</div></div>';
    }
    if(kind==='VOCABULARY'){
      var tp=S.tps[0]||{w:'食物'};
      return '<div class="stu"><div class="stu-w"><span>'+esc(tp.w)+'</span></div>'+
        '<div class="stu-acts"><span class="stu-b"><span class="material-icons-round">volume_up</span>Listen</span>'+
        '<span class="stu-b rec"><span class="material-icons-round">mic</span>Hold to speak</span></div>'+
        '<div class="stu-foot">'+(S.tps.length||1)+' words in this set</div></div>';
    }
    if(kind==='VOCABULARY_MC'){
      var tp2=S.tps[0]||{w:'食物'};
      return '<div class="stu"><div class="stu-q">Which one means \u201C'+esc(tp2.w)+'\u201D?</div>'+
        '<div class="stu-o">'+['food','water','school','friend'].map(function(o){
          return '<span>'+esc(o)+'</span>'; }).join('')+'</div>'+
        '<div class="stu-foot">'+(S.tps.length||1)+' words in this set</div></div>';
    }
    var q=C.qs[0];
    return '<div class="stu"><div class="stu-q">'+esc(q.q)+'</div>'+
      '<div class="stu-o">'+q.o.map(function(o){ return '<span>'+esc(o)+'</span>'; }).join('')+'</div>'+
      '<div class="stu-foot">Question 1 of '+S.qn+'</div></div>';
  }

  function tryoutBody(live){
    var kind=S.ep[0];
    var rest=S.ep.slice(1).map(function(k){ return EP[k].t; });
    var scope=kind==='MIRRORING'
      ? 'All '+(S.sents.length||1)+' sentences'
      : 'One '+EP[kind].t+' item';
    var head='Here is what a student will see.'+
      '<span class="qhint">'+scope+', with everything you just chose already applied.'+
      (rest.length?' '+rest.join(' and ')+' follow the same settings.':'')+'</span>';
    var label=kind==='MIRRORING' ? 'Sentences · '+(S.sents.length||1) : 'Student view · '+EP[kind].t;
    var body='<div class="cbox"><span class="clbl">'+label+'</span>'+tryoutCard(kind)+'</div>';
    if(!live) return head+body;
    return head+body+'<div class="turn-acts">'+
      '<button class="btnp sm-act" data-go="assign">Looks right</button></div>';
  }

  function assignBody(live){
    var head='Who is this for?';
    if(!live) return head;
    return head+'<span class="qopts">'+['4A','3B','5C','6A'].map(function(c){
      return '<button class="qopt" data-cls="'+c+'">'+c+'</button>'; }).join('')+'</span>';
  }

  /* material-only runs have nothing to assign —— one last confirmation */
  /* Assigning is not one question —— the real form asks for a class, a
     schedule, whether it is optional, and who in the class it is for. */
  function startsBody(live){
    var head='When does it start? <span class="qhint">Students can open it from this moment.</span>';
    if(!live) return head;
    return head+'<span class="qopts">'+
      '<span class="numfield dt"><input type="datetime-local" id="dtStart" value="'+
        esc(S.sched.start||dtValue(new Date()))+'" aria-label="Start"></span>'+
      '<button class="qopt" data-startgo="pick">Use this</button>'+
      '<button class="qopt go" data-startgo="now">Now</button></span>';
  }

  function dueBody(live){
    var head='When is it due? <span class="qhint">Counted from '+esc(dtNice(S.sched.start))+'.</span>';
    if(!live) return head;
    return head+'<span class="qopts">'+[1,2,3,5,7].map(function(n){
        return '<button class="qopt" data-duedays="'+n+'">+'+n+' day'+(n===1?'':'s')+'</button>'; }).join('')+
      '</span><span class="qopts">'+
      '<span class="numfield dt"><input type="datetime-local" id="dtDue" value="'+
        esc(S.sched.due||plusDays(S.sched.start,1))+'" aria-label="Due"></span>'+
      '<button class="qopt" data-duego="1">Use this date</button></span>';
  }

  function optionalBody(live){
    var head='Is it required? <span class="qhint">Optional work sends no email and does not chase anyone.</span>';
    if(!live) return head;
    return head+'<span class="qopts">'+
      '<button class="qopt" data-opt="req">Required — email them</button>'+
      '<button class="qopt" data-opt="opt">Optional — no emails</button></span>';
  }

  function studentsBody(live){
    var all=ROSTER[S.cls]||[], sel=S.studs||[];
    var head='Which students? <span class="qhint">Everyone in '+esc(S.cls)+
      ' is in —— tap a row to leave someone out.</span>';
    var body='<div class="cbox"><span class="clbl">'+esc(S.cls)+' · '+sel.length+' of '+all.length+' selected</span>'+
      all.map(function(n,i){
        var on=sel.indexOf(n)>-1;
        return '<div class="srow2 stu'+(on?' on':'')+'"'+(live?' data-stu="'+i+'"':'')+'>'+
          '<span class="material-icons-round tick">'+(on?'check_box':'check_box_outline_blank')+'</span>'+
          '<span class="av">'+esc(initials(n))+'</span>'+
          '<span class="stx">'+esc(n)+'<span class="qhint">'+esc(mailOf(n))+'</span></span></div>';
      }).join('')+'</div>';
    if(!live) return head+body;
    return head+body+'<div class="turn-acts"><button class="btnp sm-act" data-go="create"'+
      (sel.length?'':' disabled style="opacity:.5"')+'>Assign to '+sel.length+'</button></div>';
  }

  function confirmBody(live){
    var made=S.ep.map(function(k){return EP[k].t;});
    if(S.mode==='project' && S.after==='handout') made.unshift('Handout');
    var head='Ready when you are.';
    var body='<div class="cbox"><b style="font-size:13.5px">'+
      (made.length? esc(made.join('、')) : esc(S.topic+' — new project'))+'</b>'+
      '<div class="more-note">Nothing here gets assigned —— it is teaching material.</div></div>';
    if(!live) return head+body;
    return head+body+'<div class="turn-acts"><button class="btnp sm-act" data-go="create">Create</button></div>';
  }

  function doneBody(){
    var on=S.rows.filter(function(r){return r.on;});
    var hasPractice=on.some(function(r){return r.kind==='practice';});
    return '<div class="done-turn"><span class="material-icons-round">check_circle</span>'+
      '<b>Created '+on.length+' item'+(on.length===1?'':'s')+
        (hasPractice?', assigned to '+S.studs.length+' in '+S.cls:'')+'</b>'+
      '<span>'+on.map(function(r){return esc(r.n);}).join(' · ')+'</span>'+
      (hasPractice?'<span>Due '+esc(dtNice(S.sched.due))+
        (S.sched.optional?' · optional, no emails':' · required')+'</span>':'')+
      '<span class="turn-acts">'+
        (hasPractice?'<a class="qopt" href="redesign-v10-practice.html">Open Practice List</a>':'')+
        '<a class="qopt" href="redesign-v10-projects.html">Open Projects</a>'+
        '<button class="qopt" data-go="again">Plan another</button></span></div>';
  }

  function questionBody(q){
    var body=esc(q.ask)+(q.hint?'<span class="qhint">'+esc(q.hint)+'</span>':'');
    if(q.multi){
      body+='<span class="qopts">'+q.opts.map(function(o){
        var on=pick.indexOf(o.v)>-1;
        return '<button class="qopt multi'+(on?' on':'')+'" data-pick="'+o.v+'">'+
          '<span class="material-icons-round">'+(on?'check_box':'check_box_outline_blank')+'</span>'+
          esc(o.t)+'<span class="sub">'+esc(o.s)+'</span></button>';
      }).join('')+'</span>'+
      (pick.length ? '<span class="qconfirm"><button class="qopt go" id="pickGo">Continue with '+pick.length+'</button></span>' : '');
    } else {
      body+='<span class="qopts">'+q.opts.map(function(o,i){
        return '<button class="qopt" data-ans="'+i+'">'+esc(o.t)+(o.s?'<span class="sub">'+esc(o.s)+'</span>':'')+'</button>';
      }).join('')+'</span>';
    }
    return body;
  }

  /* ---------------- render the whole thread ---------------- */
  var BODY={ passage:passageBody, tps:tpsBody, material:materialBody, qcount:qcountBody,
             qlist:qlistBody, assign:assignBody, confirm:confirmBody, done:doneBody,
             sentences:sentencesBody, audiomode:audiomodeBody, englishfirst:englishfirstBody,
             pinyin:pinyinBody, translation:translationBody, autopass:autopassBody,
             speed:speedBody, voice:voiceBody, tryout:tryoutBody,
             starts:startsBody, due:dueBody, optional:optionalBody, students:studentsBody };

  function renderChat(){
    var pendingQ = nextQuestion();
    var lastIdx = S.turns.length-1;

    var html=S.turns.map(function(t,i){
      var live = (i===lastIdx) && !pendingQ && !S.unsupported;
      var inner = t.kind==='text' ? esc(t.t) : BODY[t.kind](live);
      return '<div class="msg '+t.who+'"><span class="who">'+(t.who==='you'?'你':'AI')+'</span><span class="bub">'+inner+'</span></div>';
    }).join('');

    if(S.unsupported){
      html+='<div class="msg sys"><span class="who">AI</span><span class="bub"><div class="cant"><b>'+
        esc(S.unsupported.why)+'。</b> 最接近的是 <b>'+EP[S.unsupported.near].t+'</b> —— 要改成這個嗎？'+
        '<span class="qopts"><button class="qopt" data-near="'+S.unsupported.near+'">用 '+EP[S.unsupported.near].t+
        '</button><button class="qopt" data-near="">我自己選</button></span></div></span></div>';
    }
    S.askQ=pendingQ;
    if(pendingQ) html+='<div class="msg sys"><span class="who">AI</span><span class="bub">'+questionBody(pendingQ)+'</span></div>';

    $('#fnBody').innerHTML=html;
    var doneSlots = !!(S.ep.length && S.src && !S.askAmb && !S.unsupported);
    $('#q').placeholder = doneSlots ? 'Change anything —— just say so…' : PLACEHOLDERS[pi];
    injectBack();
    alignRows();
    syncChat(); renderHist();
    var b=$('#fnBody'); b.scrollTop=b.scrollHeight;
  }

  var STEP_KINDS=['passage','tps','material','qcount','qlist','tryout','assign','starts','due','optional','students','confirm','done'].concat(MIR_STEPS);
  /* Changing an answer invalidates every step that was derived from it. The
     question-and-answer history stays —— only the derived steps are dropped,
     and the correction is appended as a new turn. */
  function dropSteps(){
    S.turns=S.turns.filter(function(t){ return STEP_KINDS.indexOf(t.kind)<0; });
    S.fixed=false;
    S.rows=[]; S.sents=[]; S.tps=[]; S.thinking=false; editing=false;
    S.sched={start:null,due:null,optional:null}; S.studs=[];
  }
  /* ---------------- going back ----------------
     A snapshot is taken before every click but only kept if that click
     produced an answer. So Back always lands on the previous question ——
     never on a half-finished edit, and never on a step the teacher
     did not actually answer. */
  var HIST=[], pend=null;
  function mark(){ pend=JSON.stringify({s:S, p:pick, e:editing}); }
  function keep(){ if(pend){ HIST.push(pend); pend=null; if(HIST.length>80) HIST.shift(); } }
  function goBack(){
    if(!HIST.length) return;
    var o=JSON.parse(HIST.pop());
    Object.keys(S).forEach(function(k){ if(!(k in o.s)) S[k]=null; });
    Object.keys(o.s).forEach(function(k){ S[k]=o.s[k]; });
    pick=o.p; editing=o.e; S.thinking=false; pend=null;
    renderChat();
  }
  /* Back belongs to whatever is being asked right now, whichever body drew it,
     so it is added at render time —— leftmost in the footer, like any other
     secondary action. */
  function injectBack(){
    if(!HIST.length) return;
    var m=$('#fnBody').querySelectorAll('.msg.sys');
    if(!m.length) return;
    var bub=m[m.length-1].querySelector('.bub');
    if(!bub || bub.querySelector('.done-turn')) return;
    bub.insertAdjacentHTML('afterbegin',
      '<button class="bk" data-back="1"><span class="material-icons-round">arrow_back</span>Back</button>');
  }

  /* Alignment is read off what is actually on screen, so it holds for every
     step without each body having to declare it. A row hangs off the right
     unless it is a long list of cards —— three or more options that each
     carry a sub-label. Plain one-word buttons stay right however many
     there are. The caption is not an answer and is not counted. */
  function alignRows(){
    [].forEach.call($('#fnBody').querySelectorAll('.qopts, .turn-acts, .qconfirm'), function(row){
      var n=0, cards=0;
      [].forEach.call(row.children, function(c){
        if(c.classList.contains('n')) return;
        n++; if(c.querySelector('.sub')) cards++;
      });
      row.classList.toggle('mid', n>2 && cards===n);
    });
  }

  function ai(kind){ S.turns.push({who:'sys', kind:kind}); }
  function you(t){ keep(); S.turns.push({who:'you', kind:'text', t:t}); }
  function aiText(t){ S.turns.push({who:'sys', kind:'text', t:t}); }

  /* both answers in —— the run begins by itself, no extra button */
  function advance(){
    if(nextQuestion()) return;
    if(!S.mode) return;
    var last=S.turns[S.turns.length-1];
    if(last && STEP_KINDS.indexOf(last.kind)>-1) return;
    begin();
  }
  function begin(){
    if(S.mode==='project' || !S.src || S.src.kind!=='existing'){
      S.topic = S.q ? ((S.q.match(/[「『]([^」』]+)[」』]/)||[])[1] || guessTopic(S.q)) : '食物';
      S.sents = textOf(S.topic).sents.map(function(x){ return {w:x.w.slice(), t:x.t, edited:false}; });
      editing=false; ai('passage'); return;
    }
    S.proj=PROJECTS.filter(function(p){return p.sk===S.src.sk;})[0];
    S.sents=textOf(S.proj.topic).sents.map(function(x){ return {w:x.w.slice(), t:x.t, edited:false}; });
    S.tps=(S.proj.tps||[]).map(function(t){ return {w:t[0], ty:t[1]}; });
    ai('material');
  }

  /* the tail every run shares —— questions, then who it is for */
  function tail(){
    if(S.ep.indexOf('MIRRORING')>-1){
      var m=nextMir();
      if(m){ ai(m); return; }
    }
    if(makesQuestions(S.ep)){ ai('qcount'); return; }
    if(S.ep.length){ ai('tryout'); return; }
    ai('confirm');
  }

  /* ---------------- clicks anywhere in the thread ---------------- */
  $('#fnBody').addEventListener('click',function(e){
    if(e.target.closest('[data-back]')){ goBack(); return; }
    mark();
    var pk=e.target.closest('[data-pick]');
    if(pk){
      var v=pk.dataset.pick, i=pick.indexOf(v);
      if(i>-1) pick.splice(i,1);
      else { if(v==='PROJECT_ONLY') pick=[]; else pick=pick.filter(function(x){return x!=='PROJECT_ONLY';}); pick.push(v); }
      renderChat(); return;
    }
    if(e.target.closest('#pickGo')){
      aiText(S.askQ.ask); you(pick.map(function(k){return EP[k].t;}).join('、'));
      S.ep=pick.slice(); pick=[];
      if(!S.mode) S.mode='practice';
      advance(); renderChat(); return;
    }
    var near=e.target.closest('[data-near]');
    if(near){
      var k=near.dataset.near;
      aiText(S.unsupported.why); S.unsupported=null;
      if(k){ S.ep=[k]; you('改用 '+EP[k].t); }
      advance(); renderChat(); return;
    }
    var ans=e.target.closest('[data-ans]');
    if(ans&&S.askQ){
      var o=S.askQ.opts[+ans.dataset.ans], k=S.askQ.key;
      // "let me just say it" is not an answer —— it hands over to the composer
      // and leaves the question standing, so picking is still possible.
      if(k==='mode' && o.v==='say'){ $('#q').focus(); return; }
      aiText(S.askQ.ask); you(o.t);
      if(k==='amb'){ S.askAmb=null; S.mode='practice'; S.ep=[o.v]; }
      else if(k==='mode') S.mode=o.v;
      else if(k==='after') S.after=o.v;
      else if(k==='src') S.src = o.v==='new' ? {kind:'write'} : {kind:'existing', sk:null};
      else if(k==='pickproj') S.src={kind:'existing', sk:o.v};
      else if(k==='fill') S.fixed=true;
      advance(); renderChat(); return;
    }

    /* passage turn */
    if(e.target.closest('[data-txedit]')){
      if(editing){
        var lines=$('#txArea').value.split('\n').map(function(l){return l.trim();}).filter(Boolean);
        var old=S.sents.slice();
        S.sents=lines.map(function(l,i){
          var prev=old[i];
          if(prev && prev.w.map(function(p){return p[0];}).join('')===l) return prev;
          return {w:[[l,'']], t:'', edited:true};
        });
      }
      editing=!editing; renderChat(); return;
    }
    var dels=e.target.closest('[data-dels]');
    if(dels){ S.sents.splice(+dels.dataset.dels,1); renderChat(); return; }

    /* teaching-point turn */
    var del=e.target.closest('[data-del]');
    if(del){ S.tps.splice(+del.dataset.del,1); renderChat(); return; }
    if(e.target.closest('[data-tpadd]')){
      var v2=$('#tpNew').value.trim(); if(!v2) return;
      S.tps.push({w:v2, ty:$('#tpNewTy').value}); renderChat(); return;
    }
    if(e.target.closest('[data-tpredo]')){ S.tps=proposeTps(S.topic); renderChat(); say('Read the passage again'); return; }

    /* preview turn */
    var x2=e.target.closest('[data-x]');
    if(x2){ S.rows[+x2.dataset.x].open=!S.rows[+x2.dataset.x].open; renderChat(); return; }

    var st=e.target.closest('[data-set]');
    if(st){
      var f=st.dataset.set, v=st.dataset.val;
      if(f==='autoPass') S.mir.autoPass=+v; else S.mir[f]=v;
      you(st.dataset.say||st.textContent.trim()); tail(); renderChat(); return;
    }
    if(e.target.closest('[data-apgo]')){ autoPassGo(); return; }
    var pl=e.target.closest('[data-play]');
    if(pl){ playSample(pl); return; }
    if(e.target.closest('[data-mv]')){
      var mv=e.target.closest('[data-mv]'), i=+mv.dataset.mv, dir=+mv.dataset.dir;
      var t=S.sents.splice(i,1)[0]; S.sents.splice(i+dir,0,t); renderChat(); return;
    }
    var sp=e.target.closest('[data-split]');
    if(sp){
      var i2=+sp.dataset.split, sent=S.sents[i2];
      var txt=sent.w.map(function(p){return p[0];}).join('');
      var cut=txt.search(/[，,]/);
      if(cut<0){ say('No comma to split at'); return; }
      S.sents.splice(i2,1,{w:[[txt.slice(0,cut+1),'']],t:'',edited:true},
                          {w:[[txt.slice(cut+1),'']],t:'',edited:true});
      renderChat(); return;
    }
    var qn=e.target.closest('[data-qn]');
    if(qn){ S.qn=+qn.dataset.qn; you(S.qn+' questions'); ai('qlist'); renderChat(); return; }
    var cl=e.target.closest('[data-cls]');
    if(cl){ S.cls=cl.dataset.cls; you(S.cls); ai('starts'); renderChat(); return; }

    var sg=e.target.closest('[data-startgo]');
    if(sg){
      var now=sg.dataset.startgo==='now';
      S.sched.start = now ? dtValue(new Date()) : $('#dtStart').value;
      if(!S.sched.start){ say('Pick a start time'); return; }
      S.sched.due=plusDays(S.sched.start,1);
      you(now ? 'Now' : dtNice(S.sched.start)); ai('due'); renderChat(); return;
    }
    var dd=e.target.closest('[data-duedays]');
    if(dd){
      var n2=+dd.dataset.duedays;
      S.sched.due=plusDays(S.sched.start,n2);
      you('+'+n2+' day'+(n2===1?'':'s')); ai('optional'); renderChat(); return;
    }
    if(e.target.closest('[data-duego]')){
      var dv=$('#dtDue').value;
      if(!dv){ say('Pick a due date'); return; }
      S.sched.due=dv; you(dtNice(dv)); ai('optional'); renderChat(); return;
    }
    var op=e.target.closest('[data-opt]');
    if(op){
      S.sched.optional = op.dataset.opt==='opt';
      S.studs=(ROSTER[S.cls]||[]).slice();
      you(op.textContent.trim()); ai('students'); renderChat(); return;
    }
    var st2=e.target.closest('[data-stu]');
    if(st2){
      var nm=(ROSTER[S.cls]||[])[+st2.dataset.stu], at=S.studs.indexOf(nm);
      if(at>-1) S.studs.splice(at,1); else S.studs.push(nm);
      renderChat(); return;
    }

    /* the one button that moves the thread on */
    var go=e.target.closest('[data-go]');
    if(go) step(go.dataset.go);
  },false);

  $('#fnBody').addEventListener('change',function(e){
    var sw=e.target.closest('[data-sw]');

  $('#fnBody').addEventListener('keydown',function(e){

  function autoPassGo(){
    var n=parseInt(($('#apN')||{}).value,10);
    if(!n||n<1||n>20){ say('Enter between 1 and 20 tries'); return; }
    S.mir.autoPass=n; you(n+(n===1?' try':' tries')); tail(); renderChat();
  }

  /* mock playback —— the button holds a playing state for as long as a sample would run */
  var playT;
  function playSample(btn){
    [].forEach.call(document.querySelectorAll('[data-play]'),function(b){
      b.classList.remove('on'); b.querySelector('.material-icons-round').textContent='play_arrow'; });
    btn.classList.add('on'); btn.querySelector('.material-icons-round').textContent='volume_up';
    say('Playing a sample —— '+btn.dataset.play);
    clearTimeout(playT);
    playT=setTimeout(function(){
      if(!btn.isConnected) return;
      btn.classList.remove('on'); btn.querySelector('.material-icons-round').textContent='play_arrow';
    },1800);
  }

  function step(what){
    if(what==='tps'){
      if(editing) return;
      if(!S.sents.length){ say('Add at least one sentence'); return; }
      you('Looks right');
      // practices were picked but none of them draw on teaching points —— skip that step
      if(S.ep.length && !needsTp(S.ep)){ tail(); renderChat(); return; }
      if(!S.tps.length) S.tps=proposeTps(S.topic); ai('tps'); renderChat(); return;
    }
    if(what==='preview'){
      if(!S.tps.length){ say('At least one teaching point is required'); return; }
      you('Looks right'); tail(); renderChat(); return;
    }
    if(what==='sentdone'){ S.mir.sentencesDone=true; you('They’re fine'); tail(); renderChat(); return; }
    if(what==='noamend'){ you('No, carry on'); tail(); renderChat(); return; }
    if(what==='amend'){
      you('Yes, let me change it'); editing=false; ai('passage'); renderChat(); return;
    }
    if(what==='requestions'){ you('Write them again'); say('Rewriting the questions'); renderChat(); return; }
    if(what==='tryout'){ you('Looks right'); ai('tryout'); renderChat(); return; }
    if(what==='assign'){ you('Looks right'); ai('assign'); renderChat(); return; }
    if(what==='create'){
      S.rows=composeRows();
      var on=S.rows.filter(function(r){return r.on;}); if(!on.length) return;
      if(on.some(function(r){return r.kind==='text';})){
        PROJECTS.unshift({sk:'new'+PROJECTS.length, name:S.topic+' — new project', topic:S.topic, level:'HSK 1', sents:6,
          bank:on.some(function(r){return r.kind==='bank';})?S.topic+' — Exit questions':null,
          tps:S.tps.map(function(t){return [t.w,t.ty];})});
      }
      ai('done'); renderChat(); say('Created '+on.length+' item'+(on.length===1?'':'s')); return;
    }
    if(what==='again'||what==='restart'){ newPlan(); }
  }


  /* ---------------- the composer ---------------- */
  var pi=0;
  setInterval(function(){
    if(document.activeElement===$('#q')||$('#q').value||(S.ep.length&&S.src)) return;
    pi=(pi+1)%PLACEHOLDERS.length; $('#q').placeholder=PLACEHOLDERS[pi];
  },3800);
  function syncMake(){ $('#makeBtn').disabled=$('#q').value.trim().length<4; }
  $('#q').addEventListener('input',function(){
    syncMake(); this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px';
  });
  $('#q').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&!$('#makeBtn').disabled){ e.preventDefault(); fromPrompt(); }
  });
  $('#makeBtn').addEventListener('click',fromPrompt);

  function fromPrompt(){
    var q=$('#q').value.trim(); if(q.length<4) return;
    mark();
    var r=parse(q);
    S.q=q; 
    if(r.ep.length||r.src||r.ambiguous||r.unsupported) dropSteps();
    you(q);
    if(r.ep.length){ S.ep=r.ep.filter(function(k){return EP_PRACTICE.indexOf(k)>-1;}); if(S.ep.length) S.mode='practice'; }
    if(r.src) S.src=r.src.kind==='existing'?{kind:'existing', sk:r.src.sk}:r.src;
    if(r.cls) S.cls=r.cls;
    S.unsupported=r.unsupported; S.askAmb=r.ambiguous;
    pick=[];
    $('#q').value=''; $('#q').style.height='auto'; syncMake();
    advance(); renderChat();
  }
  function renderStart(){ pick=[]; renderChat(); }

  /* ---------------- history ----------------
     Every conversation is a snapshot of the same state the live one runs on,
     so opening an old plan gives back a real thread —— the steps redraw from
     their own answers rather than from a stored picture of themselves. */
  var CHATS=[], curId=0, nextId=1;
  var BLANK={ mode:null, after:null, ep:[], src:null, fixed:false, cls:null, q:null, topic:'食物',
              sents:[], tps:[], rows:[], qn:10, askQ:null, turns:[], thinking:false, sched:{start:null,due:null,optional:null}, studs:[], proj:null,
              askAmb:null, unsupported:null,
              mir:{ sentencesDone:false, audioMode:null, englishFirst:null, pinyin:null,
                    translation:null, autoPass:null, speed:null, voice:null } };

  function loadState(o){
    Object.keys(S).forEach(function(k){ if(!(k in o)) S[k]=null; });
    Object.keys(o).forEach(function(k){ S[k]=o[k]; });
    S.thinking=false; editing=false; pick=[]; HIST=[]; pend=null;
  }

  var MIR_ASK=[['audiomode','No, keep it as I set it'],['englishfirst','No, Chinese only'],
               ['pinyin','Show it'],['translation','Show it'],['autopass','3 tries'],
               ['speed','Normal'],['voice','Xiaorou']];

  /* A finished run, built by putting the real state in place and letting the
     real bodies draw it —— composeRows() below is the same call the live
     Create uses. */
  function seedChat(o){
    var back=JSON.stringify(S);
    var proj=ALL_PROJECTS.filter(function(p){return p.sk===o.sk;})[0];
    var C=textOf(proj.topic);
    loadState(JSON.parse(JSON.stringify(BLANK)));
    S.mode='practice'; S.ep=o.ep.slice(); S.src={kind:'existing', sk:o.sk}; S.fixed=true;
    S.cls=o.cls; S.topic=proj.topic; S.proj=proj; S.qn=o.qn||10;
    S.sents=C.sents.map(function(x){ return {w:x.w.slice(), t:x.t, edited:false}; });
    S.tps=(proj.tps||[]).map(function(t){ return {w:t[0], ty:t[1]}; });
    S.mir={ sentencesDone:true, audioMode:'off', englishFirst:'off', pinyin:'PINYIN',
            translation:'SHOW', autoPass:3, speed:'Normal', voice:'Xiaorou' };
    S.sched={ start:o.start, due:plusDays(o.start,o.days||1), optional:false };
    S.studs=(ROSTER[o.cls]||[]).slice();
    S.rows=composeRows();
    var t=[];
    function qa(q,a){ t.push({who:'sys',kind:'text',t:q}); t.push({who:'you',kind:'text',t:a}); }
    qa('What are we making today?','Practices');
    qa('Which practices?', o.ep.map(function(k){ return EP[k].t; }).join('、'));
    qa('Build them from a Project you already have?','Yes');
    qa('Which one?', proj.name);
    t.push({who:'sys',kind:'material'}); t.push({who:'you',kind:'text',t:'No, carry on'});
    if(o.ep.indexOf('MIRRORING')>-1){
      t.push({who:'sys',kind:'sentences'}); t.push({who:'you',kind:'text',t:'They’re fine'});
      MIR_ASK.forEach(function(x){ t.push({who:'sys',kind:x[0]}); t.push({who:'you',kind:'text',t:x[1]}); });
    }
    if(makesQuestions(S.ep)){
      t.push({who:'sys',kind:'qcount'}); t.push({who:'you',kind:'text',t:S.qn+' questions'});
      t.push({who:'sys',kind:'qlist'}); t.push({who:'you',kind:'text',t:'Looks right'});
    }
    t.push({who:'sys',kind:'tryout'}); t.push({who:'you',kind:'text',t:'Looks right'});
    t.push({who:'sys',kind:'assign'}); t.push({who:'you',kind:'text',t:o.cls});
    t.push({who:'sys',kind:'starts'}); t.push({who:'you',kind:'text',t:'Now'});
    t.push({who:'sys',kind:'due'}); t.push({who:'you',kind:'text',t:'+'+(o.days||1)+' day'+((o.days||1)===1?'':'s')});
    t.push({who:'sys',kind:'optional'}); t.push({who:'you',kind:'text',t:'Required — email them'});
    t.push({who:'sys',kind:'students'}); t.push({who:'you',kind:'text',t:'Assign to '+S.studs.length});
    t.push({who:'sys',kind:'done'});
    S.turns=t;
    var snap=JSON.stringify(S);
    loadState(JSON.parse(back));
    return {id:nextId++, at:o.at, s:snap};
  }

  function chatTitle(st){
    var proj = st.src && st.src.kind==='existing' && st.src.sk
      ? (ALL_PROJECTS.filter(function(p){return p.sk===st.src.sk;})[0]||{}).name : null;
    var what = (st.ep && st.ep.length) ? st.ep.map(function(k){ return EP[k].t; }).join(' + ')
             : (st.mode==='project' ? 'New Project' : null);
    if(!what && !proj) return 'New plan';
    return [what, proj ? proj.split(' — ')[0] : null].filter(Boolean).join(' · ');
  }
  function chatSub(st){
    if((st.turns||[]).some(function(t){ return t.kind==='done'; }))
      return 'Created' + (st.cls ? ' · assigned to '+st.cls : '');
    var n=(st.turns||[]).filter(function(t){ return t.who==='you'; }).length;
    return n ? n+' answer'+(n===1?'':'s') : 'Nothing answered yet';
  }

  function syncChat(){
    for(var i=0;i<CHATS.length;i++) if(CHATS[i].id===curId){ CHATS[i].s=JSON.stringify(S); return; }
  }
  function renderHist(){
    var seen={}, html='';
    CHATS.forEach(function(c){
      if(!seen[c.at]){ seen[c.at]=1; html+='<div class="hist-g">'+esc(c.at)+'</div>'; }
      var st=JSON.parse(c.s);
      html+='<button class="hist-i'+(c.id===curId?' on':'')+'" data-chat="'+c.id+'">'+
        '<b>'+esc(chatTitle(st))+'</b><span>'+esc(chatSub(st))+'</span></button>';
    });
    $('#histList').innerHTML=html;
  }
  function openChat(id){
    if(id===curId) return;
    syncChat();
    for(var i=0;i<CHATS.length;i++) if(CHATS[i].id===id){ curId=id; loadState(JSON.parse(CHATS[i].s)); break; }
    renderChat();
  }
  function newPlan(){
    syncChat();
    loadState(JSON.parse(JSON.stringify(BLANK)));
    S.proj=PROJECTS[0]||null;
    var c={id:nextId++, at:'Today', s:JSON.stringify(S)};
    CHATS.unshift(c); curId=c.id;
    $('#q').value=''; syncMake(); renderChat();
  }

  $('#histNew').addEventListener('click', newPlan);
  $('#histList').addEventListener('click', function(e){
    var i=e.target.closest('[data-chat]');
    if(i) openChat(+i.dataset.chat);
  });
  $('#histToggle').addEventListener('click', function(){
    var off=$('#hist').classList.toggle('off');
    this.setAttribute('aria-expanded', String(!off));
    this.setAttribute('aria-label', off ? 'Show history' : 'Hide history');
  });

  function guessTopic(q){
    var hit='食物';
    Object.keys(TEXTS).forEach(function(t){ if(q.indexOf(t)>-1) hit=t; });
    return hit;
  }
  function stagesHtml(){
    var newProj = !(S.src && S.src.kind==='existing' && S.src.sk);
    var st=[ newProj, newProj, needsBank(S.ep), needsBank(S.ep), hasPractice(S.ep) ];
    return '<span class="lb">HOW FAR THIS RUN GOES</span>'+STAGE_LABELS.map(function(l,i){
      return '<span class="stg'+(st[i]?' on':'')+'">'+l+'</span>'+(i<4?'<span class="arrow">›</span>':'');
    }).join('');
  }
  function inPassage(word){ return S.sents.map(function(x){return x.w.map(function(p){return p[0];}).join('');}).join('').indexOf(word)>-1; }
  function tpsForPath(){
    if(S.src && S.src.kind!=='existing') return S.tps;
    return (S.proj?S.proj.tps:[]).map(function(t){ return {w:t[0], ty:t[1]}; });
  }

  /* ================= empty-state demo ================= */
  $('#demoEmpty').addEventListener('change',function(){
    PROJECTS = this.checked ? [] : ALL_PROJECTS.slice();
    S.proj = PROJECTS[0]||null;
    if(this.checked && S.src && S.src.kind==='existing') S.src=null;
    renderStart();
    say(this.checked ? 'No Projects at all — every endpoint still works, the material just has to be new'
                     : 'Projects restored');
  });

  var BOOT=dtValue(new Date());
  CHATS=[ seedChat({sk:'p1', ep:['VOCABULARY','SENTENCE_SCRAMBLE'], cls:'5C', at:'Last week', start:BOOT, days:7}) ];
  CHATS.unshift(seedChat({sk:'p2', ep:['MULTIPLE_CHOICE'], cls:'3B', qn:10, at:'Yesterday', start:BOOT, days:3}));
  CHATS.unshift(seedChat({sk:'p1', ep:['MIRRORING'], cls:'4A', at:'Yesterday', start:BOOT, days:2}));
  CHATS.unshift({id:nextId++, at:'Today', s:JSON.stringify(S)});
  curId=CHATS[0].id;
  renderStart(); syncMake();
})();
</script>
</body>
