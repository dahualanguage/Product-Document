<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redesign v9 — Teacher · Classes (DAHUA AI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
<link rel="stylesheet" href="assets-v11/teacher-shell.css" />
<style>
  .ccov{ height:8px; }
  .cbody{ padding:16px; }
  .cbody .cn{ display:flex; align-items:center; gap:10px; }
  .cbody .cn .cb{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:#fff;
    font-weight:800; font-size:15px; flex:none; }
  .cbody .cn b{ font-size:16px; font-weight:800; color:var(--ink); letter-spacing:-.2px; }
  .cbody .cn span{ display:block; font-size:12px; font-weight:600; color:var(--muted); }
  .cbody .cn .more{ margin-left:auto; }
  .roster{ margin-top:14px; padding-top:13px; border-top:1px solid var(--line-2); }
  .avstack{ display:flex; align-items:center; }
  .avstack .a{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:#fff;
    font-size:10.5px; font-weight:800; border:2px solid #fff; margin-left:-8px; flex:none; }
  .avstack .a:first-child{ margin-left:0; }
  .avstack .rest{ margin-left:8px; font-size:12px; font-weight:700; color:var(--muted); }
  .cfacts{ display:flex; gap:16px; margin-top:13px; }
  .cfact .k{ font-size:11px; font-weight:700; color:var(--faint); }
  .cfact .v{ font-size:16px; font-weight:800; color:var(--ink); }
  .cfact .v small{ font-size:11.5px; font-weight:700; color:var(--muted); }

  .stu-row{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; }
  .stu-row:hover{ background:#f6f9fc; }
  .stu-row + .stu-row{ box-shadow:inset 0 1px 0 var(--line-2); }
  .stu-row .a{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:#fff;
    font-size:12px; font-weight:800; flex:none; }
  .stu-row .st{ flex:1; min-width:0; }
  .stu-row .st b{ display:block; font-size:13.5px; font-weight:800; color:var(--ink); }
  .stu-row .st span{ font-size:12px; font-weight:600; color:var(--muted); }
  .stu-row .rm{ border:none; background:none; cursor:pointer; color:var(--faint); display:grid; place-items:center;
    width:30px; height:30px; border-radius:8px; }
  .stu-row .rm:hover{ background:var(--rose-bg); color:var(--rose); }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:800; color:var(--slate); margin-bottom:6px; }
  .field input,.field select{ width:100%; height:38px; border:1px solid var(--line); border-radius:10px; padding:0 12px;
    font:inherit; font-size:13.5px; font-weight:600; color:var(--ink); background:#fff; }
  .field input:focus,.field select:focus{ outline:none; border-color:var(--emerald-ring); box-shadow:0 0 0 3px var(--emerald-l2); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .code{ display:flex; align-items:center; gap:10px; padding:13px 15px; border-radius:12px; background:var(--emerald-l);
    border:1px solid var(--emerald-l2); }
  .code b{ font-size:20px; font-weight:800; letter-spacing:2px; color:var(--emerald-dd); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side" data-current="classes"></aside>

  <div class="main">
    <div class="pagebar">
      <button class="navtoggle" data-navtoggle aria-label="Open menu" aria-expanded="false"><span class="material-icons-round">menu</span></button>
      <div class="hdr-ic"><span class="material-icons-round">school</span></div>
      <div class="dt"><b>Classes</b><span>Your classrooms and who is in them</span></div>
      <div class="pb-acts">
        <button class="btn-ghost" id="inviteBtn"><span class="material-icons-round" style="font-size:17px">mail</span> Invite students</button>
        <button class="btnp" id="newBtn"><span class="material-icons-round">add</span> New Classroom</button>
      </div>
    </div>

    <div class="page">
      <div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:640px">
        <div class="stat">
          <div class="si" style="background:var(--emerald-l);color:var(--emerald-d)"><span class="material-icons-round">school</span></div>
          <div class="k">Total Classrooms</div><div class="v" id="nCls">0</div>
          <div class="d neutral">All classes in program</div>
        </div>
        <div class="stat">
          <div class="si" style="background:var(--qa-bg);color:var(--qa)"><span class="material-icons-round">groups</span></div>
          <div class="k">Total Students Enrolled</div><div class="v" id="nStu">0</div>
          <div class="d neutral">Across all classrooms</div>
        </div>
      </div>

      <div class="sec-t"><h2>Classrooms</h2><span class="hint">Click a card to manage its students</span></div>
      <div class="cgrid" id="grid" style="padding:0"></div>
    </div>
  </div>
</div>

<div class="ov" id="ov"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mh"><span class="material-icons-round" id="mIcon" style="color:var(--emerald)">school</span>
    <h3 id="mTitle">Classroom</h3>
    <button class="x" id="mClose" aria-label="Close"><span class="material-icons-round">close</span></button></div>
  <div class="mb" id="mBody"></div>
  <div class="mf" id="mFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script src="assets-v11/teacher-nav.js"></script>
<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s);};
  var tt; function say(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2400);}
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  var HUES=['#059669','#2563eb','#d97706','#7c3aed','#e11d48','#0891b2'];
  function hue(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return HUES[Math.abs(h)%HUES.length]; }
  function initials(n){ return n.split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }

  var DATA=[
    {id:'4A',grade:'Grade 4',lv:'HSK 1',open:3,students:[
      'Emma Chen','Liam Wu','Sofia Ríos','Noah Park','Aria Singh','Ben Cohen',
      'Mia Tanaka','Leo Alvarez','Zoe Kim','Ivan Petrov','Hana Sato','Omar Haddad']},
    {id:'3B',grade:'Grade 3',lv:'HSK 1',open:2,students:[
      'Ada Lin','Theo Brandt','Nina Rossi','Sam Okafor','Yuki Mori','Pablo Díaz',
      'Grace Hall','Ravi Menon','Elsa Berg','Tom Fischer']},
    {id:'5C',grade:'Grade 5',lv:'HSK 2',open:4,students:[
      'Ruby Ng','Jonas Weber','Lea Dubois','Kai Nakamura','Ines Costa','Mark Ellis',
      'Anya Volkov','Diego Cruz','Sara Ahmed','Finn O’Brien','Lucy Tan','Otto Klein','Maya Levi','Ken Ito']},
    {id:'6A',grade:'Grade 6',lv:'HSK 2',open:2,students:[
      'Iris Zhao','Hugo Marchand','Nadia Rahman','Peter Novak','Amara Obi','Jin Watanabe',
      'Clara Voss','Ali Karim','Tess Moreau','Rui Almeida','Vera Ilić']}
  ];

  function stats(){
    $('#nCls').textContent=DATA.length;
    $('#nStu').textContent=DATA.reduce(function(a,c){return a+c.students.length;},0);
  }

  function card(c){
    var col=hue(c.id);
    var shown=c.students.slice(0,5);
    return '<div class="ccard" data-open="'+esc(c.id)+'">'+
      '<div class="ccov" style="background:'+col+'"></div>'+
      '<div class="cbody">'+
        '<div class="cn"><span class="cb" style="background:'+col+'">'+esc(c.id)+'</span>'+
          '<span><b>'+esc(c.id)+'</b><span>'+esc(c.grade)+' · '+esc(c.lv)+'</span></span>'+
          '<button class="btn-sm more" data-menu="'+esc(c.id)+'" aria-label="More actions" style="height:30px;padding:0 7px"><span class="material-icons-round">more_horiz</span></button>'+
        '</div>'+
        '<div class="roster"><span class="avstack">'+
          shown.map(function(s){return '<span class="a" style="background:'+hue(s)+'">'+esc(initials(s))+'</span>';}).join('')+
          (c.students.length>5?'<span class="rest">+'+(c.students.length-5)+' more</span>':'')+
        '</span></div>'+
        '<div class="cfacts">'+
          '<span class="cfact"><span class="k">Students</span><span class="v">'+c.students.length+'</span></span>'+
          '<span class="cfact"><span class="k">Open work</span><span class="v">'+c.open+' <small>practices</small></span></span>'+
        '</div>'+
      '</div>'+
      '<div class="cf"><button class="btn-sm" data-manage="'+esc(c.id)+'" style="flex:1;justify-content:center">'+
        '<span class="material-icons-round">group_add</span>Manage students</button></div>'+
    '</div>';
  }

  function render(){ $('#grid').innerHTML=DATA.map(card).join(''); stats(); }

  /* ---------- modal plumbing ---------- */
  function open(icon,title,body,foot){
    $('#mIcon').textContent=icon; $('#mTitle').textContent=title;
    $('#mBody').innerHTML=body; $('#mFoot').innerHTML=foot;
    $('#ov').classList.add('on'); $('#modal').classList.add('on');
  }
  function close(){ $('#ov').classList.remove('on'); $('#modal').classList.remove('on'); }
  $('#mClose').addEventListener('click',close);
  $('#ov').addEventListener('click',close);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });

  function classForm(c){
    return '<div class="field"><label>Classroom Name</label><input id="fName" value="'+esc(c?c.id:'')+'" placeholder="e.g. 4A" /></div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Grade System</label><select id="fGrade">'+
          ['Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6'].map(function(g){
            return '<option'+(c&&c.grade===g?' selected':'')+'>'+g+'</option>';}).join('')+'</select></div>'+
        '<div class="field"><label>Level</label><select id="fLevel">'+
          ['HSK 1','HSK 2','HSK 3','HSK 4'].map(function(l){
            return '<option'+(c&&c.lv===l?' selected':'')+'>'+l+'</option>';}).join('')+'</select></div>'+
      '</div>';
  }

  function manageBody(c){
    return '<p style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px">'+
      c.students.length+' students in '+esc(c.id)+'. Remove someone, or invite more with a code.</p>'+
      '<div role="group" aria-label="Students list" style="max-height:320px;overflow:auto;margin:0 -4px">'+
      c.students.map(function(s,i){
        return '<div class="stu-row"><span class="a" style="background:'+hue(s)+'">'+esc(initials(s))+'</span>'+
          '<span class="st"><b>'+esc(s)+'</b><span>joined 12 Aug</span></span>'+
          '<button class="rm" data-rm="'+i+'" aria-label="Remove '+esc(s)+'"><span class="material-icons-round">close</span></button></div>';
      }).join('')+'</div>';
  }

  document.addEventListener('click',function(e){
    var mg=e.target.closest('[data-manage]'), mn=e.target.closest('[data-menu]'), op=e.target.closest('[data-open]');

    if(mg||(op&&!mn)){
      e.stopPropagation();
      var id=(mg||op).getAttribute('data-manage')||(mg||op).getAttribute('data-open');
      var c=DATA.filter(function(x){return x.id===id;})[0];
      open('group','Students in '+c.id, manageBody(c),
        '<button class="btn-sm" id="mCancel">Close</button><button class="btnp" id="mInvite">Invite students</button>');
      $('#mCancel').onclick=close;
      $('#mInvite').onclick=function(){ invite(c.id); };
      $('#mBody').onclick=function(ev){
        var r=ev.target.closest('[data-rm]'); if(!r) return;
        var name=c.students.splice(+r.dataset.rm,1)[0];
        $('#mBody').innerHTML=manageBody(c); render(); say('Removed '+name+' from '+c.id);
      };
      return;
    }

    if(mn){
      e.stopPropagation();
      var cc=DATA.filter(function(x){return x.id===mn.dataset.menu;})[0];
      open('edit','Edit '+cc.id, classForm(cc),
        '<button class="btn-sm" id="mDel" style="color:var(--rose);border-color:#fecdd3;margin-right:auto">Delete classroom</button>'+
        '<button class="btn-sm" id="mCancel">Cancel</button><button class="btnp" id="mSave">Save changes</button>');
      $('#mCancel').onclick=close;
      $('#mSave').onclick=function(){
        cc.id=$('#fName').value||cc.id; cc.grade=$('#fGrade').value; cc.lv=$('#fLevel').value;
        close(); render(); say('Classroom updated');
      };
      $('#mDel').onclick=function(){
        DATA.splice(DATA.indexOf(cc),1); close(); render(); say('Deleted '+cc.id);
      };
    }
  },true);

  function invite(cls){
    var code=String(Math.floor(100000+Math.random()*899999));
    open('mail','Invite students',
      '<p style="font-size:13px;color:var(--muted);font-weight:600;margin-bottom:14px">'+
      'Share this code with '+esc(cls||'your class')+'. Students enter it once and land in the right classroom.</p>'+
      '<div class="code"><span class="material-icons-round" style="color:var(--emerald-d)">key</span><b>'+code+'</b>'+
      '<button class="btn-sm" id="cp" style="margin-left:auto">Copy</button></div>'+
      '<p style="font-size:12px;color:var(--faint);font-weight:600;margin-top:12px">Expires in 7 days · 3 invitations still pending</p>',
      '<button class="btn-sm" id="mCancel">Close</button><button class="btnp" id="mMail">Email the code</button>');
    $('#mCancel').onclick=close;
    $('#cp').onclick=function(){ say('Code copied'); };
    $('#mMail').onclick=function(){ close(); say('Invitations sent'); };
  }

  $('#inviteBtn').addEventListener('click',function(){ invite(null); });
  $('#newBtn').addEventListener('click',function(){
    open('add','New Classroom', classForm(null),
      '<button class="btn-sm" id="mCancel">Cancel</button><button class="btnp" id="mCreate">Create</button>');
    $('#mCancel').onclick=close;
    $('#mCreate').onclick=function(){
      var n=$('#fName').value.trim(); if(!n){ say('Give the classroom a name'); return; }
      DATA.push({id:n,grade:$('#fGrade').value,lv:$('#fLevel').value,open:0,students:[]});
      close(); render(); say('Created '+n);
    };
  });

  render();
})();
</script>
</body>
</html>
